function getOrCreateDeviceSeed() {
    try {
        let seed =
            localStorage.getItem(
                DEVICE_SEED_KEY
            );

        if (!seed) {
            if (
                window.crypto &&
                crypto.randomUUID
            ) {
                seed =
                    crypto.randomUUID() +
                    "-" +
                    Date.now() +
                    "-" +
                    Math.random();
            } else {
                seed =
                    Date.now() +
                    "-" +
                    Math.random() +
                    "-" +
                    Math.random();
            }

            localStorage.setItem(
                DEVICE_SEED_KEY,
                seed
            );
        }

        return seed;
    }
    catch (error) {
        return null;
    }
}

async function sha256(text) {
    const data =
        new TextEncoder().encode(text);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(hashBuffer)
        );

    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");
}

async function getAdminDeviceId() {
    try {
        const saved =
            localStorage.getItem(
                DEVICE_ID_KEY
            );

        if (
            saved &&
            /^[a-f0-9]{64}$/i.test(saved)
        ) {
            return saved;
        }

        const seed =
            getOrCreateDeviceSeed();

        if (!seed) {
            return null;
        }

        const deviceId =
            await sha256(
                "MCQ-WINNER-ADMIN-DEVICE|" +
                seed
            );

        localStorage.setItem(
            DEVICE_ID_KEY,
            deviceId
        );

        return deviceId;
    }
    catch (error) {
        console.error(
            "Device ID error:",
            error
        );
        return null;
    }
}

async function isTrustedAdminDevice() {
    const deviceId =
        await getAdminDeviceId();

    if (!deviceId) {
        return false;
    }

    try {
        const deviceRef =
            doc(
                db,
                ADMIN_DEVICE_COLLECTION,
                deviceId
            );

        const deviceSnap =
            await getDoc(deviceRef);

        if (!deviceSnap.exists()) {
            return false;
        }

        const deviceData =
            deviceSnap.data();

        return (
            deviceData.trusted === true &&
            deviceData.active === true &&
            deviceData.uid === ADMIN_UID
        );
    }
    catch (error) {
        console.error(
            "Admin device check error:",
            error
        );
        return false;
    }
}

======================================== */

function normalizePhone(phone) {

    let cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    if (
        cleanPhone.startsWith("0")
    ) {

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }


    return cleanPhone;

}


/* ========================================
   PHONE → LOGIN EMAIL
======================================== */

function makeLoginEmail(phone) {

    const cleanPhone =
        normalizePhone(phone);


    return (
        cleanPhone +
        "@mcqwinner.local"
    );

}


/* ========================================
   PHONE VALIDATION
======================================== */

function isValidSriLankanPhone(phone) {

    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}

                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }

);


/* ========================================
   STUDENT LOGIN
======================================== */

loginButton.addEventListener(

    "click",

    async function() {

        loginButton.disabled =
            true;

        showMessage(
            "Login verify කරමින්..."
        );


        try {

            const phone =
                loginPhone
                    .value
                    .trim();


            const password =
                loginPassword
                    .value;


            /* ================================
               REQUIRED
            ================================= */

            if (
                !phone ||
                !password
            ) {

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            /* ================================
               PHONE
            ================================= */

            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            /* ================================
               FIREBASE AUTH VERIFY
            ================================= */

            const result =
                await signInWithEmailAndPassword(

                    auth,

                    loginEmail,

                    password

                );


            const user =
                result.user;


            const uid =
                user.uid;


            /* ================================
               FIRESTORE PROFILE VERIFY
            ================================= */

            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const studentData =
                userSnap.data();


            /* ================================
               ADMIN ACCOUNT CANNOT USE
               STUDENT LOGIN
            ================================= */

            if (
                studentData.role ===
                "admin"
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙය Student account එකක් නොවේ. Admin Login භාවිතා කරන්න."
                );

            }


            /* ================================
               SESSION
            ================================= */

            sessionStorage.setItem(
                "mcqLoginSession",
                "student"
            );


            /* ================================
               SUCCESS
            ================================= */

            showMessage(

                "✅ Login සාර්ථකයි!\n\n" +
                "Welcome " +
                (
                    studentData.name ||
                    "Student"
                ) +
                "!",

                "success"

            );


            setTimeout(

                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },

                700

            );

        }


        catch(error) {

            console.error(
                "Student Login Error:",
                error
            );


            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if (

                error.code ===
                "auth/invalid-credential"

            ) {

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }

            else if (

                error.code ===
                "auth/user-not-found"

            ) {

                text =
                    "මෙම Phone Number එකට account එකක් නැහැ.";

            }

            else if (

                error.code ===
                "auth/wrong-password"

            ) {

                text =
                    "Password එක වැරදියි.";

            }

            else if (

                error.code ===
                "auth/too-many-requests"

            ) {

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }

);

/* ========================================
   ADMIN LOGIN
======================================== */

adminLoginButton.addEventListener(
    "click",
    async function() {
        adminLoginButton.disabled =
            true;

        showMessage(
            "Admin Login verify කරමින්..."
        );

        try {
            const trusted =
                await isTrustedAdminDevice();

            if (!trusted) {
                const currentHash = await getAdminDeviceId();
                let detail = "";
                try {
                    const ref = doc(db, ADMIN_DEVICE_COLLECTION, currentHash);
                    const snap = await getDoc(ref);
                    if (!snap.exists()) {
                        detail = "\n\nFirestore document එක හමු වුණේ නැහැ.";
                    } else {
                        const d = snap.data();
                        detail =
                            "\n\ntrusted = " + String(d.trusted) +
                            " (type: " + typeof d.trusted + ")" +
                            "\nactive = " + String(d.active) +
                            " (type: " + typeof d.active + ")" +
                            "\nuid match = " + String(d.uid === ADMIN_UID);
                    }
                } catch (checkError) {
                    detail = "\n\nFirestore check error: " + (checkError.message || checkError);
                }
                throw new Error(
                    "මෙම APK device එක trusted Admin Device එකක් නොවේ." + detail +
                    "\n\nDocument ID = current Device Hash එක විය යුතුයි.\ntrusted = true (Boolean), active = true (Boolean), uid = Admin UID විය යුතුයි."
                );
            }

            const email =
                adminEmail.value.trim();

            const password =
                adminPassword.value;

            if (!email || !password) {
                throw new Error(
                    "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
                );
            }

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user =
                result.user;

            const uid =
                user.uid;

            if (uid !== ADMIN_UID) {
                await signOut(auth);

                throw new Error(
                    "මෙම account එක Admin account එක නොවේ."
                );
            }

            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );

            const userSnap =
                await getDoc(userRef);

            if (!userSnap.exists()) {
                await signOut(auth);

                throw new Error(
                    "Admin profile එක හමු වුණේ නැහැ."
                );
            }

            const adminData =
                userSnap.data();

            if (
                adminData.role !== "admin"
            ) {
                await signOut(auth);

                throw new Error(
                    "මෙම account එකට Admin permission නැහැ."
                );
            }

            sessionStorage.setItem(
                "mcqLoginSession",
                "admin"
            );

            localStorage.setItem(
                "mcqLoginSession",
                "admin"
            );

            showMessage(
                "✅ Admin Login සාර්ථකයි!\n\n" +
                "MCQ Winner වෙත යමින්...",
                "success"
            );

            setTimeout(
                function() {
                    window.location.replace(
                        HOME_URL
                    );
                },
                700
            );
        }
        catch(error) {
            console.error(
                "Admin Login Error:",
                error
            );

            adminLoginButton.disabled =
                false;

            let text =
                "Admin Login කිරීමට නොහැකි විය.";

            if (
                error.code ===
                "auth/invalid-credential"
            ) {
                text =
                    "Admin Email හෝ Password වැරදියි.";
            }
            else if (
                error.code ===
                "auth/network-request-failed"
            ) {
                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";
            }
            else if (
                error.message
            ) {
                text =
                    error.message;
            }

            showMessage(
                "❌ " + text,
                "error"
            );
        }
    }
);

/* ========================================
   LOGO 5-TAP ADMIN ACCESS
======================================== */

let adminTapCount = 0;
let adminTapTimer = null;

loginLogo.addEventListener(
    "click",
    async function() {
        adminTapCount++;

        clearTimeout(
            adminTapTimer
        );

        adminTapTimer =
            setTimeout(
                function() {
                    adminTapCount = 0;
                },
                2000
            );

        if (
            adminTapCount >= 5
        ) {
            adminTapCount = 0;

            clearTimeout(
                adminTapTimer
            );

            /* -----------------------------------------
               5 TAP = SETUP ACCESS
               Setup is allowed on a new APK so that
               the device hash can be obtained.
            ----------------------------------------- */

            adminLoginSection.classList.remove(
                "hidden"
            );

            adminLoginArea.classList.add(
                "hidden"
            );

            deviceHashBox.classList.add(
                "hidden"
            );

            try {
                await showCurrentDeviceHash();

                const trusted =
                    await isTrustedAdminDevice();

                if (trusted) {
                    adminLoginArea.classList.remove(
                        "hidden"
                    );

                    showMessage(
                        "👑 Trusted Admin Device හඳුනාගත්තා. Admin Login පහතින් ඇත.",
                        "success"
                    );
                }
                else {
                    showMessage(
                        "🔧 New APK Device හඳුනාගත්තා.\n\n" +
                        "Device Hash එක Firebase adminDevices collection එකට add කරලා trusted=true දාන්න.\n\n" +
                        "ඊට පස්සේ Admin Login කරන්න.",
                        "success"
                    );
                }
            }
            catch(error) {
                console.error(
                    "5-Tap Setup Error:",
                    error
                );

                showMessage(
                    "❌ " +
                    (
                        error.message ||
                        "Admin Device Setup error."
                    ),
                    "error"
                );
            }
        }
    }
);
