   RESET
======================================== */

   BODY
======================================== */

<script type="module">


/* ========================================

/* ========================================

======================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:

};


/* ========================================

======================================== */

const ADMIN_UID =
    "Npiu0xJQQchrVgHnXRuR8Rr5FOA2";


/* ========================================
   HOME URL
======================================== */

const HOME_URL =
    "https://gatokandagedineshsanjeewa-design.github.io/MCQ-Winner/index.html";


/* ========================================
   INITIALIZE
======================================== */

const app =
    initializeApp(firebaseConfig);


const auth =

const db =

/* ========================================

const provider =

/* ========================================
   ELEMENTS
======================================== */

const loginSection =
    document.getElementById(
        "loginSection"
    );


const registerSection =
    document.getElementById(
        "registerSection"
    );


const verificationSection =
    document.getElementById(
        "verificationSection"
    );


const loginPhone =
    document.getElementById(

    );


const loginPassword =
    document.getElementById(
        "loginPassword"
    );


const loginButton =

        "loginButton"

const registerButton =
    document.getElementById(
        "registerButton"
    );


const googleButton =
    document.getElementById(

    );


const showRegisterButton =
    document.getElementById(
        "showRegisterButton"
    );


const showLoginButton =
    document.getElementById(
        "showLoginButton"
    );


const message =

        "message"
    );


const loginLogo =
    document.getElementById(
        "loginLogo"
    );


const adminLoginSection =
    document.getElementById(
        "adminLoginSection"
    );


const registerEmail =
    document.getElementById(
        "registerEmail"
    );


const verificationEmail =
    document.getElementById(
        "verificationEmail"
    );


const checkVerificationButton =
    document.getElementById(
        "checkVerificationButton"
    );


const resendVerificationButton =
    document.getElementById(
        "resendVerificationButton"
    );


const backToLoginButton =
    document.getElementById(
        "backToLoginButton"
    );


/* ========================================
   DEVICE ID
======================================== */

let DEVICE_ID =
    localStorage.getItem(
        "mcqWinnerDeviceId"
    );


if (!DEVICE_ID) {

    DEVICE_ID =
        crypto.randomUUID();

    localStorage.setItem(
        "mcqWinnerDeviceId",
        DEVICE_ID
    );

}


/* ========================================
   CURRENT VERIFICATION USER
======================================== */

let verificationUser = null;


/* ========================================
   CURRENT VERIFICATION EMAIL
======================================== */

let verificationEmailAddress = "";


/* ========================================
   MESSAGE
======================================== */

function showMessage(
    text,
    type = ""
) {

    message.innerText =
        text;

    message.className =
        type;

}


/* ========================================
   PHONE NORMALIZATION
======================================== */

function normalizePhone(phone) {

    let cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    if (
        cleanPhone.startsWith("0")
    ) {

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }


    return cleanPhone;

}


/* ========================================
   PHONE VALIDATION
======================================== */

function isValidSriLankanPhone(phone) {

    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}


/* ========================================
   EMAIL VALIDATION
======================================== */

function isValidEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

}


/* ========================================
   SHOW LOGIN
======================================== */

function showLogin() {

    registerSection.classList.add(
        "hidden"
    );

    verificationSection.classList.add(
        "hidden"
    );

    loginSection.classList.remove(
        "hidden"
    );

    showMessage("");

}


/* ========================================
   SHOW REGISTER
======================================== */

showRegisterButton.addEventListener(

    "click",

    function() {

        loginSection.classList.add(
            "hidden"
        );

        verificationSection.classList.add(
            "hidden"
        );

        registerSection.classList.remove(
            "hidden"
        );

        showMessage("");

    }

);


/* ========================================
   SHOW LOGIN BUTTON
======================================== */

showLoginButton.addEventListener(

    "click",

    function() {

        showLogin();

    }

);


/* ========================================
   BACK TO LOGIN
======================================== */

backToLoginButton.addEventListener(

    "click",

    async function() {

        verificationUser = null;

        verificationEmailAddress = "";

        try {

            await signOut(auth);

        }

        catch (error) {

            console.log(error);

        }

        showLogin();

    }

);


/* ========================================
   SHOW VERIFICATION SCREEN
======================================== */

function showVerificationScreen(
    email
) {

    verificationEmailAddress =
        email || "";

    verificationEmail.innerText =
        verificationEmailAddress;


    loginSection.classList.add(
        "hidden"
    );

    registerSection.classList.add(
        "hidden"
    );

    verificationSection.classList.remove(
        "hidden"
    );

}


/* ========================================
   REGISTER STUDENT
======================================== */

registerButton.addEventListener(

    "click",

    async function() {

        registerButton.disabled =
            true;


        showMessage(
            "Account එක සාදමින්..."
        );


        try {


            /* ================================
               GET DETAILS
            ================================= */

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const stream =
                document
                    .getElementById("stream")
                    .value;


            const school =
                document
                    .getElementById("school")
                    .value
                    .trim();


            const nearestCity =
                document
                    .getElementById("nearestCity")
                    .value
                    .trim();


            const alYear =
                document
                    .getElementById("alYear")
                    .value;


            const email =
                registerEmail
                    .value
                    .trim()
                    .toLowerCase();


            const phone =
                document
                    .getElementById("registerPhone")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            /* ================================
               REQUIRED
            ================================= */

            if (

                !name ||
                !stream ||
                !school ||
                !nearestCity ||
                !alYear ||
                !email ||
                !phone ||
                !password ||
                !confirmPassword

            ) {

                throw new Error(
                    "කරුණාකර සියලු තොරතුරු පුරවන්න."
                );

            }


            /* ================================
               EMAIL
            ================================= */

            if (
                !isValidEmail(email)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Email Address එකක් ඇතුළත් කරන්න."
                );

            }


            /* ================================
               PASSWORD
            ================================= */

            if (
                password !==
                confirmPassword
            ) {

                throw new Error(
                    "Password දෙක එක සමාන නැහැ."
                );

            }


            if (
                password.length < 6
            ) {

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            /* ================================
               PHONE
            ================================= */

            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const normalizedPhone =
                normalizePhone(phone);


            /* ================================
               DEVICE ACCOUNT CHECK
            ================================= */

            const savedAccountUid =
                localStorage.getItem(
                    "mcqWinnerAccountUid"
                );


            if (
                savedAccountUid
            ) {

                throw new Error(
                    "මෙම device එකේ දැනටමත් Student account එකක් තිබෙනවා."
                );

            }


            /* ================================
               PHONE DUPLICATE CHECK
            ================================= */

            const phoneQuery =
                query(

                    collection(
                        db,
                        "users"
                    ),

                    where(
                        "phoneNumber",
                        "==",
                        normalizedPhone
                    )

                );


            const phoneSnapshot =
                await getDocs(
                    phoneQuery
                );


            if (
                !phoneSnapshot.empty
            ) {

                throw new Error(
                    "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා."
                );

            }


            /* ================================
               CREATE REAL EMAIL AUTH ACCOUNT
            ================================= */

            const result =
                await createUserWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


            const user =
                result.user;


            const uid =
                user.uid;


            /* ================================
               SEND VERIFICATION EMAIL
            ================================= */

            await sendEmailVerification(
                user
            );


            /* ================================
               TRIAL
               2 DAYS
            ================================= */

            const trialStart =
                new Date();


            const trialEnd =
                new Date(

                    trialStart.getTime() +

                    (
                        2 *
                        24 *
                        60 *
                        60 *
                        1000
                    )

                );


            /* ================================
               USER DOCUMENT
            ================================= */

            const userRef =
                doc(

                    db,

                    "users",

                    uid

                );


            await setDoc(

                userRef,

                {

                    uid:
                        uid,

                    role:
                        "student",

                    name:
                        name,

                    email:
                        email,

                    emailVerified:
                        false,

                    alStream:
                        stream,

                    school:
                        school,

                    nearestCity:
                        nearestCity,

                    alYear:
                        alYear,

                    phoneNumber:
                        normalizedPhone,

                    deviceId:
                        DEVICE_ID,

                    subscriptionActive:
                        false,

                    subscriptionUntil:
                        null,

                    subscriptionPrice:
                        100,

                    subscriptionPeriod:
                        "weekly",

                    trialActive:
                        true,

                    trialStartAt:
                        Timestamp.fromDate(
                            trialStart
                        ),

                    trialUntil:
                        Timestamp.fromDate(
                            trialEnd
                        ),

                    trialSource:
                        "registration",

                    createdAt:
                        serverTimestamp()

                }

            );


            /* ================================
               SAVE DEVICE ACCOUNT
            ================================= */

            localStorage.setItem(

                "mcqWinnerAccountUid",

                uid

            );


            /* ================================
               KEEP USER FOR VERIFICATION
            ================================= */

            verificationUser =
                user;


            verificationEmailAddress =
                email;


            /* ================================
               SHOW VERIFICATION
            ================================= */

            showVerificationScreen(
                email
            );


            showMessage(

                "✅ Account එක සාර්ථකව සාදන ලදී!\n\n" +

                "📧 Verification Email එක " +
                email +
                " වෙත යවා ඇත.\n\n" +

                "Email එක verify කළ පසු Login කරන්න.",

                "success"

            );


            /*
             * Do NOT create login session here.
             * User must verify email first.
             */

            sessionStorage.removeItem(
                "mcqLoginSession"
            );


        }


        catch(error) {

            console.error(
                "Register Error:",

/* ========================================
   FIND STUDENT BY PHONE
======================================== */

async function findStudentByPhone(
    phone
) {

    const normalizedPhone =
        normalizePhone(phone);


    const q =
        query(

            collection(
                db,
                "users"
            ),

            where(
                "phoneNumber",
                "==",
                normalizedPhone
            )

        );


    const snapshot =
        await getDocs(q);


    if (
        snapshot.empty
    ) {

        return null;

    }


    let result =
        null;


    snapshot.forEach(

        function(docSnap) {

            if (!result) {

                result = {

                    uid:
                        docSnap.id,

                    data:
                        docSnap.data()

                };

            }

        }

    );


    return result;

}

loginButton.addEventListener(

    "click",

    async function() {

        loginButton.disabled =
            true;


        showMessage(
            "Login verify කරමින්..."
        );


        try {


            const phone =
                loginPhone
                    .value
                    .trim();


            const password =
                loginPassword
                    .value;


            /* ================================
               REQUIRED
            ================================= */

            if (
                !phone ||
                !password
            ) {

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            /* ================================
               PHONE
            ================================= */

            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            /* ================================
               FIND ACCOUNT
            ================================= */

            const student =
                await findStudentByPhone(
                    phone
                );


            if (
                !student
            ) {

                throw new Error(
                    "මෙම Phone Number එකට account එකක් නැහැ."
                );

            }


            const studentData =
                student.data;


            /* ================================

            ================================= */

            if (

            ) {

                throw new Error(
                    "මෙය Student account එකක් නොවේ. Admin Login භාවිතා කරන්න."

            /* ================================

            const loginEmail =

            if (

                throw new Error(

                );

            }


            /* ================================
               FIREBASE AUTH LOGIN
            ================================= */

            const result =
                await signInWithEmailAndPassword(

                    auth,

                    loginEmail,

                    password

                );


            const user =
                result.user;


            /* ================================
               RELOAD USER
            ================================= */

            await reload(
                user
            );


            /* ================================
               EMAIL VERIFICATION CHECK
            ================================= */

            if (
                !user.emailVerified
            ) {

                verificationUser =
                    user;


                verificationEmailAddress =
                    user.email;


                showVerificationScreen(
                    user.email
                );


                showMessage(

                    "❌ Email එක verify කරලා නැහැ.\n\n" +

                    "📧 " +
                    user.email +
                    " වෙත ගිය Email එක open කරලා Verify කරන්න.",

                    "error"

                );


                await signOut(
                    auth
                );


                loginButton.disabled =
                    false;


                return;

            }


            /* ================================
               FIRESTORE PROFILE VERIFY
            ================================= */

            const userRef =
                doc(

                    db,

                    "users",

                    user.uid

                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(
                    auth
                );

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const freshStudentData =
                userSnap.data();


            /* ================================
               ROLE CHECK
            ================================= */

            if (
                freshStudentData.role ===
                "admin"
            ) {

                await signOut(
                    auth
                );

                throw new Error(
                    "මෙය Student account එකක් නොවේ. Admin Login භාවිතා කරන්න."
                );

            }


            /* ================================
               DEVICE CHECK
            ================================= */

            if (

                freshStudentData.deviceId &&

                freshStudentData.deviceId !==
                DEVICE_ID

            ) {

                await signOut(
                    auth
                );

                throw new Error(

                    "මෙම Student account එක වෙනත් device එකකට සම්බන්ධයි.\n\n" +

                    "මෙම device එකෙන් Login කළ නොහැක."

                );

            }


            /* ================================
               UPDATE VERIFIED STATUS
            ================================= */

            if (
                freshStudentData.emailVerified !==
                true
            ) {

                await setDoc(

                    userRef,

                    {

                        emailVerified:
                            true

                    },

                    {

                        merge:
                            true

                    }

                );

            }


            /* ================================
               SESSION
            ================================= */

            sessionStorage.setItem(

                "mcqLoginSession",

                "student"

            );


            localStorage.setItem(

                "mcqWinnerAccountUid",

                user.uid

            );


            /* ================================
               SUCCESS
            ================================= */

            showMessage(

                "✅ Login සාර්ථකයි!\n\n" +

                "Welcome " +

                (

                    freshStudentData.name ||
                    "Student"

                ) +

                "!",

                "success"

            );


            setTimeout(

                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },

                700

            );

        }


        catch(error) {

            console.error(

                "Student Login Error:",

                error

            );


            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }


            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "මෙම account එක හමු වුණේ නැහැ.";

            }


            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                text =
                    "Password එක වැරදියි.";

            }


            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                text =

            else if (

            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }


            else if (
                error.message
