/* ==================================================

function safeGet(
    key
){

    try{

        return localStorage.getItem(
            key
        );

    }catch(error){

        return null;

    }

}


function safeSet(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            value
        );

        return true;

    }catch(error){

        console.log(
            "localStorage unavailable"
        );

        return false;

    }

}

const TRUSTED_DEVICE_KEY =

const TRUSTED_DEVICE_PREFIX =

function getTrustedDeviceId(){

    if(id){

        id
    );


    return id;

}



/* ==================================================
   SHA-256
================================================== */

async function sha256(
    text
){

    const data =
        new TextEncoder()
            .encode(text);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array
        .from(
            new Uint8Array(hash)
        )
        .map(
            b =>
            b.toString(16)
             .padStart(2,"0")
        )
        .join("");

}



/* ==================================================
   TRUSTED DEVICE HASH
================================================== */

async function getTrustedDeviceHash(){

    const id =
        getTrustedDeviceId();

    return await sha256(
        TRUSTED_DEVICE_PREFIX +
        id
    );

}



/* ==================================================
   CHECK TRUSTED ADMIN DEVICE
================================================== */

async function isTrustedAdminDevice(){

    try{

        /*
         * First try the current hash system.
         */

        const deviceHash =
            await getTrustedDeviceHash();


        const deviceRef =
            doc(
                db,
                "adminDevices",
                deviceHash
            );


        const deviceSnap =
            await getDoc(
                deviceRef
            );


        if(
            deviceSnap.exists()
        ){

            const data =
                deviceSnap.data();


            return (
                data.uid === ADMIN_UID &&
                data.trusted === true &&
                data.active === true
            );

        }


        /*
         * ------------------------------------------------
         * Legacy/admin-device compatibility.
         *
         * This allows an already-approved admin device
         * record to continue working.
         * ------------------------------------------------
         */

        const legacyId =
            safeGet(
                "mcqAdminDeviceId"
            );


        if(legacyId){

            const legacyRef =
                doc(
                    db,
                    "adminDevices",
                    legacyId
                );


            const legacySnap =
                await getDoc(
                    legacyRef
                );


            if(
                legacySnap.exists()
            ){

                const data =
                    legacySnap.data();


                if(
                    data.active !== false &&
                    (
                        !data.uid ||
                        data.uid === ADMIN_UID
                    )
                ){

                    return true;

                }

            }

        }


        return false;

    }
    catch(error){

        console.error(
            "Trusted device check failed:",
            error
        );

        return false;

    }

}

/* ==================================================
   PHONE NORMALIZATION
================================================== */

function normalizePhone(
    phone
){

    let cleanPhone =
        String(phone)
        .replace(
            /\D/g,
            ""
        );


    if(
        cleanPhone.startsWith("0")
    ){

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }


    return cleanPhone;

}



/* ==================================================
   PHONE → LOGIN EMAIL
================================================== */

function makeLoginEmail(
    phone
){

    const cleanPhone =
        normalizePhone(
            phone
        );


    return (
        cleanPhone +
        "@mcqwinner.local"
    );

}



/* ==================================================
   PHONE VALIDATION
================================================== */

function isValidSriLankanPhone(
    phone
){

    const cleanPhone =
        String(phone)
        .replace(
            /\D/g,
            ""
        );


    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}



/* ==================================================
   DATE VALUE
================================================== */

function getDateValue(
    value
){

    if(!value){
        return null;
    }


    try{

        if(
            value instanceof Timestamp
        ){

            return value.toDate();

        }


        if(
            value instanceof Date
        ){

            return value;

        }


        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value.toDate();

        }


        if(
            value &&
            typeof value.seconds ===
            "number"
        ){

            return new Date(
                value.seconds * 1000
            );

        }


        if(
            typeof value ===
            "string"
        ){

            const date =
                new Date(value);

            if(
                !isNaN(
                    date.getTime()
                )
            ){

                return date;

            }

        }

    }catch(error){}


    return null;

}

/* ==================================================
   TRIAL ACTIVE
================================================== */

function isTrialCurrentlyActive(
    settings
){

    if(
        !settings ||
        settings.enabled !== true
    ){

        return false;

    }


    const now =
        new Date();


    const startAt =
        getDateValue(
            settings.startAt
        );


    const endAt =
        getDateValue(
            settings.endAt
        );


    if(
        startAt &&
        now < startAt
    ){

        return false;

    }


    if(
        endAt &&
        now > endAt
    ){

        return false;

    }


    return true;

}

loginButton.addEventListener(
    "click",
    async function(){

        loginButton.disabled =
            true;


        showMessage(
            "Student Login verify කරමින්..."
        );


        try{

            const phone =
                loginPhone.value.trim();


            const password =
                loginPassword.value;


            if(
                !isValidSriLankanPhone(
                    phone
                )
            ){

                throw new Error(
                    "නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            if(
                !password
            ){

                throw new Error(
                    "Password එක ඇතුළත් කරන්න."
                );

            }


            const email =
                makeLoginEmail(
                    phone
                );


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            /*
             * ADMIN ACCOUNT CANNOT USE
             * STUDENT LOGIN.
             */

            if(
                user.uid ===
                ADMIN_UID
            ){

                await signOut(auth);

                throw new Error(
                    "මෙය Admin account එකකි. Admin Login භාවිතා කරන්න."
                );

            }


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                !userSnap.exists()
            ){

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const data =
                userSnap.data();


            if(
                data.role ===
                "admin"
            ){

                await signOut(auth);

                throw new Error(
                    "Admin account එකක් Student Login මගින් භාවිතා කළ නොහැක."
                );

            }


            /*
             * DEVICE LOCK
             */

            const currentDevice =
                getDeviceId();


            if(
                data.deviceId &&
                data.deviceId !==
                currentDevice
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම account එක වෙනත් device එකකට සම්බන්ධ කර ඇත."
                );

            }


            /*
             * LOCAL ACCOUNT LOCK
             */

            const localUid =
                getLocalAccountUid();


            if(
                localUid &&
                localUid !== user.uid
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම device එකේ වෙනත් student account එකක් සම්බන්ධ කර ඇත."
                );

            }


            saveLocalAccountUid(
                user.uid
            );


            /*
             * SAVE DEVICE ID IF MISSING
             */

            if(
                !data.deviceId
            ){

                try{

                    await setDoc(
                        userRef,
                        {
                            deviceId:
                                currentDevice
                        },
                        {
                            merge:true
                        }
                    );

                }catch(error){

                    console.log(
                        "Device ID update:",
                        error
                    );

                }

            }


            /*
             * STUDENT SESSION
             */

            safeSet(
                "mcqLoginSession",
                "student"
            );


            try{

                sessionStorage.setItem(
                    "mcqLoginSession",
                    "student"
                );

            }catch(error){}


            showMessage(
                "✅ Student Login සාර්ථකයි!\n\nMCQ Winner වෙත යමින්...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );


        }
        catch(error){

            console.error(
                "Student Login Error:",
                error
            );


            loginButton.disabled =

registerButton.addEventListener(

        );


        try{

            const name =
                document

                .value
                .trim();

                document
                .getElementById("stream")
                .value;


            const school =
                document
                .getElementById("school")
                .value
                .trim();


            const nearestCity =
                document
                .getElementById("nearestCity")
                .value
                .trim();


            const alYear =
                document
                .getElementById("alYear")
                .value;


            const phone =
                document
                .getElementById("registerPhone")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const confirmPassword =
                document
                .getElementById("confirmPassword")
                .value;


            if(
                !name ||
                !stream ||
                !school ||
                !nearestCity ||
                !alYear
            ){

                throw new Error(
                    "සියලු Student details ඇතුළත් කරන්න."
                );

            }


            if(
                !isValidSriLankanPhone(
                    phone
                )
            ){

                throw new Error(
                    "නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            if(
                !password
            ){

                throw new Error(
                    "Password එකක් ඇතුළත් කරන්න."
                );

            }


            if(
                password.length < 6
            ){

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            if(
                password !==
                confirmPassword
            ){

                throw new Error(
                    "Passwords දෙක සමාන නැහැ."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const deviceId =
                getDeviceId();


            /*
             * CREATE FIREBASE AUTH ACCOUNT
             */

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    loginEmail,
                    password
                );


            const user =
                result.user;


            /*
             * ADMIN UID SAFETY
             */

            if(
                user.uid ===
                ADMIN_UID
            ){

                await signOut(auth);

                throw new Error(
                    "Admin account එකක් Student account එකක් ලෙස create කළ නොහැක."
                );

            }


            /*
             * TRIAL
             */

            const trialSettings =
                await getTrialSettings();


            const trialActive =
                isTrialCurrentlyActive(
                    trialSettings
                );


            let trialStart =
                null;

            let trialEnd =
                null;


            if(
                trialActive
            ){

                trialStart =
                    serverTimestamp();


                const trialDays =
                    Number(
                        trialSettings.days ||
                        2
                    );


                trialEnd =
                    Timestamp.fromDate(
                        new Date(
                            Date.now() +
                            trialDays *
                            24 *
                            60 *
                            60 *
                            1000
                        )
                    );

            }


            /*
             * STUDENT PROFILE
             */

            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    uid:
                        user.uid,

                    name:
                        name,

                    stream:
                        stream,

                    school:
                        school,

                    nearestCity:
                        nearestCity,

                    alYear:
                        alYear,

                    phoneNumber:
                        phone,

                    email:
                        loginEmail,

                    role:
                        "student",

                    deviceId:
                        deviceId,

                    subscriptionActive:
                        false,

                    subscriptionUntil:
                        null,

                    subscriptionPrice:
                        100,

                    subscriptionPeriod:
                        "weekly",

                    trialActive:
                        trialActive,

                    trialSource:
                        trialActive
                        ? "admin"
                        : "none",

                    trialStart:
                        trialStart,

                    trialEnd:
                        trialEnd,

                    createdAt:
                        serverTimestamp()

                }
            );


            /*
             * SAVE LOCAL UID
             */

            saveLocalAccountUid(
                user.uid
            );


            safeSet(
                "mcqLoginSession",
                "student"
            );


            try{

                sessionStorage.setItem(
                    "mcqLoginSession",
                    "student"
                );

            }catch(error){}


            showMessage(
                trialActive
                ? "✅ Account එක සාර්ථකව සාදන ලදී!\n\n🎁 Trial එක සක්‍රීයයි.\n\nMCQ Winner වෙත යමින්..."
                : "✅ Account එක සාර්ථකව සාදන ලදී!\n\nMCQ Winner වෙත යමින්...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        HOME_URL
                    );

                },
                1000
            );


        }
        catch(error){

            console.error(
                "Registration Error:",
                error
            );


            registerButton.disabled =
                false;


            let text =
                "Account එක සාදාගැනීමට නොහැකි විය.";


            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                text =
                    "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා.";

            else if(

/* ==================================================
   WEBVIEW-SAFE 5 TAP SYSTEM
================================================== */

let adminTapCount =
    0;

let adminTapTimer =
    null;

let adminTapBusy =
    false;

let lastTouchTime =
    0;



/* ==================================================
   RESET TAPS
================================================== */

function resetAdminTaps(){

    adminTapCount =
        0;


    if(
        adminTapTimer
    ){

        clearTimeout(
            adminTapTimer
        );

        adminTapTimer =
            null;

    }

}



/* ==================================================
   HANDLE LOGO TAP
================================================== */

async function handleLogoTap(
    event
){

    if(event){

        event.preventDefault();

        event.stopPropagation();

    }


    /*
     * Prevent click generated immediately
     * after Android touchend.
     */

    if(
        event &&
        event.type ===
        "click"
    ){

        if(
            Date.now() -
            lastTouchTime <
            500
        ){

            return;

        }

    }


    if(
        event &&
        event.type ===
        "touchend"
    ){

        lastTouchTime =
            Date.now();

    }


    if(
        adminTapBusy
    ){

        return;

    }


    adminTapCount++;


    if(
        adminTapTimer
    ){

        clearTimeout(
            adminTapTimer
        );

    }


    adminTapTimer =
        setTimeout(
            function(){

                resetAdminTaps();

            },
            2000
        );


    /*
     * Not yet 5 taps
     */

    if(
        adminTapCount <
        5
    ){

        return;

    }


    /*
     * Five taps completed
     */

    resetAdminTaps();


    adminTapBusy =
        true;


    try{

        /*
         * IMPORTANT:
         *
         * Normal student devices are NOT allowed.
         *
         * Trusted device check remains active.
         */

        const trusted =
            await checkTrustedDeviceSilently();


        if(
            !trusted
        ){

            /*
             * Completely silent on normal device.
             */

            adminLoginSection.classList.add(
                "hidden"
            );

            return;

        }


        /*
         * TRUSTED ADMIN DEVICE ONLY
         */

        adminLoginSection.classList.remove(
            "hidden"
        );


        registerSection.classList.add(
            "hidden"
        );


        loginSection.classList.remove(
            "hidden"
        );


        showMessage(
            "👑 Admin Login විවෘත කළා."
        );


        /*
         * Focus email after WebView finishes
         * rendering the section.
         */

        setTimeout(
            function(){

                try{

                    if(
                        adminEmail
                    ){

                        adminEmail.focus();

                    }

                }catch(error){}

            },
            150
        );


    }
    catch(error){

        console.error(
            "5-tap Admin error:",
            error
        );

    }
    finally{

        setTimeout(
            function(){

                adminTapBusy =
                    false;

            },
            350
        );

    }

}



/* ==================================================
   CLICK EVENT
================================================== */

loginLogo.addEventListener(
    "click",
    handleLogoTap,
    false
);



/* ==================================================
   TOUCH EVENT — ANDROID APK / WEBVIEW
================================================== */

loginLogo.addEventListener(
    "touchend",
    handleLogoTap,
    {
        passive:false
    }
);



/* ==================================================
   POINTER EVENT — EXTRA WEBVIEW SUPPORT
================================================== */

if(
    window.PointerEvent
){

    loginLogo.addEventListener(
        "pointerup",
        function(event){

            /*
             * Only use pointer event when it
             * is not already a touch event.
             */

            if(
                event.pointerType ===
                "mouse"
            ){

                handleLogoTap(
                    event
                );

            }

        },
        false
    );

}



/* ==================================================
   PREVENT LONG PRESS MENU ON LOGO
================================================== */

loginLogo.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

    }
);



/* ==================================================
   INITIAL STATE
================================================== */

adminLoginSection.classList.add(
    "hidden"
);

showMessage("");



</script>
