/* ==========================================
   DEVICE SEED
========================================== */

function getOrCreateDeviceSeed(){

    try{

        let seed =
            localStorage.getItem(
                DEVICE_SEED_KEY
            );

        if(!seed){

            if(
                window.crypto &&
                typeof crypto.randomUUID === "function"
            ){

                seed =
                    crypto.randomUUID() +
                    "-" +
                    Date.now() +
                    "-" +
                    Math.random();

            }
            else{

                seed =
                    Date.now() +
                    "-" +
                    Math.random() +
                    "-" +
                    Math.random();

            }

            localStorage.setItem(
                DEVICE_SEED_KEY,
                seed
            );

        }

        return seed;

    }
    catch(error){

        console.error(
            "Device seed error:",
            error
        );

        return null;

    }

}


/* ==========================================
   SHA-256
========================================== */

async function sha256(text){

    if(
        !window.crypto ||
        !crypto.subtle
    ){

        throw new Error(
            "මෙම APK WebView එකේ SHA-256 support නැහැ."
        );

    }

    const data =
        new TextEncoder().encode(text);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(hashBuffer)
        );

    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2,"0")
        )
        .join("");

}


/* ==========================================
   GET ADMIN DEVICE HASH
========================================== */

async function getAdminDeviceId(){

    try{

        const saved =
            localStorage.getItem(
                DEVICE_ID_KEY
            );

        if(
            saved &&
            /^[a-f0-9]{64}$/i.test(saved)
        ){

            return saved.toLowerCase();

        }

        const seed =
            getOrCreateDeviceSeed();

        if(!seed){

            return null;

        }

        const deviceId =
            await sha256(
                "MCQ-WINNER-ADMIN-DEVICE|" +
                seed
            );

        localStorage.setItem(
            DEVICE_ID_KEY,
            deviceId
        );

        return deviceId;

    }
    catch(error){

        console.error(
            "Device ID error:",
            error
        );

        return null;

    }

}

/* ==========================================
   PHONE NORMALIZATION
========================================== */

function normalizePhone(phone){

    let cleanPhone =
        phone.replace(/\D/g,"");

    if(
        cleanPhone.startsWith("0")
    ){

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }

    return cleanPhone;

}


/* ==========================================
   PHONE → LOGIN EMAIL
========================================== */

function makeLoginEmail(phone){

    const cleanPhone =
        normalizePhone(phone);

    return (
        cleanPhone +
        "@mcqwinner.local"
    );

}


/* ==========================================
   PHONE VALIDATION
========================================== */

function isValidSriLankanPhone(phone){

    const cleanPhone =
        phone.replace(/\D/g,"");

    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}

                !stream ||

                !alYear ||
                !phone ||
                !password ||
                !confirmPassword
            ){

                        24 *
                        60 *
                        60 *
                        1000
                    )
                );


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            await setDoc(
                userRef,

                    uid:uid,

                    role:"student",

                    name:name,

                    school:school,

                    nearestCity:nearestCity,

                    alYear:alYear,

                    phoneNumber:phone,

                    subscriptionPeriod:"weekly",

            showMessage(

                name +

            );

        catch(error){

                "Register Error:",

            );

                "Account එක සෑදීමට නොහැකි විය.";

            else if(
                error.code ===
                "auth/weak-password"
            ){

                text =
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි.";

            }

                error.message

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);

                loginPhone
                    .value
                    .trim();

            const password =
                loginPassword
                    .value;


            if(
                !phone ||
                !password
            ){

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            if(
                !isValidSriLankanPhone(phone)
            ){

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(phone);


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    loginEmail,
                    password
                );


            const user =
                result.user;

            const uid =
                user.uid;


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                !userSnap.exists()
            ){

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const studentData =
                userSnap.data();


            if(
                studentData.role === "admin"
            ){

                await signOut(auth);

                throw new Error(
                    "මෙය Student account එකක් නොවේ. Admin Login භාවිතා කරන්න."
                );

            }


            sessionStorage.setItem(
                "mcqLoginSession",
                "student"
            );


            showMessage(
                "✅ Login සාර්ථකයි!\n\n" +
                "Welcome " +
                (
                    studentData.name ||
                    "Student"
                ) +
                "!",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );

        }
        catch(error){

            console.error(
                "Student Login Error:",
                error
            );


            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                    "මෙම Phone Number එකට account එකක් නැහැ.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                text =
                    "Password එක වැරදියි.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if(
                error.message
            ){

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);

/* ==========================================
   ADMIN LOGIN
========================================== */

adminLoginButton.addEventListener(
    "click",
    async function(){

        adminLoginButton.disabled =
            true;

        showMessage(
            "Admin Login verify කරමින්..."
        );


        try{

            const email =
                adminEmail
                    .value
                    .trim();

            const password =
                adminPassword
                    .value;


            if(
                !email ||
                !password
            ){

                throw new Error(
                    "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            /* ADMIN AUTH */

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;

            const uid =
                user.uid;


            /* UID CHECK */

            if(
                uid !== ADMIN_UID
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම account එක Admin account එක නොවේ."
                );

            }


            /* ADMIN PROFILE */

            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                !userSnap.exists()
            ){

                await signOut(auth);

                throw new Error(
                    "Admin profile එක හමු වුණේ නැහැ."
                );

            }


            const adminData =
                userSnap.data();


            /* ROLE CHECK */

            if(
                adminData.role !== "admin"
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම account එකට Admin permission නැහැ."
                );

            }


            /* DEVICE HASH */

            const deviceHash =
                await getAdminDeviceId();


            if(!deviceHash){

                await signOut(auth);

                throw new Error(
                    "Device Hash එක ලබාගැනීමට නොහැකි විය."
                );

            }


            /* TRUSTED DEVICE DOCUMENT */

            const deviceRef =
                doc(
                    db,
                    ADMIN_DEVICE_COLLECTION,
                    deviceHash
                );


            let deviceSnap;


            try{

                deviceSnap =
                    await getDoc(
                        deviceRef
                    );

            }
            catch(deviceError){

                console.error(
                    "Admin Device Firestore Error:",
                    deviceError
                );


                await signOut(auth);


                throw new Error(
                    "Admin Device එක verify කිරීමට Firestore permission error එකක් ඇතිවී තිබෙනවා.\n\n" +
                    "adminDevices/" +
                    deviceHash +
                    " document එක සහ Firestore Rules පරීක්ෂා කරන්න."
                );

            }


            if(
                !deviceSnap.exists()
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම APK Device එක trusted කරලා නැහැ.\n\n" +
                    "Current Device Hash:\n" +
                    deviceHash +
                    "\n\n" +
                    "Firestore → adminDevices → Document ID ලෙස මේ Hash එක තිබිය යුතුයි."
                );

            }


            const deviceData =
                deviceSnap.data();


            /* TRUSTED TRUE */

            if(
                deviceData.trusted !== true
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම Device එක trusted = true ලෙස සකස් කරලා නැහැ.\n\n" +
                    "Firestore එකේ trusted field එක Boolean true විය යුතුයි."
                );

            }


            /* UID CHECK */

            if(
                deviceData.uid !== ADMIN_UID
            ){

                await signOut(auth);

                throw new Error(
                    "මෙම Device Hash එක නිවැරදි Admin UID එකට සම්බන්ධ කරලා නැහැ."
                );

            }


            /* SUCCESS */

            sessionStorage.setItem(
                "mcqLoginSession",
                "admin"
            );

            localStorage.setItem(
                "mcqLoginSession",
                "admin"
            );


            setDeviceStatus(
                true,
                "✅ Trusted Admin Device verified"
            );


            showMessage(
                "✅ Admin Login සාර්ථකයි!\n\n" +
                "MCQ Winner වෙත යමින්...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );

        }
        catch(error){

            console.error(
                "Admin Login Error:",
                error
            );


            adminLoginButton.disabled =
                false;


            let text =
                "Admin Login කිරීමට නොහැකි විය.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                text =
                    "Admin Email හෝ Password වැරදියි.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                    "මෙම Admin Email එකට account එකක් නැහැ.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                text =
                    "Admin Password එක වැරදියි.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }

            else if(
                error.message
            ){

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);

/* ==========================================
   COUNT ADMIN TAP
========================================== */

function countAdminTap(){

    adminTapCount++;


    clearTimeout(
        adminTapTimer
    );


    adminTapTimer =
        setTimeout(
            function(){

                adminTapCount = 0;

            },
            2000
        );


    console.log(
        "Admin logo taps:",
        adminTapCount
    );


    if(
        adminTapCount >= 5
    ){

        adminTapCount = 0;

        clearTimeout(
            adminTapTimer
        );


        openAdminDeviceSetup();

    }

}
