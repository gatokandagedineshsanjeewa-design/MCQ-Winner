<!DOCTYPE html>
<html lang="si">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MCQ Winner - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6ff;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.box {
    width: 90%;
    max-width: 400px;

    background: white;

    padding: 30px 25px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.15);

    text-align: center;
}

h1 {
    color: #2563eb;
    margin-bottom: 10px;
}

p {
    color: #555;
}

button {
    width: 100%;

    padding: 15px;

    margin-top: 20px;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#message {
    margin-top: 20px;

    white-space: pre-wrap;

    word-break: break-word;

    line-height: 1.5;
}

.success {
    color: #15803d;
}

.error {
    color: #dc2626;
}

</style>

</head>

<body>

<div class="box">

    <h1>MCQ Winner</h1>

    <p>Student Login</p>

    <button id="googleButton">
        Continue with Google
    </button>

    <p id="message"></p>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// ========================================
// FIREBASE CONFIG
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:
        "mcq-winner",

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:
        "1022060912943",

    appId:
        "1:1022060912943:web:f6e58414867e32f685c1da",

    measurementId:
        "G-MBH3NZ728H"
};


// ========================================
// INITIALIZE FIREBASE
// ========================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const provider =
    new GoogleAuthProvider();


// Google account selection screen
provider.setCustomParameters({
    prompt: "select_account"
});


// ========================================
// ELEMENTS
// ========================================

const googleButton =
    document.getElementById("googleButton");

const message =
    document.getElementById("message");


// ========================================
// SHOW MESSAGE
// ========================================

function showMessage(text, type = "") {

    message.innerText = text;

    message.className = type;

}


// ========================================
// CHECK REDIRECT LOGIN
// ========================================

async function checkRedirectLogin() {

    try {

        showMessage(
            "Login පරීක්ෂා කරමින්..."
        );

        const result =
            await getRedirectResult(auth);

        if (result && result.user) {

            const user =
                result.user;

            showMessage(
                "✅ Login සාර්ථකයි!\n" +
                "Welcome " +
                (user.displayName || "Student") +
                "!",
                "success"
            );

            setTimeout(function() {

                window.location.href =
                    "./index.html";

            }, 800);

        }
        else {

            showMessage("");

        }

    }

    catch(error) {

        console.error(
            "Redirect Login Error:",
            error
        );

        showMessage(
            "Login Error\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message,
            "error"
        );

        googleButton.disabled =
            false;
    }

}


// ========================================
// GOOGLE LOGIN
// ========================================

googleButton.addEventListener(
    "click",
    async function() {

        googleButton.disabled = true;

        showMessage(
            "Google Login වෙත යමින්..."
        );

        try {

            /*
             * APK / WebView environment
             *
             * Local APK pages can have problems
             * with popup windows.
             *
             * Therefore use redirect login
             * for local/mobile environment.
             */

            const protocol =
                window.location.protocol;

            const isLocalPage =
                protocol === "file:" ||
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1";

            if (isLocalPage) {

                await signInWithRedirect(
                    auth,
                    provider
                );

                return;
            }


            /*
             * Normal HTTPS website
             *
             * Use popup login.
             */

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );

            if (result && result.user) {

                const user =
                    result.user;

                showMessage(
                    "✅ Login සාර්ථකයි!\n" +
                    "Welcome " +
                    (user.displayName || "Student") +
                    "!",
                    "success"
                );

                setTimeout(function() {

                    window.location.href =
                        "./index.html";

                }, 800);

            }

        }

        catch(error) {

            console.error(
                "Google Login Error:",
                error
            );

            googleButton.disabled =
                false;

            showMessage(
                "Google Login Error\n\n" +
                "Code: " +
                error.code +
                "\n\n" +
                error.message,
                "error"
            );

        }

    }
);


// ========================================
// START
// ========================================

checkRedirectLogin();

</script>

</body>

</html>
