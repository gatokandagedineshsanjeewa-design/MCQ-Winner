function normalizePhone(phone) {

    let cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );

    if (
        cleanPhone.startsWith("0")
    ) {

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }

    return cleanPhone;

}


function makeLoginEmail(phone) {

    const cleanPhone =
        normalizePhone(phone);

    return (
        cleanPhone +
        "@mcqwinner.local"
    );

}


function isValidSriLankanPhone(phone) {

    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );

    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}


/* DEVICE ID */

function generateDeviceId() {

    try {

        if (
            window.crypto &&
            typeof window.crypto.randomUUID ===
            "function"
        ) {

            return window.crypto.randomUUID();

        }

    }
    catch(error) {

        console.log(
            "randomUUID unavailable"
        );

    }

    return (

        "mcq-" +

        Date.now().toString(36) +

        "-" +

        Math.random()
            .toString(36)
            .substring(2) +

        "-" +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


function getDeviceId() {

    const KEY =
        "mcqWinnerDeviceId";

    let deviceId =
        localStorage.getItem(
            KEY
        );

    if (!deviceId) {

        deviceId =
            generateDeviceId();

        localStorage.setItem(
            KEY,
            deviceId
        );

    }

    return deviceId;

}

const DEVICE_ACCOUNT_KEY =

    try {

    }
    catch(error) {

function saveLocalAccountUid(uid) {

/* TRIAL */

async function getTrialSettings() {

    try {

        const trialRef =
            doc(
                db,
                "settings",
                "trial"
            );

        const trialSnap =
            await getDoc(
                trialRef
            );

        if (
            !trialSnap.exists()
        ) {

            return null;

        }

        return trialSnap.data();

    }
    catch(error) {

        console.error(
            "Trial settings error:",
            error
        );

        return null;

    }

}


function getDateValue(value) {

    if (!value) {

        return null;

    }

    if (
        typeof value.toDate ===
        "function"
    ) {

        return value.toDate();

    }

    if (
        value instanceof Date
    ) {

        return value;

    }

    if (
        typeof value.seconds ===
        "number"
    ) {

        return new Date(
            value.seconds * 1000
        );

    }

    const date =
        new Date(value);

    if (
        isNaN(
            date.getTime()
        )
    ) {

        return null;

    }

    return date;

}


function isTrialCurrentlyActive(
    trialData
) {

    if (!trialData) {

        return false;

    }

    if (
        trialData.enabled === false
    ) {

        return false;

    }

    const now =
        new Date();

    let startDate =
        null;

    let endDate =
        null;

    if (
        trialData.startAt
    ) {

        startDate =
            getDateValue(
                trialData.startAt
            );

    }

    if (
        trialData.endAt
    ) {

        endDate =
            getDateValue(
                trialData.endAt
            );

    }

    if (
        !startDate ||
        !endDate
    ) {

        return false;

    }

    return (

        now.getTime() >=
        startDate.getTime()

        &&

        now.getTime() <
        endDate.getTime()

    );

}

/* REGISTER STUDENT */

registerButton.addEventListener(
    "click",
    async function() {

        registerButton.disabled =
            true;

        showMessage(
            "Account එක verify කරමින්..."
        );

        try {

            const existingLocalUid =
                getLocalAccountUid();

            if (
                existingLocalUid
            ) {

                throw new Error(
                    "මෙම device එකට Student account එකක් දැනටමත් සම්බන්ධ කර ඇත."
                );

            }

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const stream =
                document
                    .getElementById("stream")
                    .value;

            const school =
                document
                    .getElementById("school")
                    .value
                    .trim();

            const nearestCity =
                document
                    .getElementById("nearestCity")
                    .value
                    .trim();

            const alYear =
                document
                    .getElementById("alYear")
                    .value;

            const phone =
                document
                    .getElementById("registerPhone")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (
                !name ||
                !stream ||
                !school ||
                !nearestCity ||
                !alYear ||
                !phone ||
                !password ||
                !confirmPassword
            ) {

                throw new Error(
                    "කරුණාකර සියලු තොරතුරු පුරවන්න."
                );

            }


            if (
                password !==
                confirmPassword
            ) {

                throw new Error(
                    "Password දෙක එක සමාන නැහැ."
                );

            }


            if (
                password.length < 6
            ) {

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    loginEmail,
                    password
                );


            const user =
                result.user;

            const uid =
                user.uid;


            const trialData =
                await getTrialSettings();


            const trialIsActive =
                isTrialCurrentlyActive(
                    trialData
                );


            let trialStart =
                null;

            let trialEnd =
                null;


            if (
                trialIsActive
            ) {

                trialStart =
                    getDateValue(
                        trialData.startAt
                    );

                trialEnd =
                    getDateValue(
                        trialData.endAt
                    );

            }


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userData = {

                uid:
                    uid,

                role:
                    "student",

                name:
                    name,

                alStream:
                    stream,

                school:
                    school,

                nearestCity:
                    nearestCity,

                alYear:
                    alYear,

                phoneNumber:
                    phone,

                deviceId:
                    DEVICE_ID,

                subscriptionActive:
                    false,

                subscriptionUntil:
                    null,

                subscriptionPrice:
                    100,

                subscriptionPeriod:
                    "weekly",

                trialActive:
                    trialIsActive,

                trialStartAt:
                    trialStart
                        ? Timestamp.fromDate(
                            trialStart
                        )
                        : null,

                trialUntil:
                    trialEnd
                        ? Timestamp.fromDate(
                            trialEnd
                        )
                        : null,

                trialSource:
                    trialIsActive
                        ? "admin"
                        : "none",

                createdAt:
                    serverTimestamp()

            };


            await setDoc(
                userRef,
                userData
            );


            saveLocalAccountUid(
                uid
            );


            try {

                sessionStorage.setItem(
                    "mcqLoginSession",
                    "student"
                );

            }
            catch(error) {

                console.log(
                    "Session storage unavailable"
                );

            }


            showMessage(
                "✅ Account එක සාර්ථකව සාදන ලදී!",
                "success"
            );


            setTimeout(
                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },
                1000
            );

        }
        catch(error) {

            console.error(
                "Register Error:",
                error
            );

            registerButton.disabled =
                false;


            let text =
                "Account එක සෑදීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                text =
                    "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා.";

            }
            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }
            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);


/* STUDENT LOGIN */

loginButton.addEventListener(
    "click",
    async function() {

        loginButton.disabled =
            true;

        showMessage(
            "Login verify කරමින්..."
        );

        try {

            const phone =
                loginPhone.value.trim();

            const password =
                loginPassword.value;


            if (
                !phone ||
                !password
            ) {

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    loginEmail,
                    password
                );


            const user =
                result.user;


            if (
                user.uid ===
                ADMIN_UID
            ) {

                await signOut(auth);

                throw new Error(
                    "Admin account එක Student Login එකෙන් භාවිතා කරන්න බැහැ."
                );

            }


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const studentData =
                userSnap.data();


            if (
                studentData.role ===
                "admin"
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙය Student account එකක් නොවේ."
                );

            }


            const savedDeviceId =
                studentData.deviceId;


            if (
                savedDeviceId &&
                savedDeviceId !==
                DEVICE_ID
            ) {

                await signOut(auth);

                throw new Error(
                    "🔐 මෙම Student account එක වෙනත් device එකකට සම්බන්ධ කර ඇත."
                );

            }


            const localUid =
                getLocalAccountUid();


            if (
                localUid &&
                localUid !==
                user.uid
            ) {

                await signOut(auth);

                throw new Error(
                    "🔐 මෙම device එක වෙනත් Student account එකකට සම්බන්ධ කර ඇත."
                );

            }


            saveLocalAccountUid(
                user.uid
            );


            try {

                sessionStorage.setItem(
                    "mcqLoginSession",
                    "student"
                );

            }
            catch(error) {

                console.log(
                    "Session storage unavailable"
                );

            }


            showMessage(

                "✅ Login සාර්ථකයි!\n\nWelcome " +

                (
                    studentData.name ||
                    "Student"
                ) +

                "!",

                "success"

            );


            setTimeout(
                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );

        }
        catch(error) {

            console.error(
                "Student Login Error:",
                error
            );

            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }
            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }
            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);


/* ADMIN LOGIN */

adminLoginButton.addEventListener(
    "click",
    async function() {

        adminLoginButton.disabled =
            true;

        showMessage(
            "👑 Admin Login verify කරමින්..."
        );

        try {

            const email =
                adminEmail.value.trim();

            const password =
                adminPassword.value;


            if (
                !email ||
                !password
            ) {

                throw new Error(
                    "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            if (
                user.uid !==
                ADMIN_UID
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙම account එක approved Admin account එකක් නොවේ."
                );

            }


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await setDoc(

                    userRef,

                    {

                        uid:
                            user.uid,

                        name:
                            "Admin",

                        email:
                            user.email ||
                            email,

                        role:
                            "admin",

                        subscriptionActive:
                            true,

                        createdAt:
                            serverTimestamp()

                    }

                );

            }


            try {

                sessionStorage.setItem(
                    "mcqLoginSession",
                    "admin"
                );

                localStorage.setItem(
                    "mcqLoginSession",
                    "admin"
                );

            }
            catch(error) {

                console.log(
                    "Storage unavailable"
                );

            }


            showMessage(
                "✅ Admin Login සාර්ථකයි!",
                "success"
            );


            setTimeout(
                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );

        }
        catch(error) {

            console.error(
                "Admin Login Error:",
                error
            );

            adminLoginButton.disabled =
                false;


            let text =
                "Admin Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Admin Email හෝ Password වැරදියි.";

            }
            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);


/* 5-TAP ADMIN ACCESS */

let adminTapCount = 0;
let adminTapTimer = null;


loginLogo.addEventListener(
    "click",
    function() {

        adminTapCount++;

        clearTimeout(
            adminTapTimer
        );


        if (
            adminTapCount >= 5
        ) {

            adminTapCount = 0;

            adminLoginSection.classList.remove(
                "hidden"
            );

            registerSection.classList.add(
                "hidden"
            );

            loginSection.classList.remove(
                "hidden"
            );

            showMessage(
                "👑 Admin Login විවෘත කළා."
            );

            setTimeout(
                function() {

                    adminEmail.focus();

                },
                100
            );

            return;

        }


        adminTapTimer =
            setTimeout(
                function() {

                    adminTapCount = 0;

                },
                2000
            );

    }
);
