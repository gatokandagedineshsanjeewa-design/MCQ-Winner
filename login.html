const TRUSTED_DEVICE_KEY =

const TRUSTED_DEVICE_PREFIX =

const ADMIN_DEVICE_COLLECTION =

/* ========================================
   DEVICE ID
======================================== */

function generateTrustedDeviceId() {

    try {

        if (
            window.crypto &&
            typeof window.crypto.randomUUID ===
            "function"
        ) {

            return window.crypto.randomUUID();

        }

    }
    catch (error) {

        console.log(
            "randomUUID unavailable"
        );

    }


    return (
        "device-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


function getTrustedDeviceId() {

    try {

        let id =
            localStorage.getItem(
                TRUSTED_DEVICE_KEY
            );


        if (!id) {

            id =
                generateTrustedDeviceId();


            localStorage.setItem(
                TRUSTED_DEVICE_KEY,
                id
            );

        }


        return id;

    }
    catch (error) {

        console.error(
            "Device ID error:",
            error
        );

        return null;

    }

}


const TRUSTED_DEVICE_ID =
    getTrustedDeviceId();


/* ========================================
   SHA256
======================================== */

async function sha256(text) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(text);

    if (
        !window.crypto ||
        !window.crypto.subtle
    ) {

        throw new Error(
            "SHA-256 support නැහැ."
        );

    }


    const hashBuffer =
        await window.crypto.subtle.digest(
            "SHA-256",
            data
        );


    const hashArray =
        Array.from(
            new Uint8Array(
                hashBuffer
            )
        );


    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");

}


/* ========================================
   DEVICE HASH
======================================== */

async function getTrustedDeviceHash() {

    if (!TRUSTED_DEVICE_ID) {

        return null;

    }


    return await sha256(
        TRUSTED_DEVICE_PREFIX +
        TRUSTED_DEVICE_ID
    );

}


/* ========================================
   TRUSTED DEVICE CHECK
======================================== */

async function isTrustedAdminDevice() {

    try {

        const hash =
            await getTrustedDeviceHash();


        if (!hash) {

            return false;

        }


        const deviceRef =
            doc(
                db,
                ADMIN_DEVICE_COLLECTION,
                hash
            );


        const deviceSnap =
            await getDoc(
                deviceRef
            );


        if (
            !deviceSnap.exists()
        ) {

            return false;

        }


        const data =
            deviceSnap.data();


        /*
         * ALL THREE MUST MATCH
         */

        if (
            data.uid !== ADMIN_UID
        ) {

            return false;

        }


        if (
            data.trusted !== true
        ) {

            return false;

        }


        if (
            data.active !== true
        ) {

            return false;

        }


        return true;

    }
    catch (error) {

        console.error(
            "Trusted device check:",
            error
        );

        return false;

    }

}

/* ========================================
   PHONE
======================================== */

function normalizePhone(phone) {

    let cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    if (
        cleanPhone.startsWith("0")
    ) {

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }


    return cleanPhone;

}


function makeLoginEmail(phone) {

    return (
        normalizePhone(phone) +
        "@mcqwinner.local"
    );

}


function isValidSriLankanPhone(phone) {

    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}

registerButton.addEventListener(
    "click",
    async function() {

        registerButton.disabled =
            true;

        showMessage(
            "Account එක සාදමින්..."
        );


        try {

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const stream =
                document
                    .getElementById("stream")
                    .value;

            const school =
                document
                    .getElementById("school")
                    .value
                    .trim();

            const nearestCity =
                document
                    .getElementById("nearestCity")
                    .value
                    .trim();

            const alYear =
                document
                    .getElementById("alYear")
                    .value;

            const phone =
                document
                    .getElementById("registerPhone")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (
                !name ||
                !stream ||
                !school ||
                !nearestCity ||
                !alYear ||
                !phone ||
                !password ||
                !confirmPassword
            ) {

                throw new Error(
                    "කරුණාකර සියලු තොරතුරු පුරවන්න."
                );

            }


            if (
                password !==
                confirmPassword
            ) {

                throw new Error(
                    "Password දෙක එක සමාන නැහැ."
                );

            }


            if (
                password.length < 6
            ) {

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            if (
                !isValidSriLankanPhone(
                    phone
                )
            ) {

                throw new Error(
                    "නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    loginEmail,
                    password
                );


            const user =
                result.user;


            const uid =
                user.uid;


            /* 2 DAY TRIAL */

            const trialStart =
                new Date();


            const trialEnd =
                new Date(
                    trialStart.getTime() +
                    (
                        2 *
                        24 *
                        60 *
                        60 *
                        1000
                    )
                );


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            await setDoc(
                userRef,
                {

                    uid:
                        uid,

                    role:
                        "student",

                    name:
                        name,

                    alStream:
                        stream,

                    school:
                        school,

                    nearestCity:
                        nearestCity,

                    alYear:
                        alYear,

                    phoneNumber:
                        phone,

                    subscriptionActive:
                        false,

                    subscriptionUntil:
                        null,

                    subscriptionPrice:
                        100,

                    subscriptionPeriod:
                        "weekly",

                    trialActive:
                        true,

                    trialStartAt:
                        Timestamp.fromDate(
                            trialStart
                        ),

                    trialUntil:
                        Timestamp.fromDate(
                            trialEnd
                        ),

                    createdAt:
                        serverTimestamp()

                }
            );


            sessionStorage.setItem(
                "mcqLoginSession",
                "student"
            );


            showMessage(

                "✅ Account එක සාර්ථකව සාදන ලදී!\n\n" +
                "🎁 දින 2ක Free MCQ Trial එකක් ලැබුණා.\n\n" +
                "Welcome " +
                name +
                "!",

                "success"

            );


            setTimeout(
                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },
                1200
            );

        }
        catch (error) {

            console.error(
                "Register Error:",
                error
            );


            registerButton.disabled =
                false;


            let text =
                "Account එක සෑදීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                text =
                    "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                text =
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);

loginButton.addEventListener(
    "click",
    async function() {

        loginButton.disabled =
            true;

        showMessage(
            "Login verify කරමින්..."
        );


        try {

            const phone =
                loginPhone
                    .value
                    .trim();

            const password =
                loginPassword
                    .value;


            if (
                !phone ||
                !password
            ) {

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            if (
                !isValidSriLankanPhone(
                    phone
                )
            ) {

                throw new Error(
                    "නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    loginEmail,
                    password
                );


            const user =
                result.user;


            const uid =
                user.uid;


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const studentData =
                userSnap.data();


            if (
                studentData.role ===
                "admin"
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙය Student account එකක් නොවේ. Admin Login භාවිතා කරන්න."
                );

            }


            sessionStorage.setItem(
                "mcqLoginSession",
                "student"
            );


            showMessage(

                "✅ Login සාර්ථකයි!\n\n" +
                "Welcome " +
                (
                    studentData.name ||
                    "Student"
                ) +
                "!",

                "success"

            );


            setTimeout(
                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );

        }
        catch (error) {

            console.error(
                "Student Login Error:",
                error
            );


            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "මෙම Phone Number එකට account එකක් නැහැ.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                text =
                    "Password එක වැරදියි.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);


/* ========================================
   ADMIN LOGIN
======================================== */

adminLoginButton.addEventListener(
    "click",
    async function() {

        adminLoginButton.disabled =
            true;

        showMessage(
            "Admin Login verify කරමින්..."
        );


        try {

            /*
             * TRUSTED DEVICE
             */

            const trusted =
                await isTrustedAdminDevice();


            if (!trusted) {

                throw new Error(
                    "මෙම device එක Trusted Admin Device එකක් නොවේ."
                );

            }


            const email =
                adminEmail
                    .value
                    .trim();

            const password =
                adminPassword
                    .value;


            if (
                !email ||
                !password
            ) {

                throw new Error(
                    "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            /*
             * FIREBASE LOGIN
             */

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            /*
             * ADMIN UID
             */

            if (
                user.uid !==
                ADMIN_UID
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙම account එක Admin account එක නොවේ."
                );

            }


            /*
             * ADMIN PROFILE
             */

            const userRef =
                doc(
                    db,
                    "users",
                    ADMIN_UID
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(auth);

                throw new Error(
                    "Admin profile එක හමු වුණේ නැහැ."
                );

            }


            const adminData =
                userSnap.data();


            if (
                adminData.role !==
                "admin"
            ) {

                await signOut(auth);

                throw new Error(
                    "Admin permission නැහැ."
                );

            }


            /*
             * ADMIN SESSION
             */

            sessionStorage.setItem(
                "mcqLoginSession",
                "admin"
            );


            localStorage.setItem(
                "mcqLoginSession",
                "admin"
            );


            showMessage(

                "✅ Admin Login සාර්ථකයි!\n\n" +
                "MCQ Winner වෙත යමින්...",

                "success"

            );


            setTimeout(
                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },
                700
            );

        }
        catch (error) {

            console.error(
                "Admin Login Error:",
                error
            );


            adminLoginButton.disabled =
                false;


            let text =
                "Admin Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Admin Email හෝ Password වැරදියි.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "Admin Email එක Firebase එකේ නැහැ.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                text =
                    "Admin Password එක වැරදියි.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                text =
                    "Firebase Email/Password Login enable කරන්න.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }
);


/* ========================================
   LOGO 5-TAP
======================================== */

let adminTapCount =
    0;

let adminTapTimer =
    null;


loginLogo.addEventListener(
    "click",
    function() {

        adminTapCount++;


        clearTimeout(
            adminTapTimer
        );


        adminTapTimer =
            setTimeout(
                function() {

                    adminTapCount =
                        0;

                },
                2000
            );


        /*
         * 5 taps completed
         */

        if (
            adminTapCount >= 5
        ) {

            adminTapCount =
                0;


            clearTimeout(
                adminTapTimer
            );


            /*
             * Firebase trusted-device check.
             *
             * If trusted:
             *    Admin Login appears.
             *
             * If not trusted:
             *    Nothing appears.
             */

            revealAdminLoginIfTrusted();

        }

    }
);
