/* ========================================

======================================== */

function showMessage(
    text,
    type = ""
) {

    message.innerText =
        text;

    message.className =
        type;

}


/* ========================================
   PHONE NORMALIZATION
======================================== */

function normalizePhone(phone) {

    let cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    if (
        cleanPhone.startsWith("0")
    ) {

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }


    return cleanPhone;

}


/* ========================================
   PHONE → LOGIN EMAIL
======================================== */

function makeLoginEmail(phone) {

    const cleanPhone =
        normalizePhone(phone);

    return (
        cleanPhone +
        "@mcqwinner.local"
    );

}


/* ========================================
   PHONE VALIDATION
======================================== */

function isValidSriLankanPhone(phone) {

    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    return (

        (
            cleanPhone.startsWith("07") &&
            cleanPhone.length === 10
        )

        ||

        (
            cleanPhone.startsWith("947") &&
            cleanPhone.length === 11
        )

    );

}

/* ========================================
   REGISTER STUDENT
======================================== */

registerButton.addEventListener(

    "click",

    async function() {

        registerButton.disabled =
            true;


        showMessage(
            "Account එක සාදමින්..."
        );


        try {

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const stream =
                document
                    .getElementById("stream")
                    .value;


            const school =
                document
                    .getElementById("school")
                    .value
                    .trim();


            const nearestCity =
                document
                    .getElementById("nearestCity")
                    .value
                    .trim();


            const alYear =
                document
                    .getElementById("alYear")
                    .value;


            const phone =
                document
                    .getElementById("registerPhone")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (

                !name ||
                !stream ||
                !school ||
                !nearestCity ||
                !alYear ||
                !phone ||
                !password ||
                !confirmPassword

            ) {

                throw new Error(
                    "කරුණාකර සියලු තොරතුරු පුරවන්න."
                );

            }


            if (
                password !==
                confirmPassword
            ) {

                throw new Error(
                    "Password දෙක එක සමාන නැහැ."
                );

            }


            if (
                password.length < 6
            ) {

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            /* CREATE STUDENT AUTH */

            const result =
                await createUserWithEmailAndPassword(

                    auth,

                    loginEmail,

                    password

                );


            const user =
                result.user;


            const uid =
                user.uid;


            /* TRIAL */

            const trialStart =
                new Date();


            const trialEnd =
                new Date(

                    trialStart.getTime() +

                    (
                        2 *
                        24 *
                        60 *
                        60 *
                        1000
                    )

                );


            /* FIRESTORE PROFILE */

            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            await setDoc(

                userRef,

                {

                    uid:
                        uid,

                    role:
                        "student",

                    name:
                        name,

                    alStream:
                        stream,

                    school:
                        school,

                    nearestCity:
                        nearestCity,

                    alYear:
                        alYear,

                    phoneNumber:
                        phone,

                    subscriptionActive:
                        false,

                    subscriptionUntil:
                        null,

                    subscriptionPrice:
                        100,

                    subscriptionPeriod:
                        "weekly",

                    trialActive:
                        true,

                    trialStartAt:
                        Timestamp.fromDate(
                            trialStart
                        ),

                    trialUntil:
                        Timestamp.fromDate(
                            trialEnd
                        ),

                    createdAt:
                        serverTimestamp()

                }

            );


            sessionStorage.setItem(
                "mcqLoginSession",
                "student"
            );


            showMessage(

                "✅ Account එක සාර්ථකව සාදන ලදී!\n\n" +

                "🎁 ඔබට දින 2ක Free MCQ Trial එකක් ලැබුණා.\n\n" +

                "Welcome " +
                name +
                "!",

                "success"

            );


            setTimeout(

                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },

                1200

            );

        }


        catch(error) {

            console.error(
                "Register Error:",
                error
            );


            registerButton.disabled =
                false;


            let text =
                "Account එක සෑදීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                text =
                    "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                text =
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }

);


/* ========================================
   STUDENT LOGIN
======================================== */

loginButton.addEventListener(

    "click",

    async function() {

        loginButton.disabled =
            true;


        showMessage(
            "Login verify කරමින්..."
        );


        try {

            const phone =
                loginPhone
                    .value
                    .trim();


            const password =
                loginPassword
                    .value;


            if (
                !phone ||
                !password
            ) {

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            if (
                !isValidSriLankanPhone(phone)
            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const result =
                await signInWithEmailAndPassword(

                    auth,

                    loginEmail,

                    password

                );


            const user =
                result.user;


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            const studentData =
                userSnap.data();


            if (
                studentData.role ===
                "admin"
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙය Student account එකක් නොවේ. Admin Login භාවිතා කරන්න."
                );

            }


            sessionStorage.setItem(
                "mcqLoginSession",
                "student"
            );


            showMessage(

                "✅ Login සාර්ථකයි!\n\n" +

                "Welcome " +

                (
                    studentData.name ||
                    "Student"
                ) +

                "!",

                "success"

            );


            setTimeout(

                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },

                700

            );

        }


        catch(error) {

            console.error(
                "Student Login Error:",
                error
            );


            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "මෙම Phone Number එකට account එකක් නැහැ.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                text =
                    "Password එක වැරදියි.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }

);


/* ========================================
   ADMIN EMAIL + PASSWORD LOGIN
======================================== */

adminLoginButton.addEventListener(

    "click",

    async function() {

        adminLoginButton.disabled =
            true;


        showMessage(
            "👑 Admin Login verify කරමින්..."
        );


        try {

            const email =
                adminEmail
                    .value
                    .trim();


            const password =
                adminPassword
                    .value;


            if (
                !email ||
                !password
            ) {

                throw new Error(
                    "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            const result =
                await signInWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


            const user =
                result.user;


            /* UID SECURITY CHECK */

            if (
                user.uid !== ADMIN_UID
            ) {

                await signOut(auth);

                throw new Error(
                    "මෙම account එක approved Admin account එකක් නොවේ."
                );

            }


            /* FIRESTORE ADMIN CHECK */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                userSnap.exists()
            ) {

                const userData =
                    userSnap.data();


                if (
                    userData.role !==
                    "admin"
                ) {

                    await signOut(auth);

                    throw new Error(
                        "Firestore එකේ මෙම account එක Admin ලෙස සකසා නැහැ."
                    );

                }

            }

            else {

                await setDoc(

                    userRef,

                    {

                        uid:
                            user.uid,

                        name:
                            "Admin",

                        email:
                            user.email ||
                            email,

                        photoURL:
                            "",

                        role:
                            "admin",

                        subscriptionActive:
                            true,

                        createdAt:
                            serverTimestamp()

                    }

                );

            }


            sessionStorage.setItem(
                "mcqLoginSession",
                "admin"
            );


            showMessage(

                "✅ Admin Login සාර්ථකයි!\n\n" +

                "MCQ Winner වෙත යමින්...",

                "success"

            );


            setTimeout(

                function() {

                    window.location.replace(
                        HOME_URL
                    );

                },

                700

            );

        }


        catch(error) {

            console.error(
                "Admin Login Error:",
                error
            );


            adminLoginButton.disabled =
                false;


            let text =
                "Admin Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Admin Email හෝ Password වැරදියි.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "මෙම Admin Email එකට Firebase account එකක් නැහැ.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                text =
                    "Admin Password එක වැරදියි.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                text =
                    "Login attempts වැඩියි. ටික වේලාවකට පසුව නැවත උත්සාහ කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(

                "❌ " +
                text,

                "error"

            );

        }

    }

);


/* ========================================
   ADMIN PASSWORD RESET
======================================== */

adminResetButton.addEventListener(

    "click",

    async function() {

        const email =
            adminEmail
                .value
                .trim();


        if (!email) {

            showMessage(

                "කරුණාකර Admin Email එක මුලින් ඇතුළත් කරන්න.",

                "error"

            );

            return;

        }


        try {

            await sendPasswordResetEmail(

                auth,

                email

            );


            showMessage(

                "✅ Password reset email එක යැව්වා.\n\n" +

                "ඔයාගේ Admin Email inbox එක පරීක්ෂා කරලා " +

                "අලුත් Password එකක් set කරන්න.",

                "success"

            );

        }


        catch(error) {

            console.error(
                "Password Reset Error:",
                error
            );


            let text =
                "Password reset email යැවීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "මෙම Email එකට Firebase account එකක් හමු වුණේ නැහැ.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                text =
                    "Admin Email එක නිවැරදි නැහැ.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                text =
                    "Internet connection එක පරීක්ෂා කරන්න.";

            }


            showMessage(

                "❌ " +
                text,

                "error"

            );

        }

    }

);


/* ========================================
   LOGO 5-TAP ADMIN ACCESS
======================================== */

let adminTapCount =
    0;


let adminTapTimer =
    null;


loginLogo.addEventListener(

    "click",

    function() {

        adminTapCount++;


        clearTimeout(
            adminTapTimer
        );


        adminTapTimer =
            setTimeout(

                function() {

                    adminTapCount =
                        0;

                },

                2000

            );


        if (
            adminTapCount >= 5
        ) {

            adminTapCount =
                0;


            clearTimeout(
                adminTapTimer
            );


            adminLoginSection.classList.remove(
                "hidden"
            );


            showMessage(
                "👑 Admin Login විවෘත කළා."
            );

        }

    }

);

</script>
