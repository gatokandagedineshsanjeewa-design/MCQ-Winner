function normalizePhone(phone){

    let clean =
    phone.replace(/\D/g,"");

    if(clean.startsWith("0")){

        clean =
        "94" +
        clean.substring(1);

    }

    return clean;
}


function makeLoginEmail(phone){

function isValidSriLankanPhone(phone){

    const clean =
    phone.replace(/\D/g,"");

    return (

        (
            clean.startsWith("07") &&
            clean.length === 10
        )

        ||

        (
            clean.startsWith("947") &&
            clean.length === 11
        )

    );

}

/* =====================================================
   SHA-256
   ===================================================== */

async function sha256(text){

    try{

        if(
            window.crypto &&
            window.crypto.subtle &&
            typeof window.crypto.subtle.digest ===
            "function"
        ){

            const encoder =
            new TextEncoder();

            const data =
            encoder.encode(text);

            const hashBuffer =
            await window.crypto.subtle.digest(
                "SHA-256",
                data
            );

            const hashArray =
            Array.from(
                new Uint8Array(hashBuffer)
            );

            return hashArray
            .map(
                b =>
                b.toString(16).padStart(2,"0")
            )
            .join("");

        }

    }
    catch(error){

        console.log(
            "Web Crypto unavailable:",
            error
        );

    }


    /*
       APK fallback.
       If Web Crypto is unavailable,
       use the small SHA-256 fallback below.
    */

    return sha256Fallback(text);

}


/* =====================================================
   SHA-256 FALLBACK
   ===================================================== */

function rightRotate(value,amount){

    return (
        (value >>> amount) |
        (value << (32 - amount))
    );

}


function sha256Fallback(input){

    const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,
        0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
        0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,
        0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,
        0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,
        0x650a7354,0x766a0abb,0x81c2a1cc,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,
        0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,
        0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
        0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];

    const bytes=[];

    for(let i=0;i<input.length;i++){
        bytes.push(input.charCodeAt(i)&255);
    }

    const bitLength=bytes.length*8;

    bytes.push(128);

    while(bytes.length%64!==56){
        bytes.push(0);
    }

    for(let i=7;i>=0;i--){
        bytes.push(
            Math.floor(
                bitLength /
                Math.pow(2,i*8)
            ) & 255
        );
    }

    let H=[
        0x6a09e667,
        0xbb67ae85,
        0x3c6ef372,
        0xa54ff53a,
        0x510e527f,
        0x9b05688c,
        0x1f83d9ab,
        0x5be0cd19
    ];

    for(
        let offset=0;
        offset<bytes.length;
        offset+=64
    ){

        const W=
        new Array(64);

        for(let i=0;i<16;i++){

            const j=
            offset+i*4;

            W[i]=(
                (bytes[j]<<24) |
                (bytes[j+1]<<16) |
                (bytes[j+2]<<8) |
                bytes[j+3]
            )>>>0;

        }

        for(let i=16;i<64;i++){

            const s0=(
                rightRotate(W[i-15],7)^
                rightRotate(W[i-15],18)^
                (W[i-15]>>>3)
            )>>>0;

            const s1=(
                rightRotate(W[i-2],17)^
                rightRotate(W[i-2],19)^
                (W[i-2]>>>10)
            )>>>0;

            W[i]=(
                W[i-16]+
                s0+
                W[i-7]+
                s1
            )>>>0;

        }

        let a=H[0];
        let b=H[1];
        let c=H[2];
        let d=H[3];
        let e=H[4];
        let f=H[5];
        let g=H[6];
        let h=H[7];

        for(let i=0;i<64;i++){

            const S1=(
                rightRotate(e,6)^
                rightRotate(e,11)^
                rightRotate(e,25)
            )>>>0;

            const ch=(
                (e&f)^
                ((~e)&g)
            )>>>0;

            const temp1=(
                h+
                S1+
                ch+
                K[i]+
                W[i]
            )>>>0;

            const S0=(
                rightRotate(a,2)^
                rightRotate(a,13)^
                rightRotate(a,22)
            )>>>0;

            const maj=(
                (a&b)^
                (a&c)^
                (b&c)
            )>>>0;

            const temp2=(
                S0+
                maj
            )>>>0;

            h=g;
            g=f;
            f=e;
            e=(d+temp1)>>>0;
            d=c;
            c=b;
            b=a;
            a=(temp1+temp2)>>>0;

        }

        H[0]=(H[0]+a)>>>0;
        H[1]=(H[1]+b)>>>0;
        H[2]=(H[2]+c)>>>0;
        H[3]=(H[3]+d)>>>0;
        H[4]=(H[4]+e)>>>0;
        H[5]=(H[5]+f)>>>0;
        H[6]=(H[6]+g)>>>0;
        H[7]=(H[7]+h)>>>0;

    }

    return H
    .map(
        value =>
        value
        .toString(16)
        .padStart(8,"0")
    )
    .join("");

}


/* =====================================================
   TRUSTED DEVICE HASH

async function getTrustedDeviceHash(){

    const source =
    TRUSTED_DEVICE_PREFIX +
    TRUSTED_DEVICE_ID;

    return await sha256(source);

}


/* =====================================================
   TRUSTED DEVICE CHECK
   ===================================================== */

async function isTrustedAdminDevice(){

    try{

        const deviceHash =
        await getTrustedDeviceHash();

        if(!deviceHash){
            return false;
        }

        const deviceRef =
        doc(
            db,
            "adminDevices",
            deviceHash
        );

        const deviceSnap =
        await getDoc(deviceRef);

        if(!deviceSnap.exists()){
            return false;
        }

        const data =
        deviceSnap.data();

        if(
            data.uid !==
            ADMIN_UID
        ){
            return false;
        }

        if(
            data.trusted !==
            true
        ){
            return false;
        }

        return true;

    }
    catch(error){

        console.log(
            "Trusted device check failed:",
            error
        );

        return false;

    }

}


async function checkTrustedDeviceSilently(){

    try{
        return await isTrustedAdminDevice();
    }
    catch(error){
        return false;
    }

}

function getDateValue(value){

    if(!value){
        return null;
    }

    if(
        typeof value.toDate ===
        "function"
    ){
        return value.toDate();
    }

    if(value instanceof Date){
        return value;
    }

    if(
        typeof value.seconds ===
        "number"
    ){
        return new Date(
            value.seconds*1000
        );
    }

    const date =
    new Date(value);

    if(isNaN(date.getTime())){
        return null;
    }

    return date;

}


function isTrialCurrentlyActive(data){

    if(!data){
        return false;
    }

    if(data.enabled===false){
        return false;
    }

    const start =
    getDateValue(data.startAt);

    const end =
    getDateValue(data.endAt);

    if(!start || !end){
        return false;
    }

    const now =
    new Date();

    return (
        now>=start &&
        now<end
    );

}

        if(
            !isValidSriLankanPhone(phone)
        ){

            throw new Error(
                "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
            );

        }

        const email =
        makeLoginEmail(phone);

        const result =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user =
        result.user;

        const trialData =
        await getTrialSettings();

        const trialActive =
        isTrialCurrentlyActive(
            trialData
        );

        let trialStart=null;
        let trialEnd=null;

        if(trialActive){

            trialStart =
            getDateValue(
                trialData.startAt
            );

            trialEnd =
            getDateValue(
                trialData.endAt
            );

        }

        await setDoc(

            doc(
                db,
                "users",
                user.uid
            ),

            {
                uid:user.uid,
                role:"student",
                name:name,
                alStream:stream,
                school:school,
                nearestCity:nearestCity,
                alYear:alYear,
                phoneNumber:phone,
                deviceId:DEVICE_ID,

                subscriptionActive:false,
                subscriptionUntil:null,
                subscriptionPrice:100,
                subscriptionPeriod:"weekly",

                trialActive:trialActive,

                trialStartAt:
                trialStart
                ?
                Timestamp.fromDate(trialStart)
                :
                null,

                trialUntil:
                trialEnd
                ?
                Timestamp.fromDate(trialEnd)
                :
                null,

                trialSource:
                trialActive
                ?
                "admin"
                :
                "none",

                createdAt:
                serverTimestamp()
            }

        );

        saveLocalAccountUid(
            user.uid
        );

        showMessage(
            "✅ Account එක සාර්ථකව සාදන ලදී!",
            "success"
        );

        setTimeout(
            function(){
                window.location.replace(
                    HOME_URL
                );
            },
            800
        );

    }
    catch(error){

        console.error(
            "Register Error:",
            error
        );

        registerButton.disabled=false;

        let text =
        "Account එක සෑදීමට නොහැකි විය.";

        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            text =
            "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා.";

        }
        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            text =
            "Internet connection එක පරීක්ෂා කරන්න.";

        }
        else if(error.message){

            text =
            error.message;

        }

        showMessage(
            "❌ "+text,
            "error"
        );

    }

};


/* =====================================================

loginButton.onclick =
async function(){

    loginButton.disabled=true;

    showMessage(
        "Login verify කරමින්..."
    );

    try{

        const phone =
        document.getElementById(
            "loginPhone"
        ).value.trim();

        const password =
        document.getElementById(
            "loginPassword"
        ).value;

        if(!phone || !password){

            throw new Error(
                "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
            );

        }

        if(
            !isValidSriLankanPhone(phone)
        ){

            throw new Error(
                "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
            );

        }

        const result =
        await signInWithEmailAndPassword(
            auth,
            makeLoginEmail(phone),
            password
        );

        const user =
        result.user;

        if(user.uid===ADMIN_UID){

            await signOut(auth);

            throw new Error(
                "Admin account එක Student Login එකෙන් භාවිතා කරන්න බැහැ."
            );

        }

        const userSnap =
        await getDoc(
            doc(
                db,
                "users",
                user.uid
            )
        );

        if(!userSnap.exists()){

            await signOut(auth);

            throw new Error(
                "Student profile එක හමු වුණේ නැහැ."
            );

        }

        const data =
        userSnap.data();

        if(data.role==="admin"){

            await signOut(auth);

            throw new Error(
                "මෙය Student account එකක් නොවේ."
            );

        }

        if(
            data.deviceId &&
            data.deviceId!==DEVICE_ID
        ){

            await signOut(auth);

            throw new Error(
                "🔐 මෙම Student account එක වෙනත් device එකකට සම්බන්ධ කර ඇත."
            );

        }

        const localUid =
        getLocalAccountUid();

        if(
            localUid &&
            localUid!==user.uid
        ){

            await signOut(auth);

            throw new Error(
                "🔐 මෙම device එක වෙනත් Student account එකකට සම්බන්ධ කර ඇත."
            );

        }

        saveLocalAccountUid(
            user.uid
        );

        showMessage(
            "✅ Login සාර්ථකයි!\n\nWelcome "+
            (data.name||"Student")+
            "!",
            "success"
        );

        setTimeout(
            function(){
                window.location.replace(
                    HOME_URL
                );
            },
            800
        );

    }
    catch(error){

        console.error(
            "Student Login Error:",
            error
        );

        loginButton.disabled=false;

        let text =
        "Login කිරීමට නොහැකි විය.";

        if(
            error.code ===
            "auth/invalid-credential"
        ){

            text =
            "Phone Number හෝ Password වැරදියි.";

        }
        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            text =
            "Internet connection එක පරීක්ෂා කරන්න.";

        }
        else if(error.message){

            text =
            error.message;

        }

        showMessage(
            "❌ "+text,
            "error"
        );

    }

};


/* =====================================================
   ADMIN LOGIN
   ===================================================== */

adminLoginButton.onclick =
async function(){

    adminLoginButton.disabled=true;

    showMessage(
        "👑 Admin Login verify කරමින්..."
    );

    try{

        /*
           FIRST TRUSTED DEVICE CHECK
        */

        const trusted =
        await checkTrustedDeviceSilently();

        if(!trusted){

            adminLoginSection.classList.add(
                "hidden"
            );

            adminLoginButton.disabled=false;

            showMessage("");

            return;

        }

        const email =
        document.getElementById(
            "adminEmail"
        ).value.trim();

        const password =
        document.getElementById(
            "adminPassword"
        ).value;

        if(!email || !password){

            throw new Error(
                "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
            );

        }

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user =
        result.user;

        if(user.uid!==ADMIN_UID){

            await signOut(auth);

            throw new Error(
                "මෙම account එක approved Admin account එකක් නොවේ."
            );

        }

        /*
           SECOND TRUSTED DEVICE CHECK
        */

        const trustedAfterLogin =
        await checkTrustedDeviceSilently();

        if(!trustedAfterLogin){

            await signOut(auth);

            throw new Error(
                "🔐 මෙම device එක approved Admin device එකක් නොවේ."
            );

        }

        /*
           ADMIN USER DOCUMENT
        */

        const userRef =
        doc(
            db,
            "users",
            user.uid
        );

        const userSnap =
        await getDoc(userRef);

        if(!userSnap.exists()){

            await signOut(auth);

            throw new Error(
                "Firebase users document එක හමු වුණේ නැහැ.\n\n"+
                "users/"+
                ADMIN_UID+
                " document එකේ role=\"admin\" තිබිය යුතුයි."
            );

        }

        const data =
        userSnap.data();

        if(data.role!=="admin"){

            await signOut(auth);

            throw new Error(
                "Admin profile එකේ role එක admin නොවේ."
            );

        }

        /*
           SAVE ADMIN SESSION
        */

        try{

            localStorage.setItem(
                "mcqLoginSession",
                "admin"
            );

            sessionStorage.setItem(
                "mcqLoginSession",
                "admin"
            );

        }
        catch(error){

            console.log(
                "Storage unavailable"
            );

        }

        showMessage(
            "✅ Admin Login සාර්ථකයි!",
            "success"
        );

        setTimeout(
            function(){

                if(
                    auth.currentUser &&
                    auth.currentUser.uid===ADMIN_UID
                ){

                    window.location.replace(
                        HOME_URL
                    );

                }
                else{

                    adminLoginButton.disabled=false;

                    showMessage(
                        "❌ Login session එක verify කිරීමට නොහැකි විය.",
                        "error"
                    );

                }

            },
            1200
        );

    }
    catch(error){

        console.error(
            "Admin Login Error:",
            error
        );

        adminLoginButton.disabled=false;

        let text =
        "Admin Login කිරීමට නොහැකි විය.";

        if(
            error.code ===
            "auth/invalid-credential"
        ){

            text =
            "Admin Email හෝ Password වැරදියි.";

        }
        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            text =
            "Internet connection එක පරීක්ෂා කරන්න.";

        }
        else if(error.message){

            text =
            error.message;

        }

        showMessage(
            "❌ "+text,
            "error"
        );

    }

};

let tapCount=0;

let tapTimer=null;


loginLogo.onclick =
async function(){

    tapCount++;

    clearTimeout(tapTimer);


    /*
       EXACTLY 5 TAPS
    */

    if(tapCount>=5){

        tapCount=0;

        clearTimeout(tapTimer);


        /*
           CHECK FIREBASE TRUSTED DEVICE
        */

        const trusted =
        await checkTrustedDeviceSilently();


        /*
           =========================================
           NOT TRUSTED
           =========================================

           IMPORTANT:
           Do NOT show Admin Login.
           Do NOT show Admin Setup.
        */

        if(!trusted){

            adminLoginSection.classList.add(
                "hidden"
            );

            registerSection.classList.remove(
                "hidden"
            );

            loginSection.classList.remove(
                "hidden"
            );

            showMessage("");

            return;

        }


        /*
           =========================================
           TRUSTED DEVICE
           =========================================

           SHOW ONLY ADMIN LOGIN
        */

        registerSection.classList.add(
            "hidden"
        );

        adminLoginSection.classList.remove(
            "hidden"
        );

        loginSection.classList.remove(
            "hidden"
        );

        showMessage(
            "👑 Admin Login විවෘත කළා."
        );


        setTimeout(
            function(){

                const adminEmail =
                document.getElementById(
                    "adminEmail"
                );

                if(adminEmail){

                    adminEmail.focus();

                }

            },
            100
        );

        return;

    }


    /*
       RESET AFTER 2 SECONDS
    */

    tapTimer =
    setTimeout(
        function(){

            tapCount=0;

        },
        2000
    );

};

adminLoginSection.classList.add(
