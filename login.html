/* ========================================
   PHONE → LOGIN EMAIL
======================================== */

function makeLoginEmail(phone) {

    let cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    if (
        cleanPhone.startsWith("0")
    ) {

        cleanPhone =
            "94" +
            cleanPhone.substring(1);

    }


    return (
        cleanPhone +
        "@mcqwinner.local"
    );

}

/* ========================================
   REGISTER
   2 DAYS FREE TRIAL
======================================== */

registerButton.addEventListener(

    "click",

    async function() {

        registerButton.disabled =
            true;

        showMessage(
            "Account එක සාදමින්..."
        );


        try {

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const stream =
                document
                    .getElementById("stream")
                    .value;


            const school =
                document
                    .getElementById("school")
                    .value
                    .trim();


            const nearestCity =
                document
                    .getElementById("nearestCity")
                    .value
                    .trim();


            const alYear =
                document
                    .getElementById("alYear")
                    .value;


            const phone =
                document
                    .getElementById("registerPhone")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (

                !name ||
                !stream ||
                !school ||
                !nearestCity ||
                !alYear ||
                !phone ||
                !password ||
                !confirmPassword

            ) {

                throw new Error(
                    "කරුණාකර සියලු තොරතුරු පුරවන්න."
                );

            }


            if (
                password !==
                confirmPassword
            ) {

                throw new Error(
                    "Password දෙක එක සමාන නැහැ."
                );

            }


            if (
                password.length < 6
            ) {

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            const cleanPhone =
                phone.replace(
                    /\D/g,
                    ""
                );


            if (

                !(
                    cleanPhone.startsWith("07") &&
                    cleanPhone.length === 10
                )

                &&

                !(
                    cleanPhone.startsWith("947") &&
                    cleanPhone.length === 11
                )

            ) {

                throw new Error(
                    "කරුණාකර නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            /* ================================
               CREATE FIREBASE ACCOUNT
            ================================= */

            const result =
                await createUserWithEmailAndPassword(

                    auth,

                    loginEmail,

                    password

                );


            const user =
                result.user;


            const uid =
                user.uid;


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            /* ================================
               2 DAY FREE TRIAL
            ================================= */

            const trialStart =
                new Date();


            const trialEnd =
                new Date(
                    trialStart.getTime() +
                    (2 * 24 * 60 * 60 * 1000)
                );


            /* ================================
               SAVE STUDENT PROFILE
            ================================= */

            await setDoc(

                userRef,

                {

                    uid:
                        uid,

                    name:
                        name,

                    alStream:
                        stream,

                    school:
                        school,

                    nearestCity:
                        nearestCity,

                    alYear:
                        alYear,

                    phoneNumber:
                        phone,

                    subscriptionActive:
                        false,

                    subscriptionUntil:
                        null,

                    trialActive:
                        true,

                    trialStartAt:
                        trialStart,

                    trialUntil:
                        trialEnd,

                    createdAt:
                        serverTimestamp()

                }

            );


            /* ================================
               SESSION
            ================================= */

            sessionStorage.setItem(
                "mcqLoginSession",
                "true"
            );


            showMessage(

                "✅ Account එක සාර්ථකව සාදන ලදී!\n\n" +
                "🎁 ඔබට දින 2ක Free Trial එකක් ලැබුණා.\n\n" +
                "Welcome " +
                name +
                "!",

                "success"

            );


            setTimeout(

                function() {

                    window.location.href =
                        HOME_URL;

                },

                1500

            );

        }


        catch(error) {

            console.error(
                "Register Error:",
                error
            );


            registerButton.disabled =
                false;


            let text =
                "Account එක සෑදීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                text =
                    "මෙම Phone Number එකෙන් account එකක් දැනටමත් තිබෙනවා.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                text =
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි.";

            else if (

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }

);


/* ========================================
   STUDENT LOGIN
======================================== */

loginButton.addEventListener(

    "click",

    async function() {

        loginButton.disabled =
            true;

        showMessage(
            "Login වෙමින්..."
        );


        try {

            const phone =
                loginPhone
                    .value
                    .trim();


            const password =
                loginPassword
                    .value;


            if (
                !phone ||
                !password
            ) {

                throw new Error(
                    "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
                );

            }


            const loginEmail =
                makeLoginEmail(
                    phone
                );


            const result =
                await signInWithEmailAndPassword(

                    auth,

                    loginEmail,

                    password

                );


            const user =
                result.user;


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                await signOut(auth);

                throw new Error(
                    "Student profile එක හමු වුණේ නැහැ."
                );

            }


            sessionStorage.setItem(
                "mcqLoginSession",
                "true"
            );


            showMessage(

                "✅ Login සාර්ථකයි!",

                "success"

            );


            setTimeout(

                function() {

                    window.location.href =
                        HOME_URL;

                },

                700

            );

        }


        catch(error) {

            console.error(
                "Student Login Error:",
                error
            );


            loginButton.disabled =
                false;


            let text =
                "Login කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                text =
                    "Phone Number හෝ Password වැරදියි.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "මෙම Phone Number එකට account එකක් නැහැ.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                text =
                    "Password එක වැරදියි.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }

    }

);

                );

            }

            else {

                await setDoc(

                    {

            /* ================================

            setTimeout(

        }


        catch(error) {

            console.error(

            if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                text =
                    "Google Login window එක වසා දමා ඇත.";

            }

            else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                text =
                    "Browser එක Google Login popup එක block කර ඇත.";

            }

            else if (
                error.code ===
                "auth/cancelled-popup-request"
            ) {

                text =
                    "Google Login request එක අවලංගු විය.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(

                "❌ " +
                text,

                "error"

            );

        }

    }

);

let adminTapTimer = null;


loginLogo.addEventListener(

    "click",

    function() {

        adminTapCount++;


        clearTimeout(
            adminTapTimer
        );


        adminTapTimer =
            setTimeout(

                function() {

                    adminTapCount = 0;

                },

                2000

            );


        if (
            adminTapCount >= 5
        ) {

            adminTapCount = 0;


            clearTimeout(
                adminTapTimer
            );


            adminLoginSection.classList.remove(
                "hidden"
            );


            showMessage(
                "👑 Admin Login විවෘත කළා."
            );

        }

    }

);

</script></body></html>
