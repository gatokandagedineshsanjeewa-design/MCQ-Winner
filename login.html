/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type=""){
  messageBox.textContent = text;
  messageBox.className = "message";

  if(type){
    messageBox.classList.add(type);
  }

  messageBox.classList.remove("hidden");
}


function hideMessage(){
  messageBox.classList.add("hidden");
}


/* =========================================================
   PHONE NORMALIZE
========================================================= */

function normalizePhone(phone){

  phone = String(phone || "").trim();

  phone = phone.replace(/\s+/g,"");

  if(phone.startsWith("+94")){
    phone = "0" + phone.substring(3);
  }

  if(phone.startsWith("94")){
    phone = "0" + phone.substring(2);
  }

  return phone;
}


/* =========================================================
   AUTH ALIAS
========================================================= */

function makeAuthEmail(phone){

  const normalized =
    normalizePhone(phone);

  return normalized + "@mcqwinner.local";
}


/* =========================================================
   STUDENT DEVICE ID
   (This is NOT Trusted Admin Device System)
========================================================= */

function generateDeviceId(){

  if(window.crypto &&
     crypto.randomUUID){

    return crypto.randomUUID();
  }

  return "device-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,12);
}


function getDeviceId(){

  try{

    let id =
      localStorage.getItem("mcqWinnerDeviceId");

    if(!id){

      id = generateDeviceId();

      localStorage.setItem(
        "mcqWinnerDeviceId",
        id
      );
    }

    return id;

  }catch(error){

    return generateDeviceId();
  }
}


const DEVICE_ID = getDeviceId();


/* =========================================================
   TRIAL SETTINGS
========================================================= */

async function getTrialSettings(){

  try{

    const trialRef =
      doc(db,"settings","trial");

    const trialSnap =
      await getDoc(trialRef);

    if(!trialSnap.exists()){
      return {
        active:true,
        start:null,
        end:null
      };
    }

    const data =
      trialSnap.data();

    return data;

  }catch(error){

    console.log(
      "Trial settings error:",
      error
    );

    return {
      active:true,
      start:null,
      end:null
    };
  }
}


function trialIsActive(settings){

  if(!settings ||
     settings.active !== true){

    return false;
  }

  const now =
    new Date();

  let start = null;
  let end = null;

  if(settings.start){

    if(
      typeof settings.start.toDate ===
      "function"
    ){
      start = settings.start.toDate();
    }else{
      start = new Date(settings.start);
    }
  }

  if(settings.end){

    if(
      typeof settings.end.toDate ===
      "function"
    ){
      end = settings.end.toDate();
    }else{
      end = new Date(settings.end);
    }
  }

  if(start && now < start){
    return false;
  }

  if(end && now > end){
    return false;
  }

  return true;
}

/* =========================================================
   STUDENT REGISTER
========================================================= */

registerButton.onclick =
async function(){

  registerButton.disabled = true;

  hideMessage();

  try{

    const name =
      document
        .getElementById("registerName")
        .value
        .trim();

    const stream =
      document
        .getElementById("registerStream")
        .value;

    const school =
      document
        .getElementById("registerSchool")
        .value
        .trim();

    const city =
      document
        .getElementById("registerCity")
        .value
        .trim();

    const alYear =
      document
        .getElementById("registerYear")
        .value;

    const phone =
      normalizePhone(
        document
          .getElementById("registerPhone")
          .value
      );

    const password =
      document
        .getElementById("registerPassword")
        .value;

    const confirmPassword =
      document
        .getElementById("registerConfirmPassword")
        .value;


    if(
      !name ||
      !stream ||
      !school ||
      !city ||
      !alYear ||
      !phone ||
      !password ||
      !confirmPassword
    ){
      throw new Error(
        "සියලුම තොරතුරු ඇතුළත් කරන්න."
      );
    }


    if(
      !/^0\d{9}$/.test(phone)
    ){
      throw new Error(
        "නිවැරදි Sri Lankan Phone Number එකක් ඇතුළත් කරන්න."
      );
    }


    if(password.length < 6){
      throw new Error(
        "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
      );
    }


    if(password !== confirmPassword){
      throw new Error(
        "Password දෙක එක සමාන නැහැ."
      );
    }


    showMessage(
      "Account එක සකස් කරමින්..."
    );


    const authEmail =
      makeAuthEmail(phone);


    const result =
      await createUserWithEmailAndPassword(
        auth,
        authEmail,
        password
      );


    const user =
      result.user;


    /* -----------------------------------------------------
       TRIAL
    ----------------------------------------------------- */

    const trialSettings =
      await getTrialSettings();

    const trialActive =
      trialIsActive(trialSettings);


    let trialUntil = null;


    if(trialActive){

      let trialEnd =
        new Date();

      trialEnd.setDate(
        trialEnd.getDate() + 2
      );

      trialUntil =
        Timestamp.fromDate(trialEnd);
    }


    /* -----------------------------------------------------
       USER PROFILE
    ----------------------------------------------------- */

    const userData = {

      uid:user.uid,

      name:name,

      stream:stream,

      school:school,

      nearestCity:city,

      alYear:alYear,

      phoneNumber:phone,

      role:"student",

      subscriptionActive:false,

      subscriptionUntil:null,

      subscriptionPrice:100,

      subscriptionPeriod:"weekly",

      trialActive:trialActive,

      trialUntil:trialUntil,

      trialSource:
        trialActive
          ? "admin"
          : "none",

      deviceId:DEVICE_ID,

      createdAt:
        serverTimestamp(),

      updatedAt:
        serverTimestamp()
    };


    await setDoc(
      doc(db,"users",user.uid),
      userData
    );


    try{

      localStorage.setItem(
        "mcqLoginSession",
        "student"
      );

      sessionStorage.setItem(
        "mcqLoginSession",
        "student"
      );

      localStorage.setItem(
        "mcqWinnerAccountUid",
        user.uid
      );

    }catch(error){

      console.log(
        "Storage unavailable"
      );
    }


    showMessage(
      trialActive
        ? "✅ Registration සාර්ථකයි! දින 2ක Trial එක ආරම්භ වුණා."
        : "✅ Registration සාර්ථකයි!",
      "success"
    );


    setTimeout(
      function(){

        if(
          auth.currentUser &&
          auth.currentUser.uid === user.uid
        ){

          window.location.replace(
            HOME_URL
          );

        }else{

          registerButton.disabled = false;

          showMessage(
            "❌ Login session එක verify කිරීමට නොහැකි විය.",
            "error"
          );
        }

      },
      1200
    );


  }catch(error){

    console.error(error);

    let msg =
      error.message ||
      "Registration failed.";

    if(
      error.code ===
      "auth/email-already-in-use"
    ){
      msg =
        "මෙම Phone Number එකෙන් Account එකක් දැනටමත් තිබෙනවා.";
    }

    if(
      error.code ===
      "auth/weak-password"
    ){
      msg =
        "Password එක තව ශක්තිමත් කරන්න.";
    }

    showMessage(
      "❌ " + msg,
      "error"
    );

    registerButton.disabled = false;
  }

};


/* =========================================================
   STUDENT LOGIN
========================================================= */

loginButton.onclick =
async function(){

  loginButton.disabled = true;

  hideMessage();

  try{

    const phone =
      normalizePhone(
        document
          .getElementById("loginPhone")
          .value
      );

    const password =
      document
        .getElementById("loginPassword")
        .value;


    if(!phone || !password){

      throw new Error(
        "Phone Number සහ Password දෙකම ඇතුළත් කරන්න."
      );
    }


    if(
      !/^0\d{9}$/.test(phone)
    ){

      throw new Error(
        "නිවැරදි Phone Number එකක් ඇතුළත් කරන්න."
      );
    }


    showMessage(
      "Login verify කරමින්..."
    );


    const authEmail =
      makeAuthEmail(phone);


    const result =
      await signInWithEmailAndPassword(
        auth,
        authEmail,
        password
      );


    const user =
      result.user;


    /* -----------------------------------------------------
       ADMIN UID LOGIN USING STUDENT FORM
       -----------------------------------------------------
       If the Admin account tries to use Student Login,
       don't treat it as a student.
    ----------------------------------------------------- */

    if(user.uid === ADMIN_UID){

      await signOut(auth);

      throw new Error(
        "Admin account එක Admin Login හරහා ඇතුළත් කරන්න."
      );
    }


    /* -----------------------------------------------------
       USER PROFILE
    ----------------------------------------------------- */

    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    const userSnap =
      await getDoc(userRef);


    if(!userSnap.exists()){

      await signOut(auth);

      throw new Error(
        "User profile එක Firestore එකේ හමු වුණේ නැහැ."
      );
    }


    const data =
      userSnap.data();


    if(data.role === "admin"){

      await signOut(auth);

      throw new Error(
        "Admin account එක Admin Login හරහා ඇතුළත් කරන්න."
      );
    }


    /* -----------------------------------------------------
       DEVICE ID
    ----------------------------------------------------- */

    if(
      data.deviceId &&
      data.deviceId !== DEVICE_ID
    ){

      console.log(
        "Account device mismatch."
      );

      /*
       * Existing student device system is kept.
       * Do not automatically block here unless
       * Firestore rules/app logic require it.
       */
    }


    /* -----------------------------------------------------
       TRIAL CHECK
    ----------------------------------------------------- */

    let trialActive =
      false;

    if(data.trialActive === true){

      if(data.trialUntil){

        let trialEnd;

        if(
          typeof data.trialUntil.toDate ===
          "function"
        ){

          trialEnd =
            data.trialUntil.toDate();

        }else{

          trialEnd =
            new Date(data.trialUntil);
        }


        if(
          new Date() <= trialEnd
        ){

          trialActive = true;

        }else{

          trialActive = false;
        }

      }else{

        trialActive = true;
      }
    }


    /* -----------------------------------------------------
       SAVE LOGIN SESSION
    ----------------------------------------------------- */

    try{

      localStorage.setItem(
        "mcqLoginSession",
        "student"
      );

      sessionStorage.setItem(
        "mcqLoginSession",
        "student"
      );

      localStorage.setItem(
        "mcqWinnerAccountUid",
        user.uid
      );

    }catch(error){

      console.log(
        "Storage unavailable"
      );
    }


    showMessage(
      "✅ Login සාර්ථකයි!",
      "success"
    );


    setTimeout(
      function(){

        if(
          auth.currentUser &&
          auth.currentUser.uid === user.uid
        ){

          window.location.replace(
            HOME_URL
          );

        }else{

          loginButton.disabled = false;

          showMessage(
            "❌ Login session එක verify කිරීමට නොහැකි විය.",
            "error"
          );
        }

      },
      1000
    );


  }catch(error){

    console.error(error);

    let msg =
      error.message ||
      "Login failed.";


    if(
      error.code ===
      "auth/invalid-credential"
    ){

      msg =
        "Phone Number හෝ Password වැරදියි.";
    }


    if(
      error.code ===
      "auth/user-not-found"
    ){

      msg =
        "මෙම Phone Number එකෙන් Account එකක් හමු වුණේ නැහැ.";
    }


    if(
      error.code ===
      "auth/wrong-password"
    ){

      msg =
        "Password එක වැරදියි.";
    }


    showMessage(
      "❌ " + msg,
      "error"
    );


    loginButton.disabled = false;
  }

};


/* =========================================================
   ADMIN LOGIN
========================================================= */

adminLoginButton.onclick =
async function(){

  adminLoginButton.disabled = true;

  showMessage(
    "👑 Admin Login verify කරමින්..."
  );


  try{

    const email =
      document
        .getElementById("adminEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("adminPassword")
        .value;


    if(!email || !password){

      throw new Error(
        "Admin Email සහ Password දෙකම ඇතුළත් කරන්න."
      );
    }


    /* -----------------------------------------------------
       FIREBASE AUTH
    ----------------------------------------------------- */

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      result.user;


    /* -----------------------------------------------------
       UID CHECK
    ----------------------------------------------------- */

    if(user.uid !== ADMIN_UID){

      await signOut(auth);

      throw new Error(
        "මෙම account එක approved Admin account එකක් නොවේ."
      );
    }


    /* -----------------------------------------------------
       FIRESTORE ADMIN PROFILE CHECK
    ----------------------------------------------------- */

    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    const userSnap =
      await getDoc(userRef);


    if(!userSnap.exists()){

      await signOut(auth);

      throw new Error(
        "Admin profile එක Firestore users collection එකේ හමු වුණේ නැහැ."
      );
    }


    const data =
      userSnap.data();


    if(data.role !== "admin"){

      await signOut(auth);

      throw new Error(
        "Admin profile එකේ role එක admin නොවේ."
      );
    }


    /* -----------------------------------------------------
       ADMIN SESSION
    ----------------------------------------------------- */

    try{

      localStorage.setItem(
        "mcqLoginSession",
        "admin"
      );

      sessionStorage.setItem(
        "mcqLoginSession",
        "admin"
      );

    }catch(error){

      console.log(
        "Storage unavailable"
      );
    }


    showMessage(
      "✅ Admin Login සාර්ථකයි!",
      "success"
    );


    setTimeout(
      function(){

        if(
          auth.currentUser &&
          auth.currentUser.uid === ADMIN_UID
        ){

          window.location.replace(
            HOME_URL
          );

        }else{

          adminLoginButton.disabled = false;

          showMessage(
            "❌ Login session එක verify කිරීමට නොහැකි විය.",
            "error"
          );
        }

      },
      1200
    );


  }catch(error){

    console.error(error);

    let msg =
      error.message ||
      "Admin Login failed.";


    if(
      error.code ===
      "auth/invalid-credential"
    ){

      msg =
        "Admin Email හෝ Password වැරදියි.";
    }


    if(
      error.code ===
      "auth/user-not-found"
    ){

      msg =
        "Admin account එක හමු වුණේ නැහැ.";
    }


    if(
      error.code ===
      "auth/wrong-password"
    ){

      msg =
        "Admin Password එක වැරදියි.";
    }


    showMessage(
      "❌ " + msg,
      "error"
    );


    adminLoginButton.disabled = false;
  }

};


/* =========================================================
   5-TAP ADMIN ACCESS
   ========================================================= */

let tapCount = 0;
let tapTimer = null;


loginLogo.onclick =
function(){

  tapCount++;

  clearTimeout(tapTimer);


  if(tapCount >= 5){

    tapCount = 0;

    clearTimeout(tapTimer);


    /*
     * Trusted Device System removed.
     * 5 taps directly reveal Admin Login.
     */

    adminLoginSection.classList.remove(
      "hidden"
    );

    registerSection.classList.add(
      "hidden"
    );

    loginSection.classList.remove(
      "hidden"
    );


    showMessage(
      "👑 Admin Login විවෘත කළා.",
      "success"
    );


    setTimeout(
      function(){

        const adminEmail =
          document.getElementById(
            "adminEmail"
          );

        if(adminEmail){

          adminEmail.focus();
        }

      },
      100
    );


    return;
  }


  tapTimer =
    setTimeout(
      function(){

        tapCount = 0;

      },
      2000
    );

};


/* =========================================================
   INITIAL STATE
========================================================= */

adminLoginSection.classList.add(
  "hidden"
);

registerSection.classList.add(
  "hidden"
);

loginSection.classList.remove(
  "hidden"
);

hideMessage();


</script>
