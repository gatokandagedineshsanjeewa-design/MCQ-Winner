<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MCQ Winner - Admin Setup</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 20px;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: #f2f6ff;

}

.box {

    width: 100%;
    max-width: 500px;

    margin: 30px auto;

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

}

h1 {

    text-align: center;

    color: #1e3a8a;

    margin-top: 0;

}

p {

    line-height: 1.5;

}

input {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    font-size: 15px;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

}

button:disabled {

    opacity: 0.6;

}

.admin {

    background: #1e3a8a;

}

.hidden {

    display: none;

}

#message {

    margin-top: 20px;

    text-align: center;

    white-space: pre-wrap;

    line-height: 1.5;

}

.success {

    color: #15803d;

}

.error {

    color: #dc2626;

}

.uid {

    background: #f3f4f6;

    padding: 10px;

    border-radius: 8px;

    word-break: break-all;

    font-size: 13px;

}

.warning {

    background: #fff7ed;

    padding: 12px;

    border-radius: 10px;

    font-size: 13px;

    color: #9a3412;

}

</style>

</head>


<body>


<div class="box">

<h1>👑 Admin Setup</h1>

<p>

මෙය MCQ Winner Admin account එකට

<strong>Email + Password</strong>

login එක සම්බන්ධ කිරීම සඳහා පමණි.

</p>


<div class="warning">

⚠️ දැනට තිබෙන Admin Google account එකෙන්ම login විය යුතුයි.

වෙනත් Google account එකක් භාවිතා කරන්න එපා.

</div>


<button
    id="googleLoginButton"
    class="admin"
>

1️⃣ Existing Admin Google Login

</button>


<div
    id="accountSection"
    class="hidden"
>

<hr>


<p><strong>Current Firebase UID:</strong></p>

<div
    id="uidDisplay"
    class="uid"
></div>


<p>

මෙම UID එක පහත approved Admin UID එකට

සමාන විය යුතුයි.

</p>


<div
    id="approvedUid"
    class="uid"
></div>


<input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
    autocomplete="email"
>


<input
    type="password"
    id="adminPassword"
    placeholder="New Admin Password"
    autocomplete="new-password"
>


<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Admin Password"
    autocomplete="new-password"
>


<button
    id="linkButton"
>

2️⃣ Email + Password Link කරන්න

</button>


<button
    id="logoutButton"
>

Logout

</button>

</div>


<p id="message"></p>

</div>


<script type="module">


/* ========================================
   FIREBASE
======================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    GoogleAuthProvider,

    signInWithPopup,

    signOut,

    EmailAuthProvider,

    linkWithCredential

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ========================================
   FIREBASE CONFIG
======================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:
        "mcq-winner",

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:
        "1022060912943",

    appId:
        "1:1022060912943:web:f6e58414867e32f685c1da",

    measurementId:
        "G-MBH3NZ728H"

};


/* ========================================
   APPROVED ADMIN UID
======================================== */

const ADMIN_UID =
    "Npiu0xJQQchrVgHnXRuR8Rr5FOA2";


/* ========================================
   INITIALIZE
======================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const provider =
    new GoogleAuthProvider();


/* ========================================
   ELEMENTS
======================================== */

const googleLoginButton =
    document.getElementById(
        "googleLoginButton"
    );


const accountSection =
    document.getElementById(
        "accountSection"
    );


const uidDisplay =
    document.getElementById(
        "uidDisplay"
    );


const approvedUid =
    document.getElementById(
        "approvedUid"
    );


const adminEmail =
    document.getElementById(
        "adminEmail"
    );


const adminPassword =
    document.getElementById(
        "adminPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const linkButton =
    document.getElementById(
        "linkButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const message =
    document.getElementById(
        "message"
    );


approvedUid.innerText =
    ADMIN_UID;


/* ========================================
   MESSAGE
======================================== */

function showMessage(
    text,
    type = ""
) {

    message.innerText =
        text;

    message.className =
        type;

}


/* ========================================
   GOOGLE ADMIN LOGIN
======================================== */

googleLoginButton.addEventListener(

    "click",

    async function() {

        googleLoginButton.disabled =
            true;

        showMessage(
            "👑 Admin Google account verify කරමින්..."
        );


        try {

            /*
             * Existing Google Admin account
             * එකෙන් login වෙනවා.
             */

            const result =
                await signInWithPopup(

                    auth,

                    provider

                );


            const user =
                result.user;


            /*
             * UID CHECK
             *
             * මෙය අනිවාර්යයි.
             */

            if (
                user.uid !== ADMIN_UID
            ) {

                await signOut(auth);


                throw new Error(

                    "මෙය approved Admin account එක නොවේ.\n\n" +

                    "UID:\n" +

                    user.uid

                );

            }


            /*
             * Existing Admin UID
             * නිවැරදි නම් පමණක්
             * setup form එක පෙන්වයි.
             */

            uidDisplay.innerText =
                user.uid;


            adminEmail.value =
                user.email || "";


            accountSection.classList.remove(
                "hidden"
            );


            showMessage(

                "✅ Existing Admin account එක නිවැරදියි.\n\n" +

                "දැන් Email + Password එක link කරන්න.",

                "success"

            );

        }


        catch(error) {

            console.error(
                "Google Admin Login:",
                error
            );


            let text =
                "Admin Google Login අසාර්ථකයි.";


            if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                text =
                    "Login window එක වසා ඇත.";

            }

            else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                text =
                    "Browser එක popup එක block කරලා. නැවත උත්සාහ කරන්න.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );


            googleLoginButton.disabled =
                false;

        }

    }

);


/* ========================================
   LINK EMAIL + PASSWORD
======================================== */

linkButton.addEventListener(

    "click",

    async function() {

        linkButton.disabled =
            true;


        try {

            const user =
                auth.currentUser;


            if (!user) {

                throw new Error(
                    "Admin account එක login වී නැහැ."
                );

            }


            /*
             * UID CHECK AGAIN
             */

            if (
                user.uid !== ADMIN_UID
            ) {

                throw new Error(
                    "Approved Admin UID එක නොවේ."
                );

            }


            const email =
                adminEmail.value.trim();


            const password =
                adminPassword.value;


            const confirm =
                confirmPassword.value;


            if (
                !email ||
                !password ||
                !confirm
            ) {

                throw new Error(
                    "Email සහ Password fields සියල්ල පුරවන්න."
                );

            }


            if (
                password.length < 6
            ) {

                throw new Error(
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි."
                );

            }


            if (
                password !== confirm
            ) {

                throw new Error(
                    "Password දෙක එක සමාන නැහැ."
                );

            }


            /*
             * CREATE EMAIL/PASSWORD CREDENTIAL
             *
             * මෙය NEW Firebase USER එකක්
             * create කරන්නේ නැහැ.
             *
             * Existing Google user එකට
             * credential එක LINK කරනවා.
             */

            const credential =
                EmailAuthProvider.credential(

                    email,

                    password

                );


            showMessage(
                "🔄 Email + Password සම්බන්ධ කරමින්..."
            );


            /*
             * IMPORTANT:
             *
             * linkWithCredential()
             * නිසා existing user UID
             * preserve වෙනවා.
             */

            await linkWithCredential(

                user,

                credential

            );


            showMessage(

                "✅ සාර්ථකයි!\n\n" +

                "Admin Email + Password login එක සම්බන්ධ කළා.\n\n" +

                "UID එක වෙනස් වී නැහැ:\n" +

                user.uid +

                "\n\n" +

                "දැන් login.html එකෙන් Email + Password භාවිතා කරලා Admin Login කරන්න.",

                "success"

            );


            linkButton.disabled =
                true;

        }


        catch(error) {

            console.error(
                "Link Error:",
                error
            );


            linkButton.disabled =
                false;


            let text =
                "Email + Password link කිරීමට නොහැකි විය.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                text =
                    "මෙම Email එක දැනටමත් වෙනත් Firebase account එකකට සම්බන්ධයි.\n\nවෙනත් Email එකක් භාවිතා කරන්න.";

            }

            else if (
                error.code ===
                "auth/credential-already-in-use"
            ) {

                text =
                    "මෙම Email + Password credential එක දැනටමත් වෙනත් Firebase account එකකට සම්බන්ධයි.";

            }

            else if (
                error.code ===
                "auth/provider-already-linked"
            ) {

                text =
                    "Email + Password provider එක දැනටමත් මේ Admin account එකට link කරලා තියෙනවා.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                text =
                    "Admin Email එක නිවැරදි නැහැ.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                text =
                    "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි.";

            }

            else if (
                error.message
            ) {

                text =
                    error.message;

            }


            showMessage(

                "❌ " + text,

                "error"

            );

        }

    }

);


/* ========================================
   LOGOUT
======================================== */

logoutButton.addEventListener(

    "click",

    async function() {

        try {

            await signOut(auth);

        }

        catch(error) {

            console.error(error);

        }


        accountSection.classList.add(
            "hidden"
        );


        googleLoginButton.disabled =
            false;


        adminEmail.value =
            "";

        adminPassword.value =
            "";

        confirmPassword.value =
            "";


        showMessage(
            "Logout වුණා."
        );

    }

);


</script>

</body>

</html>
