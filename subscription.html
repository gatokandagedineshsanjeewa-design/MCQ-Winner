<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MCQ Winner - Subscription</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef4ff;
    color: #172554;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
}

.card {
    background: white;

    border-radius: 24px;

    padding: 30px 24px;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);
}

.logo {
    width: 90px;
    height: 90px;

    object-fit: contain;

    margin-bottom: 10px;
}

h1 {
    margin: 5px 0;

    color: #1e3a8a;

    font-size: 30px;
}

.subtitle {
    color: #64748b;

    margin-bottom: 25px;

    line-height: 1.5;
}

.price-box {
    background: #eff6ff;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 22px;
}

.price {
    font-size: 34px;

    font-weight: bold;

    color: #2563eb;
}

.week {
    color: #64748b;

    margin-top: 5px;
}

.features {
    text-align: left;

    margin: 20px 0;
}

.feature {
    padding: 10px 0;

    font-size: 16px;
}

.subscribe-btn {
    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 12px;

    background: #2563eb;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

.subscribe-btn:active {
    transform: scale(0.98);
}

.note {
    margin-top: 18px;

    color: #64748b;

    font-size: 13px;

    line-height: 1.5;
}

.message {
    margin-top: 15px;

    color: #dc2626;

    line-height: 1.5;
}

.back-btn {
    margin-top: 15px;

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    background: #e2e8f0;

    color: #172554;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <img
            class="logo"
            src="Logo.png"
            alt="MCQ Winner Logo"
        >

        <h1>
            MCQ Winner
        </h1>

        <div class="subtitle">

            Daily MCQ Test access ලබාගන්න
            subscription එක activate කරන්න.

        </div>


        <div class="price-box">

            <div class="price">
                රු.20
            </div>

            <div class="week">
                සතියකට
            </div>

        </div>


        <div class="features">

            <div class="feature">
                ✅ Chemistry – Daily 25 MCQs
            </div>

            <div class="feature">
                ✅ Physics – Daily 25 MCQs
            </div>

            <div class="feature">
                ✅ Daily Test & Results
            </div>

            <div class="feature">
                ✅ Rank List
            </div>

            <div class="feature">
                ✅ Discussion
            </div>

        </div>


        <button
            id="subscribeButton"
            class="subscribe-btn"
        >
            💳 Subscribe – රු.20 / සතිය
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <div class="note">

            Payment system එක ඉදිරියේදී
            Google Play Billing සමඟ connect කරනු ඇත.

        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Home
        </button>

    </div>

</div>


<script>

function goBack() {

    window.location.href =
        "./index.html";

}


document
    .getElementById("subscribeButton")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById("message")
                .textContent =
                "Google Play payment system එක තවම connect කරලා නැහැ. මේ button එක අපි පසුව Google Play Billing සමඟ connect කරමු.";

        }
    );

</script>

</body>

</html>
