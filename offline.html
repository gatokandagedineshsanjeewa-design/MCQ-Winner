<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MCQ Winner - Offline</title>

<meta
    name="theme-color"
    content="#1e3a8a"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial, sans-serif;

    background: #eef4ff;

    color: #172554;

    text-align: center;

    padding: 20px;
}


.offline-box {

    width: 100%;

    max-width: 450px;

    background: white;

    padding: 35px 25px;

    border-radius: 25px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);

}


.logo {

    font-size: 65px;

    margin-bottom: 10px;

}


h1 {

    margin: 0;

    color: #1e3a8a;

    font-size: 30px;

}


h2 {

    margin: 15px 0 10px;

    font-size: 23px;

}


p {

    color: #64748b;

    line-height: 1.6;

    margin: 8px 0;

}


.retry-button {

    display: inline-block;

    margin-top: 20px;

    padding: 13px 28px;

    background: #2563eb;

    color: white;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.retry-button:active {

    transform: scale(0.96);

}


.footer {

    margin-top: 25px;

    font-size: 13px;

    color: #94a3b8;

}

</style>

</head>


<body>


<div class="offline-box">


    <div class="logo">
        🏆
    </div>


    <h1>
        MCQ Winner
    </h1>


    <h2>
        📡 Internet Connection නැහැ
    </h2>


    <p>
        දැනට Internet connection එක
        නොමැති නිසා මේ page එක
        load කරන්න බැහැ.
    </p>


    <p>
        Internet connection එක නැවත ලබාගෙන
        <strong>Try Again</strong> ඔබන්න.
    </p>


    <button
        class="retry-button"
        onclick="location.reload()"
    >
        🔄 Try Again
    </button>


    <div class="footer">

        එකතුවෙලා ගොඩයමු ❤️

        <br>

        MCQ Winner © 2026

    </div>


</div>


</body>

</html>
