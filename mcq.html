/* ========================================
   SRI LANKA DATE
======================================== */

function getSriLankaParts() {

    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone: "Asia/Colombo",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            }
        ).formatToParts(new Date());


    const result = {};


    parts.forEach(function(part) {

        if (part.type !== "literal") {

            result[part.type] =
                Number(part.value);

        }

    });


    return result;

}


function makeDate(year, month, day) {

    return (
        String(year).padStart(4, "0") +
        "-" +
        String(month).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );

}


function getMCQDay() {

    const p =
        getSriLankaParts();


    const date =
        new Date(
            Date.UTC(
                p.year,
                p.month - 1,
                p.day
            )
        );


    if (p.hour < 5) {

        date.setUTCDate(
            date.getUTCDate() - 1
        );

    }


    return makeDate(
        date.getUTCFullYear(),
        date.getUTCMonth() + 1,
        date.getUTCDate()
    );

}


/* ========================================
   DATE HELPER
======================================== */

function getDateValue(value) {

    if (!value) {
        return null;
    }


    if (
        typeof value.toDate === "function"
    ) {
        return value.toDate();
    }


    if (
        typeof value.toMillis === "function"
    ) {
        return new Date(value.toMillis());
    }


    if (
        typeof value.seconds === "number"
    ) {
        return new Date(
            value.seconds * 1000
        );
    }


    if (value instanceof Date) {
        return value;
    }


    const date =
        new Date(value);


    if (isNaN(date.getTime())) {
        return null;
    }


    return date;

}


/* ========================================
   SUBSCRIPTION
======================================== */

async function checkSubscription() {

    if (isAdmin()) {
        return true;
    }


    if (!currentUser) {
        return false;
    }


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(userRef);


        if (!userSnap.exists()) {
            return false;
        }


        const data =
            userSnap.data();


        const now =
            new Date();


        const subscriptionUntil =
            getDateValue(
                data.subscriptionUntil
            );


        if (
            data.subscriptionActive === true &&
            subscriptionUntil &&
            subscriptionUntil.getTime() >
            now.getTime()
        ) {

            return true;

        }


        const trialUntil =
            getDateValue(
                data.trialUntil
            );


        if (
            data.trialActive === true &&
            trialUntil &&
            trialUntil.getTime() >
            now.getTime()
        ) {

            return true;

        }


        return false;

    }

    catch(error) {

        console.error(
            "Subscription error:",
            error
        );

        return false;

    }

}


/* ========================================
   TEST TIME
======================================== */

function isTestOpen() {

    if (isAdmin()) {
        return true;
    }


    const p =
        getSriLankaParts();


    const totalMinutes =
        p.hour * 60 +
        p.minute;


    return (
        totalMinutes >= 300 &&
        totalMinutes < 1320
    );

}

/* ========================================
   GET QUESTIONS
======================================== */

async function getQuestions() {

    const today =
        getMCQDay();


    const q =
        query(
            collection(db, "mcqs"),
            where(
                "date",
                "==",
                today
            )
        );


    const snapshot =
        await getDocs(q);


    const questions = [];


    snapshot.forEach(
        function(docSnap) {

            const data =
                docSnap.data();


            if (
                !selectedSubject ||
                data.subject === selectedSubject
            ) {

                questions.push({

                    id: docSnap.id,

                    ...data

                });

            }

        }
    );


    return questions;

}

======================================== */

    ) {

        if (!await checkSubscription()) {

        questions.length < 25

    ).classList.add("hidden");


    document.getElementById(
        "timer"
    ).classList.remove("hidden");


    document.getElementById(
        "questionsContainer"
    ).classList.remove("hidden");


    document.getElementById(
        "submitButton"
    ).classList.remove("hidden");


    showQuestions(currentQuestions);

    startTimer();

}


/* ========================================
   WAIT
======================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* ========================================
   TIMER
======================================== */

function startTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    timerInterval =
        setInterval(
            function() {

                if (
                    !isAdmin() &&
                    !isTestOpen()
                ) {

                    clearInterval(
                        timerInterval
                    );

                    showTimeLock();

                    return;

                }


                const elapsed =
                    Math.floor(
                        (
                            Date.now() -
                            quizStartTime
                        ) / 1000
                    );


                document.getElementById(
                    "timer"
                ).textContent =

                    "⏱️ Time: " +
                    formatTime(elapsed);

            },
            1000
        );

}


/* ========================================
   SHOW QUESTIONS
======================================== */

function showQuestions(questions) {

    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML = "";


    questions.forEach(
        function(item, index) {

            const div =
                document.createElement("div");


            div.className =
                "question";


            let html = "";


            const options =
                Array.isArray(item.options)
                ? item.options
                : [];


            options.forEach(
                function(option, i) {

                    html += `

<label class="option">

<input
type="radio"
name="question${index}"
value="${i}"
>

${i + 1}.
${escapeHTML(option)}

</label>

`;

                }
            );


            div.innerHTML = `

<h3>

${index + 1}.
${escapeHTML(item.question)}

</h3>

${html}

`;


            container.appendChild(div);

        }
    );


    updateProgress();

}

document.addEventListener(

        isAdmin()
    ) {

    try {

        const q =

                collection(db, "results"),

                where(
                    "uid",

            showPreviousResult(
                snapshot.docs[0].data()
            );

        }

    }

    catch(error) {

        console.error(
            "Previous result error:",
            error
        );

    }

}


/* ========================================
   SHOW PREVIOUS RESULT
======================================== */

function showPreviousResult(previous) {

    document.getElementById(
        "startBox"
    ).classList.remove("hidden");


    document.getElementById(
        "startBox"
    ).innerHTML = `

<h2>✅ Test Complete</h2>

<p>
ඔබ අද Test එක දැනටමත් කර ඇත.
</p>

<div class="score">

🏆
${Number(previous.score) || 0}
/
${Number(previous.total) || 25}

</div>

<p>
නැවත Submit කරන්න බැහැ.
</p>

`;

}


/* ========================================
   SAVE RESULT
======================================== */

async function saveResult(
    score,
    answered,
    timeTaken
) {

    if (isAdmin()) {
        return;
    }


    if (!currentUser) {

        throw new Error(
            "Login අවශ්‍යයි."
        );

    }


    if (!await checkSubscription()) {

        throw new Error(
            "Subscription හෝ Free Trial active නැහැ."
        );

    }


    if (!isTestOpen()) {

        throw new Error(
            "රෑ 10:00 පසු Submit කරන්න බැහැ."
        );

    }


    const q =
        query(
            collection(db, "results"),

            where(
                "uid",
                "==",
                currentUser.uid
            ),

            where(
                "subject",
                "==",
                selectedSubject || ""
            ),

            where(
                "date",
                "==",
                getMCQDay()
            )
        );


    const existing =
        await getDocs(q);


    if (!existing.empty) {

        throw new Error(
            "ඔබ අද මේ Test එක submit කරලා තියෙනවා."
        );

    }


    await addDoc(
        collection(db, "results"),
        {

            uid:
                currentUser.uid,

            email:
                currentUser.email || "",

            name:
                currentUser.displayName ||
                "Student",

            subject:
                selectedSubject || "",

            date:
                getMCQDay(),

            score:
                score,

            total:
                currentQuestions.length,

            answered:
                answered,

            timeTaken:
                timeTaken,

            createdAt:
                serverTimestamp()

        }
    );

}


/* ========================================
   SUBMIT QUIZ
======================================== */

async function submitQuiz() {

    if (!testStarted) {

        showAdminMessage(
            "▶️ මුලින් Start Test කරන්න."
        );

        return;

    }


    if (!isAdmin()) {

        if (!await checkSubscription()) {

            showSubscriptionRequired();

            return;

        }


        if (!isTestOpen()) {

            showTimeLock();

            return;

        }

    }


    let score = 0;
    let answered = 0;


    currentQuestions.forEach(
        function(item, index) {

            const selected =
                document.querySelector(
                    'input[name="question' +
                    index +
                    '"]:checked'
                );


            const questionOptions =
                document.querySelectorAll(
                    'input[name="question' +
                    index +
                    '"]'
                );


            if (selected) {

                answered++;


                if (
                    Number(selected.value) ===
                    Number(item.answer)
                ) {

                    score++;


                    const selectedLabel =
                        selected.closest(
                            ".option"
                        );


                    if (selectedLabel) {

                        selectedLabel.classList.add(
                            "correct-answer"
                        );

                    }

                }

                else {

                    const selectedLabel =
                        selected.closest(
                            ".option"
                        );


                    if (selectedLabel) {

                        selectedLabel.classList.add(
                            "wrong-answer"
                        );

                    }


                    questionOptions.forEach(
                        function(input) {

                            if (
                                Number(input.value) ===
                                Number(item.answer)
                            ) {

                                const correctLabel =
                                    input.closest(
                                        ".option"
                                    );


                                if (correctLabel) {

                                    correctLabel.classList.add(
                                        "correct-answer"
                                    );

                                }

                            }

                        }
                    );

                }

            }

        }
    );


    if (
        !isAdmin() &&
        answered < currentQuestions.length
    ) {

        showAdminMessage(

            "⚠️ MCQ 25ටම answer කරන්න.\n\n" +

            "දැනට " +
            answered +
            " / " +
            currentQuestions.length +
            " answer කරලා තියෙනවා."

        );

        return;

    }


    if (
        isAdmin() &&
        answered < currentQuestions.length
    ) {

        showAdminMessage(

            "⚠️ Admin Test එකේ MCQ " +
            currentQuestions.length +
            "ටම answer කරන්න."

        );

        return;

    }


    const timeTaken =
        Math.floor(
            (
                Date.now() -
                quizStartTime
            ) / 1000
        );


    const saveStatus =
        document.getElementById(
            "saveStatus"
        );


    try {

        await saveResult(
            score,
            answered,
            timeTaken
        );


        alreadySubmitted = true;

        testStarted = false;


        if (timerInterval) {

            clearInterval(
                timerInterval
            );

        }


        if (isAdmin()) {

            saveStatus.textContent =
                "👑 Admin Result — Firestore save කරන්නේ නැහැ.";

        }

        else {

            saveStatus.textContent =
                "✅ Result සාර්ථකව save වුණා.";

        }

    }

    catch(error) {

        console.error(error);


        saveStatus.textContent =
            "⚠️ Result save වුණේ නැහැ.";


        showAdminMessage(
            "⚠️ " + error.message
        );

        return;

    }


    document.getElementById(
        "score"
    ).textContent =

        score +
        " / " +
        currentQuestions.length;


    document.getElementById(
        "answered"
    ).textContent =

        currentQuestions.length +
        " MCQටම පිළිතුරු ලබා දී ඇත.";


    document.getElementById(
        "timeResult"
    ).textContent =

        "⏱️ Completion Time: " +
        formatTime(timeTaken);


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "submitButton"
    ).disabled = true;


    document.querySelectorAll(
        'input[type="radio"]'
    ).forEach(
        input =>
            input.disabled = true
    );


    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* ========================================
   FORMAT TIME
======================================== */

function formatTime(seconds) {

    const minutes =
        Math.floor(seconds / 60);


    const sec =
        seconds % 60;


    return (

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(sec)
            .padStart(2, "0")

    );

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text || "";


    return div.innerHTML;

}


/* ========================================
   GLOBAL FUNCTIONS
======================================== */

window.startTest =
    startTest;

window.submitQuiz =
    submitQuiz;

window.showAdminMessage =
    showAdminMessage;
