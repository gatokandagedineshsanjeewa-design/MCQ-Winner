<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MCQ Winner</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #222;
}

.header {
    background: #1e3a8a;
    color: white;
    text-align: center;
    padding: 20px;
}

.header h1 {
    margin: 0;
}

.header p {
    margin-bottom: 0;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 20px auto;
}

.progress {
    background: white;
    padding: 15px;
    margin-bottom: 18px;
    border-radius: 14px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.timer {
    background: #dbeafe;
    color: #1e3a8a;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
}

.question {
    background: white;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.question h3 {
    margin-top: 0;
    line-height: 1.5;
}

.option {
    display: block;
    padding: 13px;
    margin: 8px 0;
    background: #f1f5f9;
    border-radius: 9px;
    cursor: pointer;
}

.option:hover {
    background: #e2e8f0;
}

.option input {
    margin-right: 10px;
}

.submit-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#result {
    display: none;
    background: white;
    padding: 25px;
    margin-top: 20px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.score {
    font-size: 30px;
    color: #1e3a8a;
    margin: 10px 0;
}

.empty {
    background: white;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
}

.locked {
    background: #fee2e2;
    color: #991b1b;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
}

</style>

</head>


<body>


<div class="header">

    <h1>
        MCQ Winner
    </h1>

    <p id="subjectTitle">
        MCQ Test
    </p>

</div>



<div class="container">


    <div
        id="progress"
        class="progress"
    >
        Loading...
    </div>


    <div
        id="timer"
        class="timer"
    >
        ⏱️ Time: 00:00
    </div>


    <div
        id="questionsContainer"
    ></div>


    <button
        id="submitButton"
        class="submit-btn"
        onclick="submitQuiz()"
    >
        Submit Answers
    </button>


    <div id="result">

        <h2>
            🏆 Result
        </h2>

        <div
            id="score"
            class="score"
        ></div>

        <p id="answered"></p>

        <p id="timeResult"></p>

        <p id="saveStatus"></p>

    </div>


</div>



<script type="module">


// ========================================
// FIREBASE APP
// ========================================

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";



// ========================================
// FIREBASE AUTH
// ========================================

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



// ========================================
// FIRESTORE
// ========================================

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



// ========================================
// FIREBASE CONFIG
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:
        "mcq-winner",

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:
        "1022060912943",

    appId:
        "1:1022060912943:web:f6e58414867e32f685c1da",

    measurementId:
        "G-MBH3NZ728H"

};



// ========================================
// INITIALIZE
// ========================================

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);



// ========================================
// CURRENT USER
// ========================================

let currentUser = null;

let alreadySubmitted = false;

let quizStartTime = null;

let timerInterval = null;



// ========================================
// GET SUBJECT
// ========================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const selectedSubject =
    urlParams.get("subject");



// ========================================
// SRI LANKA TIME
// ========================================

function getSriLankaTime() {

    return new Date(

        new Date().toLocaleString(
            "en-US",
            {
                timeZone:
                    "Asia/Colombo"
            }
        )

    );

}



// ========================================
// CHECK 10 PM LOCK
// ========================================

function isLocked() {

    const now =
        getSriLankaTime();


    const hour =
        now.getHours();


    return hour >= 22;

}



// ========================================
// GET TODAY
// ========================================

function getToday() {

    const now =
        getSriLankaTime();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



// ========================================
// LOGIN CHECK
// ========================================

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            window.location.href =
                "./login.html";

            return;

        }


        currentUser =
            user;


        console.log(
            "Logged in user:",
            user.email
        );


        if (isLocked()) {

            showTimeLock();

            return;

        }


        await checkPreviousResult();

    }
);



// ========================================
// 10 PM LOCK SCREEN
// ========================================

function showTimeLock() {

    const container =
        document.getElementById(
            "questionsContainer"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    const timer =
        document.getElementById(
            "timer"
        );


    progress.textContent =
        "🔒 අද Test එක අවසන්";


    timer.style.display =
        "none";


    container.innerHTML = `

        <div class="locked">

            🔒 අද MCQ Test එක
            රෑ 10:00ට අවසන් වී ඇත.

            <br><br>

            දැන් Submit කරන්න
            නොහැක.

            <br><br>

            🏆 Rank List එක බලන්න
            පුළුවන්.

        </div>

    `;


    submitButton.style.display =
        "none";

}



// ========================================
// CHECK PREVIOUS RESULT
// ========================================

async function checkPreviousResult() {

    if (!currentUser) {

        return;

    }


    try {

        const q =
            query(

                collection(
                    db,
                    "results"
                ),

                where(
                    "uid",
                    "==",
                    currentUser.uid
                ),

                where(
                    "subject",
                    "==",
                    selectedSubject
                ),

                where(
                    "date",
                    "==",
                    getToday()
                )

            );


        const snapshot =
            await getDocs(q);


        if (
            !snapshot.empty
        ) {

            alreadySubmitted =
                true;


            const previous =
                snapshot.docs[0].data();


            showPreviousResult(
                previous
            );

        }

        else {

            startQuiz();

        }

    }

    catch(error) {

        console.error(
            "Previous result check error:",
            error
        );

    }

}



// ========================================
// START QUIZ
// ========================================

function startQuiz() {

    if (isLocked()) {

        showTimeLock();

        return;

    }


    quizStartTime =
        Date.now();


    startTimer();

    showQuestions();

}



// ========================================
// TIMER
// ========================================

function startTimer() {

    const timer =
        document.getElementById(
            "timer"
        );


    timerInterval =
        setInterval(

            function() {

                if (isLocked()) {

                    clearInterval(
                        timerInterval
                    );


                    showTimeLock();

                    return;

                }


                const elapsed =
                    Date.now() -
                    quizStartTime;


                const totalSeconds =
                    Math.floor(
                        elapsed / 1000
                    );


                const minutes =
                    Math.floor(
                        totalSeconds / 60
                    );


                const seconds =
                    totalSeconds % 60;


                timer.textContent =

                    "⏱️ Time: " +

                    String(minutes)
                        .padStart(2, "0") +

                    ":" +

                    String(seconds)
                        .padStart(2, "0");

            },

            1000

        );

}



// ========================================
// FORMAT TIME
// ========================================

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    return (

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(remainingSeconds)
            .padStart(2, "0")

    );

}



// ========================================
// SHOW PREVIOUS RESULT
// ========================================

function showPreviousResult(
    previous
) {

    const container =
        document.getElementById(
            "questionsContainer"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    const timer =
        document.getElementById(
            "timer"
        );


    progress.textContent =
        "🏆 අද Test එක complete කර ඇත";


    timer.style.display =
        "none";


    container.innerHTML = `

        <div class="locked">

            ✅ ඔබ අද ${selectedSubject}
            Test එක දැනටමත් කර ඇත.

            <br><br>

            අද ඔබේ Score එක:

            <br><br>

            🏆 ${previous.score} / ${previous.total}

            <br><br>

            නැවත Submit කරන්න
            නොහැක.

        </div>

    `;


    submitButton.style.display =
        "none";

}



// ========================================
// GET QUESTIONS
// ========================================

async function getQuestions() {

    const today =
        getToday();


    const q =
        query(

            collection(
                db,
                "mcqs"
            ),

            where(
                "date",
                "==",
                today
            )

        );


    const snapshot =
        await getDocs(q);


    const questions = [];


    snapshot.forEach(
        function(docSnap) {

            const data =
                docSnap.data();


            if (
                !selectedSubject ||
                data.subject ===
                selectedSubject
            ) {

                questions.push({

                    id:
                        docSnap.id,

                    ...data

                });

            }

        }
    );


    return questions;

}



// ========================================
// SHOW QUESTIONS
// ========================================

async function showQuestions() {

    if (
        alreadySubmitted
    ) {

        return;

    }


    if (isLocked()) {

        showTimeLock();

        return;

    }


    const container =
        document.getElementById(
            "questionsContainer"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    container.innerHTML =
        "Loading...";


    document.getElementById(
        "subjectTitle"
    ).textContent =
        selectedSubject
        ? selectedSubject +
          " - Daily MCQ"
        : "Daily MCQ";


    try {

        const questions =
            await getQuestions();


        container.innerHTML =
            "";


        if (
            questions.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        😕 අද MCQ නැහැ
                    </h3>

                    <p>
                        අදට මේ subject එකේ
                        MCQ add කරලා නැහැ.
                    </p>

                </div>

            `;


            progress.textContent =
                "0 / 25 MCQ";


            submitButton.style.display =
                "none";


            return;

        }



        progress.textContent =
            questions.length +
            " / 25 MCQ";



        if (
            questions.length < 25
        ) {

            const locked =
                document.createElement(
                    "div"
                );


            locked.className =
                "locked";


            locked.innerHTML = `

                🔒 Test එක තවම Lock කර ඇත.<br><br>

                අදට ${questions.length} MCQ පමණයි.<br>

                Test එක ලබාගැනීමට MCQ 25ක්
                සම්පූර්ණ කළ යුතුයි.

            `;


            container.appendChild(
                locked
            );

        }



        questions.forEach(
            function(item, index) {

                const questionDiv =
                    document.createElement(
                        "div"
                    );


                questionDiv.className =
                    "question";


                let optionsHTML =
                    "";


                item.options.forEach(
                    function(
                        option,
                        optionIndex
                    ) {

                        optionsHTML += `

                            <label class="option">

                                <input
                                    type="radio"
                                    name="question${index}"
                                    value="${optionIndex}"
                                >

                                ${optionIndex + 1}.
                                ${option}

                            </label>

                        `;

                    }
                );


                questionDiv.innerHTML = `

                    <h3>

                        ${index + 1}.
                        ${item.question}

                    </h3>

                    ${optionsHTML}

                `;


                container.appendChild(
                    questionDiv
                );

            }
        );



        if (
            questions.length < 25
        ) {

            submitButton.disabled =
                true;


            submitButton.textContent =
                "🔒 MCQ 25ක් සම්පූර්ණ වූ පසු Submit කරන්න";

        }

        else {

            submitButton.disabled =
                false;


            submitButton.textContent =
                "✅ Submit Answers";

        }

    }

    catch(error) {

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                <h3>
                    ❌ MCQ Load Error
                </h3>

                <p>
                    ${error.message}
                </p>

            </div>

        `;


        progress.textContent =
            "Error";


        submitButton.style.display =
            "none";

    }

}



// ========================================
// SAVE RESULT
// ========================================

async function saveResult(
    score,
    answered,
    timeTaken
) {

    if (!currentUser) {

        throw new Error(
            "Student login information not found."
        );

    }


    // CHECK AGAIN

    if (isLocked()) {

        throw new Error(
            "🔒 රෑ 10:00 පසු Submit කරන්න බැහැ."
        );

    }


    const q =
        query(

            collection(
                db,
                "results"
            ),

            where(
                "uid",
                "==",
                currentUser.uid
            ),

            where(
                "subject",
                "==",
                selectedSubject
            ),

            where(
                "date",
                "==",
                getToday()
            )

        );


    const existing =
        await getDocs(q);


    if (
        !existing.empty
    ) {

        alreadySubmitted =
            true;


        throw new Error(
            "ඔබ අද මේ subject එකේ Test එක දැනටමත් submit කරලා තියෙනවා."
        );

    }



    await addDoc(

        collection(
            db,
            "results"
        ),

        {

            uid:
                currentUser.uid,

            email:
                currentUser.email || "",

            name:
                currentUser.displayName ||
                "Student",

            subject:
                selectedSubject || "",

            date:
                getToday(),

            score:
                score,

            total:
                25,

            answered:
                answered,

            timeTaken:
                timeTaken,

            createdAt:
                serverTimestamp()

        }

    );

}



// ========================================
// SUBMIT QUIZ
// ========================================

async function submitQuiz() {

    if (
        alreadySubmitted
    ) {

        alert(
            "⚠️ ඔබ අද මේ subject එකේ Test එක දැනටමත් submit කරලා තියෙනවා."
        );

        return;

    }


    if (isLocked()) {

        showTimeLock();

        alert(
            "🔒 රෑ 10:00 පසු Submit කරන්න බැහැ."
        );

        return;

    }


    const questions =
        await getQuestions();


    if (
        questions.length < 25
    ) {

        alert(
            "⚠️ අද MCQ 25ක් සම්පූර්ණ නැහැ."
        );

        return;

    }


    let score =
        0;


    let answered =
        0;



    questions.forEach(
        function(item, index) {

            const selected =
                document.querySelector(
                    'input[name="question' +
                    index +
                    '"]:checked'
                );


            if (selected) {

                answered++;


                const selectedAnswer =
                    Number(
                        selected.value
                    );


                if (
                    selectedAnswer ===
                    item.answer
                ) {

                    score++;

                }

            }

        }
    );



    if (
        answered < 25
    ) {

        alert(
            "⚠️ සියලුම MCQ 25ටම පිළිතුරු දෙන්න.\n\n" +
            "දැනට Answer කරලා තියෙන්නේ " +
            answered +
            " / 25"
        );

        return;

    }



    const saveStatus =
        document.getElementById(
            "saveStatus"
        );


    saveStatus.textContent =
        "⏳ Result save කරමින්...";


    const timeTakenSeconds =

        Math.floor(

            (
                Date.now() -
                quizStartTime
            ) / 1000

        );


    try {

        await saveResult(

            score,

            answered,

            timeTakenSeconds

        );


        alreadySubmitted =
            true;


        if (timerInterval) {

            clearInterval(
                timerInterval
            );

        }


        saveStatus.textContent =
            "✅ Result සාර්ථකව save වුණා.";

    }

    catch(error) {

        console.error(error);


        saveStatus.textContent =
            "⚠️ " +
            error.message;


        alert(
            "⚠️ " +
            error.message
        );


        return;

    }



    // =================================
    // SHOW RESULT
    // =================================

    const result =
        document.getElementById(
            "result"
        );


    document.getElementById(
        "score"
    ).textContent =
        score +
        " / 25";


    document.getElementById(
        "answered"
    ).textContent =
        "ඔබ MCQ 25ටම පිළිතුරු ලබා දී ඇත.";


    document.getElementById(
        "timeResult"
    ).textContent =

        "⏱️ Time: " +

        formatTime(
            timeTakenSeconds
        );


    result.style.display =
        "block";



    // =================================
    // DISABLE SUBMIT
    // =================================

    document.getElementById(
        "submitButton"
    ).disabled =
        true;



    // =================================
    // DISABLE ANSWERS
    // =================================

    const inputs =
        document.querySelectorAll(
            'input[type="radio"]'
        );


    inputs.forEach(
        function(input) {

            input.disabled =
                true;

        }
    );



    result.scrollIntoView({

        behavior:
            "smooth"

    });

}



// ========================================
// MAKE FUNCTION AVAILABLE
// ========================================

window.submitQuiz =
    submitQuiz;



</script>


</body>

</html>
