} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_UID =
    "pz6z6ZU9bChyd6qXmrHNNCB6mFv2";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentQuestions = [];

let selectedAnswers = {};

let testStarted = false;

let alreadySubmitted = false;

let quizStartTime = null;

let timerInterval = null;

let testTimeLimitSeconds = 30 * 60;

let freeAccessData = null;

let resultShown = false;


/* =========================================================
   SUBJECT
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const selectedSubject =
    urlParams.get("subject");


/*
   IMPORTANT:
   Only Chemistry or Physics is allowed.
*/

if (

    selectedSubject !== "Physics"
) {

        "./index.html";

}


/* =========================================================
   BASIC UI
========================================================= */

document.getElementById(
    "subjectTitle"
).textContent =
    selectedSubject +
    " - Daily MCQ";

document.getElementById(
    "startTitle"
).textContent =
    selectedSubject +
    " MCQ";

document.getElementById(
    "subjectInfo"
).textContent =
    selectedSubject +

/* =========================================================
   ADMIN CHECK
========================================================= */

function isAdmin(){

    return (
        currentUser &&
        currentUser.uid === ADMIN_UID
    );

}


/* =========================================================
   SRI LANKA TIME
========================================================= */

function getSriLankaDate(){

    const now =
        new Date();

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:
                "Asia/Colombo",

            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    ).format(now);

}


function getSriLankaTime(){

    const now =
        new Date();

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:
                    "Asia/Colombo",

                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",

                hour12:false
            }
        ).formatToParts(now);

    let hour = 0;
    let minute = 0;
    let second = 0;

    parts.forEach(
        p => {

            if(p.type === "hour"){
                hour = Number(p.value);
            }

            if(p.type === "minute"){
                minute = Number(p.value);
            }

            if(p.type === "second"){
                second = Number(p.value);
            }

        }
    );

    return {
        hour,
        minute,
        second
    };

}


/* =========================================================
   MCQ DAY
========================================================= */

function getMCQDay(){

    const now =
        new Date();

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:
                    "Asia/Colombo",

                year:"numeric",
                month:"2-digit",
                day:"2-digit",

                hour:"2-digit",
                hour12:false
            }
        ).formatToParts(now);

    let year;
    let month;
    let day;
    let hour;

    parts.forEach(
        p => {

            if(p.type === "year"){
                year = Number(p.value);
            }

            if(p.type === "month"){
                month = Number(p.value);
            }

            if(p.type === "day"){
                day = Number(p.value);
            }

            if(p.type === "hour"){
                hour = Number(p.value);
            }

        }
    );

    /*
       MCQ day changes at 5:00 AM.
       Before 5 AM -> previous calendar day.
    */

    let date =
        new Date(
            Date.UTC(
                year,
                month - 1,
                day
            )
        );

    if(hour < 5){

        date.setUTCDate(
            date.getUTCDate() - 1
        );

    }

    return date
        .toISOString()
        .slice(0,10);

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "error"
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " +
        type;

    box.style.display =
        "block";

}


function hideMessage(){

    const box =
        document.getElementById(
            "message"
        );

    box.style.display =
        "none";

}


/* =========================================================
   TEST OPEN TIME
========================================================= */

function isTestOpen(){

    if(isAdmin()){
        return true;
    }

    const time =
        getSriLankaTime();

    const totalMinutes =
        time.hour * 60 +
        time.minute;

    const open =
        5 * 60;

    const close =
        22 * 60;

    return (
        totalMinutes >= open &&
        totalMinutes < close
    );

}


/* =========================================================
   SHOW TIME LOCK
========================================================= */

function showTimeLock(){

    const time =
        getSriLankaTime();

    let text = "";

    if(time.hour < 5){

        text =
            "⏰ Today's MCQ test opens at 5:00 AM.";

    }else{

        text =
            "⏰ Today's MCQ test is closed. " +
            "It is available from 5:00 AM to 10:00 PM.";

    }

    showMessage(
        text,
        "error"
    );

    document.getElementById(
        "startButton"
    ).disabled = true;

}


/* =========================================================
   ADMIN FREE ACCESS
========================================================= */

async function hasAdminFreeAccess(){

    if(!currentUser){
        return false;
    }

    if(isAdmin()){
        return true;
    }

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const snap =
            await getDoc(userRef);

        if(!snap.exists()){
            return false;
        }

        const data =
            snap.data();

        if(
            data.adminFreeAccess !== true
        ){
            return false;
        }

        if(
            !data.adminFreeAccessUntil
        ){
            return false;
        }

        const expiry =
            data.adminFreeAccessUntil
                .toDate
                ? data.adminFreeAccessUntil.toDate()
                : new Date(
                    data.adminFreeAccessUntil
                );

        if(
            expiry.getTime() <=
            Date.now()
        ){

            return false;

        }

        freeAccessData = data;

        return true;

    }catch(error){

        console.error(
            error
        );

        return false;

    }

}


/* =========================================================
   SHOW FREE ACCESS
========================================================= */

async function updateFreeAccessUI(){

    if(isAdmin()){
        return;
    }

    const active =
        await hasAdminFreeAccess();

    if(!active){
        return;
    }

    const info =
        document.getElementById(
            "freeAccessInfo"
        );

    let expiryText =
        "";

    if(
        freeAccessData &&
        freeAccessData.adminFreeAccessUntil
    ){

        const expiry =
            freeAccessData
                .adminFreeAccessUntil
                .toDate
                ? freeAccessData
                    .adminFreeAccessUntil
                    .toDate()
                : new Date(
                    freeAccessData
                        .adminFreeAccessUntil
                );

        expiryText =
            expiry.toLocaleString(
                "en-LK"
            );

    }

    info.textContent =
        "🎁 Admin විසින් Free Access ලබා දී ඇත. " +
        "Expiry: " +
        expiryText;

    info.classList.remove(
        "hidden"
    );

}


/* =========================================================
   SUBSCRIPTION CHECK
========================================================= */

async function checkSubscription(){

    if(!currentUser){
        return false;
    }

    if(isAdmin()){
        return true;
    }

    /*
       Admin Free Access
    */

    if(
        await hasAdminFreeAccess()
    ){

        return true;

    }


    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const snap =
            await getDoc(
                userRef
            );

        if(!snap.exists()){
            return false;
        }

        const data =
            snap.data();


        /*
           Paid subscription
        */

        if(
            data.subscriptionActive === true &&
            data.subscriptionUntil
        ){

            const expiry =
                data.subscriptionUntil
                    .toDate
                    ? data.subscriptionUntil
                        .toDate()
                    : new Date(
                        data.subscriptionUntil
                    );

            if(
                expiry.getTime() >
                Date.now()
            ){

                return true;

            }

        }


        /*
           Trial
        */

        if(
            data.trialActive === true &&
            data.trialUntil
        ){

            const trialUntil =
                data.trialUntil
                    .toDate
                    ? data.trialUntil
                        .toDate()
                    : new Date(
                        data.trialUntil
                    );

            if(
                trialUntil.getTime() >
                Date.now()
            ){

                return true;

            }

        }

        return false;

    }catch(error){

        console.error(
            error
        );

        return false;

    }

}


/* =========================================================
   SUBSCRIPTION REQUIRED
========================================================= */

function showSubscriptionRequired(){

    showMessage(
        "🔒 මෙම MCQ test එකට access ලබාගැනීමට subscription එකක් හෝ Admin Free Access අවශ්‍යයි.",

    );

/* =========================================================
   GET TIME LIMIT
========================================================= */

async function loadTimeLimit(){

    /*
       Admin settings document:
       settings/testTime
       
       Expected field:
       minutes: 30
       
       If unavailable -> 30 minutes.
    */

    try{

        const ref =
            doc(
                db,
                "settings",
                "testTime"
            );

        const snap =
            await getDoc(ref);

        if(snap.exists()){

            const data =
                snap.data();

            if(
                Number(data.minutes) > 0
            ){

                testTimeLimitSeconds =
                    Number(data.minutes) *
                    60;

            }

        }

    }catch(error){

        console.warn(
            "Time limit settings unavailable",
            error
        );

    }

    const minutes =
        Math.floor(
            testTimeLimitSeconds / 60
        );

    document.getElementById(
        "timeLimitText"
    ).textContent =
        minutes +
        " minutes";

}


/* =========================================================
   GET QUESTIONS
========================================================= */

async function getQuestions(){

    const today =
        getMCQDay();

    const q =
        query(
            collection(
                db,
                "mcqs"
            ),
            where(
                "date",
                "==",
                today
            )
        );

    const snapshot =
        await getDocs(q);

    const questions = [];

    snapshot.forEach(
        docSnap => {

            const data =
                docSnap.data();

            /*
               IMPORTANT:
               Only selected subject.
            */

            if(
                data.subject ===
                selectedSubject
            ){

                questions.push({
                    id:docSnap.id,
                    ...data
                });

            }

        }
    );

    return questions;

}


/* =========================================================
   CHECK PREVIOUS RESULT
========================================================= */

async function checkPreviousResult(){

    if(!currentUser){
        return false;
    }

    try{

        const today =
            getMCQDay();

        const q =
            query(
                collection(
                    db,
                    "results"
                ),
                where(
                    "uid",
                    "==",
                    currentUser.uid
                ),
                where(
                    "subject",
                    "==",
                    selectedSubject
                ),
                where(
                    "date",
                    "==",
                    today
                )
            );

        const snap =
            await getDocs(q);

        return !snap.empty;

    }catch(error){

        console.error(
            error
        );

        return false;

    }

}


/* =========================================================
   START TEST
========================================================= */

window.startTest =
async function(){

    if(testStarted){
        return;
    }

    hideMessage();

    /*
       Auth
    */

    if(!currentUser){

        window.location.href =
            "./login.html";

        return;

    }


    /*
       Subscription
    */

    const access =
        await checkSubscription();

    if(!access){

        showSubscriptionRequired();

        return;

    }


    /*
       Time
    */

    if(!isTestOpen()){

        showTimeLock();

        return;

    }


    /*
       Get MCQs
    */

    const questions =
        await getQuestions();


    /*
       STUDENT:
       Exactly 25 required.
    */

    if(
        !isAdmin() &&
        questions.length !== 25
    ){

        showMessage(
            "⚠️ " +
            selectedSubject +
            " සඳහා අද Admin විසින් MCQs 25ක් සම්පූර්ණයෙන් add කර නැත. " +
            "දැනට MCQs " +
            questions.length +
            "ක් පමණයි තිබෙන්නේ.",
            "error"
        );

        return;

    }


    /*
       ADMIN:
       Can test if at least 1 exists.
    */

    if(
        isAdmin() &&
        questions.length === 0
    ){

        showMessage(
            "⚠️ අද " +
            selectedSubject +
            " සඳහා MCQs නැත.",
            "error"
        );

        return;

    }


    /*
       Always use first 25.
    */

    currentQuestions =
        questions.slice(
            0,
            25
        );


    /*
       Student duplicate result check
    */

    if(!isAdmin()){

        const previous =
            await checkPreviousResult();

        if(previous){

            alreadySubmitted =
                true;

            showMessage(
                "✅ ඔබ අද " +
                selectedSubject +
                " MCQ test එක දැනටමත් submit කර ඇත.",
                "success"
            );

            document.getElementById(
                "startButton"
            ).disabled = true;

            return;

        }

    }


    /*
       Countdown
    */

    document.getElementById(
        "startBox"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "countdownBox"
    ).classList.remove(
        "hidden"
    );

    let count = 3;

    document.getElementById(
        "countdownNumber"
    ).textContent = count;


    const countdown =
        setInterval(
            function(){

                count--;

                if(count > 0){

                    document.getElementById(
                        "countdownNumber"
                    ).textContent =
                        count;

                }else{

                    clearInterval(
                        countdown
                    );

                    beginQuiz();

                }

            },
            1000
        );

};


/* =========================================================
   BEGIN QUIZ
========================================================= */

function beginQuiz(){

    testStarted =
        true;

    quizStartTime =
        Date.now();

    document.getElementById(
        "countdownBox"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "quizBox"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "totalCount"
    ).textContent =
        currentQuestions.length;

    showQuestions();

    startTimer();

}


/* =========================================================
   SHOW QUESTIONS
========================================================= */

function showQuestions(){

    const container =
        document.getElementById(
            "questionsContainer"
        );

    container.innerHTML = "";

    currentQuestions.forEach(
        function(q,index){

            const question =
                document.createElement(
                    "div"
                );

            question.className =
                "question";

            let html = "";

            html +=
                '<div class="question-number">' +
                "Question " +
                (index + 1) +
                "</div>";


            /*
               Question text
            */

            if(q.question){

                html +=
                    '<div class="question-text">' +
                    escapeHTML(
                        q.question
                    ) +
                    "</div>";

            }


            /*
               Question image
            */

            if(q.questionImage){

                html +=
                    '<img class="question-image" src="' +
                    escapeAttribute(
                        q.questionImage
                    ) +
                    '" alt="Question image">';

            }


            /*
               Options
            */

            const options =
                Array.isArray(q.options)
                    ? q.options
                    : [];


            options.forEach(
                function(option,optionIndex){

                    let text =
                        "";

                    let image =
                        "";

                    if(
                        typeof option ===
                        "string"
                    ){

                        text =
                            option;

                    }else if(
                        option &&
                        typeof option ===
                        "object"
                    ){

                        text =
                            option.text ||
                            "";

                        image =
                            option.image ||
                            "";

                    }


                    html +=
                        '<label class="option" data-qid="' +
                        escapeAttribute(q.id) +
                        '" data-index="' +
                        optionIndex +
                        '">';

                    html +=
                        '<input type="radio" name="q_' +
                        escapeAttribute(q.id) +
                        '" value="' +
                        optionIndex +
                        '">';

                    html +=
                        "<b>" +
                        String.fromCharCode(
                            65 + optionIndex
                        ) +
                        ".</b> ";

                    if(text){

                        html +=
                            escapeHTML(
                                text
                            );

                    }

                    if(image){

                        html +=
                            '<img class="option-image" src="' +
                            escapeAttribute(
                                image
                            ) +
                            '" alt="Option image">';

                    }

                    html +=
                        "</label>";

                }
            );


            question.innerHTML =
                html;

            container.appendChild(
                question
            );

        }
    );


    /*
       Radio change listener
    */

    document
        .querySelectorAll(
            'input[type="radio"]'
        )
        .forEach(
            function(input){

                input.addEventListener(
                    "change",
                    function(){

                        selectedAnswers[
                            input.name.replace(
                                "q_",
                                ""
                            )
                        ] =
                            Number(
                                input.value
                            );

                        updateProgress();

                    }
                );

            }
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    const answered =
        Object.keys(
            selectedAnswers
        ).length;

    document.getElementById(
        "answeredCount"
    ).textContent =
        answered;

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    const endTime =
        quizStartTime +
        testTimeLimitSeconds *
        1000;

    updateTimer(
        endTime
    );

    timerInterval =
        setInterval(
            function(){

                updateTimer(
                    endTime
                );

            },
            1000
        );

}


function updateTimer(endTime){

    const remaining =
        Math.max(
            0,
            endTime -
            Date.now()
        );

    const seconds =
        Math.floor(
            remaining / 1000
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    document.getElementById(
        "timer"
    ).textContent =
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(secs)
            .padStart(2,"0");


    if(remaining <= 0){

        clearInterval(
            timerInterval
        );

        showMessage(
            "⏰ Time is over. Your answers are being submitted.",
            "error"
        );

        setTimeout(
            function(){

                submitQuiz(
                    true
                );

            },
            500
        );

    }

}


/* =========================================================
   SUBMIT
========================================================= */

window.submitQuiz =
async function(autoSubmit = false){

    if(
        !testStarted ||
        resultShown
    ){

        return;

    }


    /*
       Make sure all 25 answered.
       Auto-submit can submit after timer expires.
    */

    const answered =
        Object.keys(
            selectedAnswers
        ).length;


    if(
        !autoSubmit &&
        answered !==
        currentQuestions.length
    ){

        showMessage(
            "⚠️ සියලුම MCQs වලට answer කරලා පසුව Submit කරන්න. " +
            "Answered: " +
            answered +
            "/" +
            currentQuestions.length,
            "error"
        );

        return;

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );

    submitButton.disabled =
        true;

    clearInterval(
        timerInterval
    );


    try{

        /*
           Check access again.
        */

        const access =
            await checkSubscription();

        if(!access){

            showSubscriptionRequired();

            return;

        }


        /*
           Time check again.
        */

        if(
            !isAdmin() &&
            !isTestOpen()
        ){

            showMessage(
                "⏰ Test time has ended.",
                "error"
            );

            return;

        }


        /*
           Duplicate check.
        */

        if(!isAdmin()){

            const previous =
                await checkPreviousResult();

            if(previous){

                showMessage(
                    "⚠️ මෙම test එක දැනටමත් submit කර ඇත.",
                    "error"
                );

                return;

            }

        }


        /*
           Secure correct answers
           
           Stored separately:
           mcqAnswers/{mcqId}
           
           Example:
           {
              correctAnswer: 2
           }
        */

        let correctCount = 0;


        for(
            let i = 0;
            i < currentQuestions.length;
            i++
        ){

            const q =
                currentQuestions[i];

            const answerRef =
                doc(
                    db,
                    "mcqAnswers",
                    q.id
                );

            const answerSnap =
                await getDoc(
                    answerRef
                );

            let correctAnswer =
                null;

            if(
                answerSnap.exists()
            ){

                const answerData =
                    answerSnap.data();

                if(
                    answerData.correctAnswer !==
                    undefined
                ){

                    correctAnswer =
                        Number(
                            answerData.correctAnswer
                        );

                }else if(
                    answerData.answer !==
                    undefined
                ){

                    correctAnswer =
                        Number(
                            answerData.answer
                        );

                }

            }


            const selected =
                selectedAnswers[
                    q.id
                ];


            /*
               Mark options
            */

            const labels =
                document.querySelectorAll(
                    '.option[data-qid="' +
                    CSS.escape(q.id) +
                    '"]'
                );


            labels.forEach(
                function(label){

                    const index =
                        Number(
                            label.dataset.index
                        );

                    label.classList.remove(
                        "correct",
                        "wrong"
                    );


                    /*
                       Correct option
                    */

                    if(
                        correctAnswer !== null &&
                        index ===
                        correctAnswer
                    ){

                        label.classList.add(
                            "correct"
                        );

                    }


                    /*
                       Wrong selected option
                    */

                    if(
                        selected !== undefined &&
                        index ===
                        selected &&
                        index !==
                        correctAnswer
                    ){

                        label.classList.add(
                            "wrong"
                        );

                    }

                }
            );


            if(
                correctAnswer !== null &&
                selected !== undefined &&
                selected ===
                correctAnswer
            ){

                correctCount++;

            }

        }


        resultShown =
            true;

        alreadySubmitted =
            true;

        testStarted =
            false;


        /*
           Disable options
        */

        document
            .querySelectorAll(
                'input[type="radio"]'
            )
            .forEach(
                input => {
                    input.disabled =
                        true;
                }
            );


        /*
           Save result
        */

        if(currentUser){

            await saveResult(
                correctCount
            );

        }


        /*
           Show result
        */

        const total =
            currentQuestions.length;

        const percentage =
            total > 0
                ? Math.round(
                    (
                        correctCount /
                        total
                    ) * 100
                )
                : 0;


        document.getElementById(
            "quizBox"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "resultBox"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "scoreText"
        ).textContent =
            correctCount +
            " / " +
            total;


        document.getElementById(
            "percentageText"
        ).textContent =
            percentage +
            "%";


        let resultMessage =
            "";

        if(percentage >= 80){

            resultMessage =
                "🔥 Excellent! Keep it up!";

        }else if(percentage >= 60){

            resultMessage =
                "👍 Good work! Keep practicing.";

        }else if(percentage >= 40){

            resultMessage =
                "📚 Keep practicing and improve your score.";

        }else{

            resultMessage =
                "💪 Don't give up. Practice more.";

        }


        document.getElementById(
            "resultMessage"
        ).textContent =
            resultMessage;


    }catch(error){

        console.error(
            error
        );

        showMessage(
            "❌ Submit කිරීමේදී error එකක් ඇති වුණා. නැවත try කරන්න.",
            "error"
        );

        submitButton.disabled =
            false;

    }

};


/* =========================================================
   SAVE RESULT
========================================================= */

async function saveResult(
    score
){

    if(!currentUser){
        return;
    }


    const today =
        getMCQDay();


    /*
       Final duplicate check
    */

    const q =
        query(
            collection(
                db,
                "results"
            ),
            where(
                "uid",
                "==",
                currentUser.uid
            ),
            where(
                "subject",
                "==",
                selectedSubject
            ),
            where(
                "date",
                "==",
                today
            )
        );


    const existing =
        await getDocs(q);


    if(!existing.empty){

        return;

    }


    const resultRef =
        doc(
            collection(
                db,
                "results"
            )
        );


    await setDoc(
        resultRef,
        {
            uid:
                currentUser.uid,

            subject:
                selectedSubject,

            date:
                today,

            score:
                score,

            total:
                currentQuestions.length,

            percentage:
                currentQuestions.length > 0
                    ? Math.round(
                        (
                            score /
                            currentQuestions.length
                        ) * 100
                    )
                    : 0,

            submittedAt:
                serverTimestamp()
        }
    );

}


/* =========================================================
   HOME
========================================================= */

window.goHome =
function(){

    window.location.href =
        "./index.html";

};


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "./login.html";

            return;

        }

        currentUser =
            user;


        /*
           Admin UI
        */

        if(isAdmin()){

            document
                .getElementById(
                    "adminBadge"
                )
                .classList.remove(
                    "hidden"
                );

        }


        /*
           Load settings
        */

        await loadTimeLimit();

        await updateFreeAccessUI();


        /*
           Student test open check
        */

        if(
            !isAdmin() &&
            !isTestOpen()
        ){

            showTimeLock();

            return;

        }


        /*
           Previous result
        */

        if(!isAdmin()){

            const previous =
                await checkPreviousResult();

            if(previous){

                alreadySubmitted =
                    true;

                document.getElementById(
                    "startButton"
                ).disabled =
                    true;

                showMessage(
                    "✅ ඔබ අද " +
                    selectedSubject +
                    " MCQ test එක දැනටමත් submit කර ඇත.",
                    "success"
                );

            }

        }

    }
);

</script>
