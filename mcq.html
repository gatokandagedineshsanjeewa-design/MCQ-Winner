/* ========================================
   SUBSCRIPTION CHECK
   ADMIN BYPASS
======================================== */

async function checkSubscription() {

    /*
       Adminට කිසිම subscription
       check එකක් අවශ්‍ය නැහැ.
    */

    if (isAdmin()) {

        return true;

    }


    if (!currentUser) {

        return false;

    }


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        if (!userSnap.exists()) {

            return false;

        }


        const userData =
            userSnap.data();


        if (
            userData.subscriptionActive !==
            true
        ) {

            return false;

        }


        const expiry =
            userData.subscriptionExpiry;


        if (!expiry) {

            return false;

        }


        let expiryTime;


        if (
            expiry &&
            typeof expiry.toMillis ===
            "function"
        ) {

            expiryTime =
                expiry.toMillis();

        }

        else if (
            typeof expiry ===
            "number"
        ) {

            expiryTime =
                expiry;

        }

        else if (
            expiry instanceof Date
        ) {

            expiryTime =
                expiry.getTime();

        }

        else {

            return false;

        }


        if (
            Date.now() >=
            expiryTime
        ) {

            return false;

        }


        return true;

    }

    catch(error) {

        console.error(
            "Subscription check error:",
            error
        );

        return false;

    }

}


/* ========================================
   SRI LANKA TIME
======================================== */

function getSriLankaTime() {

    return new Date(

        new Date().toLocaleString(
            "en-US",
            {
                timeZone:
                    "Asia/Colombo"
            }
        )

    );

}


/* ========================================
   FORMAT DATE
======================================== */

function formatDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* ========================================
   MCQ DAY
======================================== */

function getMCQDay() {

    const now =
        getSriLankaTime();

    const hour =
        now.getHours();

    let day =
        new Date(now);


    if (hour < 5) {

        day.setDate(
            day.getDate() - 1
        );

    }


    return formatDate(day);

}


/* ========================================
   TEST OPEN
   ADMIN BYPASS
======================================== */

function isTestOpen() {

    /*
       Adminට 5AM - 10PM restriction නැහැ.
    */

    if (isAdmin()) {

        return true;

    }


    const now =
        getSriLankaTime();

    const hour =
        now.getHours();

    const minute =
        now.getMinutes();

    const totalMinutes =
        hour * 60 +
        minute;


    return (
        totalMinutes >= 300 &&
        totalMinutes < 1320
    );

}

/* ========================================
   CHECK PREVIOUS RESULT
   ADMIN BYPASS
======================================== */

async function checkPreviousResult() {

    if (!currentUser) {

        return;

    }


    if (isAdmin()) {

        /*
           Adminට previous result restriction නැහැ.
        */

        return;

    }


    try {

        const today =
            getMCQDay();


        const q =
            query(

                collection(
                    db,
                    "results"
                ),

                where(
                    "uid",
                    "==",
                    currentUser.uid
                ),

                where(
                    "subject",
                    "==",
                    selectedSubject
                ),

                where(
                    "date",
                    "==",
                    today
                )

            );


        const snapshot =
            await getDocs(q);


        if (!snapshot.empty) {

            alreadySubmitted =
                true;


            const previous =
                snapshot.docs[0].data();


            showPreviousResult(
                previous
            );

        }

    }

    catch(error) {

        console.error(
            "Previous result error:",
            error
        );

    }

}

        "progress"
    ).textContent =
        "🏆 අද Test එක complete කර ඇත";

}


/* ========================================
   GET QUESTIONS
======================================== */

async function getQuestions() {

    const today =
        getMCQDay();


    const q =
        query(

            collection(
                db,
                "mcqs"
            ),

            where(
                "date",
                "==",
                today
            )

        );


    const snapshot =
        await getDocs(q);


    const questions = [];


    snapshot.forEach(

        function(docSnap) {

            const data =
                docSnap.data();


            if (

                !selectedSubject ||

                data.subject ===
                selectedSubject

            ) {

                questions.push({

                    id:
                        docSnap.id,

                    ...data

                });

            }

        }

    );


    return questions;

}


/* ========================================
   START TEST
======================================== */

async function startTest() {

    if (alreadySubmitted && !isAdmin()) {

        return;

    }


    /*
       Admin subscription bypass.
    */

    if (!isAdmin()) {

        const subscribed =
            await checkSubscription();


        if (!subscribed) {

            showSubscriptionRequired();

            return;

        }

    }


    /*
       Admin time restriction bypass.
    */

    if (!isTestOpen()) {

        showTimeLock();

        return;

    }


    const questions =
        await getQuestions();


    /*
       ADMIN:
       25ට අඩු වුණත් Test කරන්න පුළුවන්.

       STUDENT:
       25ක් අනිවාර්යයි.
    */

    if (
        !isAdmin() &&
        questions.length < 25
    ) {

        showAdminMessage(

            "⚠️ අද " +
            selectedSubject +
            " MCQ 25ක් තවම සම්පූර්ණ නැහැ."

        );

        return;

    }


    if (questions.length === 0) {

        showAdminMessage(
            "⚠️ අද MCQ කිසිවක් add කරලා නැහැ."
        );

        return;

    }


    /*
       Student = maximum 25
       Admin = available MCQs, maximum 25
    */

    currentQuestions =
        questions.slice(0, 25);


    document.getElementById(
        "startButton"
    ).disabled = true;


    const countdown =
        document.getElementById(
            "countdown"
        );


    countdown.classList.remove(
        "hidden"
    );


    countdown.classList.remove(
        "go"
    );


    countdown.textContent =
        "3";


    await wait(1000);


    if (!isTestOpen()) {

        showTimeLock();

        return;

    }


    countdown.textContent =
        "2";


    await wait(1000);


    if (!isTestOpen()) {

        showTimeLock();

        return;

    }


    countdown.textContent =
        "1";


    await wait(1000);


    if (!isTestOpen()) {

        showTimeLock();

        return;

    }


    countdown.textContent =
        "GO!";


    countdown.classList.add(
        "go"
    );


    quizStartTime =
        Date.now();


    testStarted =
        true;


    await wait(700);


    countdown.classList.add(
        "hidden"
    );


    document.getElementById(
        "startBox"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "timer"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "questionsContainer"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "submitButton"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "progress"
    ).textContent =

        "0 / " +
        currentQuestions.length +
        " Answered";


    showQuestions(
        currentQuestions
    );


    startTimer();

}


/* ========================================
   WAIT
======================================== */

function wait(milliseconds) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }

    );

}


/* ========================================
   TIMER
======================================== */

function startTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    timerInterval =
        setInterval(

            function() {

                /*
                   Adminට time lock නැහැ.
                */

                if (!isAdmin() && !isTestOpen()) {

                    clearInterval(
                        timerInterval
                    );

                    showTimeLock();

                    return;

                }


                const elapsed =
                    Math.floor(

                        (
                            Date.now() -
                            quizStartTime
                        ) / 1000

                    );


                document.getElementById(
                    "timer"
                ).textContent =

                    "⏱️ Time: " +
                    formatTime(
                        elapsed
                    );

            },

            1000

        );

}


/* ========================================
   SHOW QUESTIONS
======================================== */

function showQuestions(questions) {

    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML =
        "";


    questions.forEach(

        function(item, index) {

            const questionDiv =
                document.createElement(
                    "div"
                );


            questionDiv.className =
                "question";


            let optionsHTML =
                "";


            const options =
                Array.isArray(
                    item.options
                )
                ? item.options
                : [];


            options.forEach(

                function(
                    option,
                    optionIndex
                ) {

                    optionsHTML += `

                        <label class="option">

                            <input
                                type="radio"
                                name="question${index}"
                                value="${optionIndex}"
                            >

                            ${optionIndex + 1}.
                            ${escapeHTML(option)}

                        </label>

                    `;

                }

            );


            questionDiv.innerHTML = `

                <h3>

                    ${index + 1}.
                    ${escapeHTML(
                        item.question
                    )}

                </h3>

                ${optionsHTML}

            `;


            container.appendChild(
                questionDiv
            );

        }

    );


    updateProgress();

}


/* ========================================
   PROGRESS
======================================== */

function updateProgress() {

    const answered =
        document.querySelectorAll(
            'input[type="radio"]:checked'
        ).length;


    const total =
        currentQuestions.length || 25;


    document.getElementById(
        "progress"
    ).textContent =

        answered +
        " / " +
        total +
        " Answered";

}


/* ========================================
   ANSWER CHANGE
======================================== */

document.addEventListener(

    "change",

    function(event) {

        if (
            event.target.matches(
                'input[type="radio"]'
            )
        ) {

            updateProgress();

        }

    }

);


/* ========================================
   TIME LOCK
======================================== */

function showTimeLock() {

    /*
       Adminට කිසිම Time Lock එකක් නැහැ.
    */

    if (isAdmin()) {

        return;

    }


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    testStarted =
        false;


    document.getElementById(
        "startBox"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "timer"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "questionsContainer"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "questionsContainer"
    ).innerHTML = `

        <div class="locked">

            ${getLockMessage()}

        </div>

    `;


    document.getElementById(
        "submitButton"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "progress"
    ).textContent =
        "🔒 Test Closed";


    document.getElementById(
        "countdown"
    ).classList.add(
        "hidden"
    );

}


/* ========================================
   SAVE RESULT
======================================== */

async function saveResult(
    score,
    answered,
    timeTaken
) {

    /*
       ADMIN RESULT SAVE කරන්නේ නැහැ.
    */

    if (isAdmin()) {

        console.log(
            "ADMIN: Result not saved to Firestore."
        );

        return;

    }


    const subscribed =
        await checkSubscription();


    if (!subscribed) {

        throw new Error(
            "ඔබගේ subscription එක active නැහැ."
        );

    }


    if (!isTestOpen()) {

        throw new Error(
            "🔒 රෑ 10:00 පසු Submit කරන්න බැහැ."
        );

    }


    const mcqDay =
        getMCQDay();


    const q =
        query(

            collection(
                db,
                "results"
            ),

            where(
                "uid",
                "==",
                currentUser.uid
            ),

            where(
                "subject",
                "==",
                selectedSubject
            ),

            where(
                "date",
                "==",
                mcqDay
            )

        );


    const existing =
        await getDocs(q);


    if (!existing.empty) {

        throw new Error(
            "ඔබ අද මේ Test එක submit කරලා තියෙනවා."
        );

    }


    await addDoc(

        collection(
            db,
            "results"
        ),

        {

            uid:
                currentUser.uid,

            email:
                currentUser.email ||
                "",

            name:
                currentUser.displayName ||
                "Student",

            subject:
                selectedSubject ||
                "",

            date:
                mcqDay,

            score:
                score,

            total:
                25,

            answered:
                answered,

            timeTaken:
                timeTaken,

            createdAt:
                serverTimestamp()

        }

    );

}


/* ========================================
   SUBMIT QUIZ
======================================== */

async function submitQuiz() {

    if (!testStarted) {

        showAdminMessage(
            "▶️ මුලින් Start Test button එක click කරන්න."
        );

        return;

    }


    /*
       Student subscription check only.
    */

    if (!isAdmin()) {

        const subscribed =
            await checkSubscription();


        if (!subscribed) {

            showSubscriptionRequired();

            return;

        }

    }


    /*
       Student time restriction only.
    */

    if (!isTestOpen()) {

        showTimeLock();

        return;

    }


    const questions =
        currentQuestions;


    if (questions.length === 0) {

        showAdminMessage(
            "⚠️ MCQ කිසිවක් නැහැ."
        );

        return;

    }


    let score =
        0;


    let answered =
        0;


    questions.forEach(

        function(item, index) {

            const selected =
                document.querySelector(

                    'input[name="question' +
                    index +
                    '"]:checked'

                );


            if (selected) {

                answered++;


                const selectedAnswer =
                    Number(
                        selected.value
                    );


                if (
                    selectedAnswer ===
                    Number(item.answer)
                ) {

                    score++;

                }

            }

        }

    );


    /*
       Student = සියල්ල answer කරන්න ඕනේ.
       Admin = තියෙන MCQ ටික answer කළාම submit.
    */

    if (
        !isAdmin() &&
        answered < 25
    ) {

        showAdminMessage(

            "⚠️ MCQ 25ටම answer කරන්න.\n\n" +

            "දැනට " +
            answered +
            " / 25 answer කරලා තියෙන්නේ."

        );

        return;

    }


    if (
        isAdmin() &&
        answered < questions.length
    ) {

        showAdminMessage(

            "⚠️ Admin Test එකේ MCQ " +
            questions.length +
            "ටම answer කරන්න.\n\n" +

            "දැනට " +
            answered +
            " / " +
            questions.length +
            " answer කරලා තියෙන්නේ."

        );

        return;

    }


    const timeTaken =
        Math.floor(

            (
                Date.now() -
                quizStartTime
            ) / 1000

        );


    const saveStatus =
        document.getElementById(
            "saveStatus"
        );


    if (isAdmin()) {

        saveStatus.textContent =
            "👑 Admin Result — Firestore save නොකරයි.";

    }

    else {

        saveStatus.textContent =
            "⏳ Result save කරමින්...";

    }


    try {

        await saveResult(
            score,
            answered,
            timeTaken
        );


        alreadySubmitted =
            true;


        testStarted =
            false;


        if (timerInterval) {

            clearInterval(
                timerInterval
            );

        }


        if (isAdmin()) {

            saveStatus.textContent =
                "👑 Admin Test එක සාර්ථකව අවසන් කළා. Result save කරන්නේ නැහැ.";

        }

        else {

            saveStatus.textContent =
                "✅ Result සාර්ථකව save වුණා.";

        }

    }

    catch(error) {

        console.error(error);


        saveStatus.textContent =
            "⚠️ Result save වුණේ නැහැ.";


        showAdminMessage(
            "⚠️ " + error.message
        );


        return;

    }


    document.getElementById(
        "score"
    ).textContent =

        score +
        " / " +
        questions.length;


    document.getElementById(
        "answered"
    ).textContent =

        questions.length +
        " MCQටම පිළිතුරු ලබා දී ඇත.";


    document.getElementById(
        "timeResult"
    ).textContent =

        "⏱️ Completion Time: " +
        formatTime(timeTaken);


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "submitButton"
    ).disabled =
        true;


    const inputs =
        document.querySelectorAll(
            'input[type="radio"]'
        );


    inputs.forEach(
        function(input) {

            input.disabled =
                true;

        }
    );


    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* ========================================
   FORMAT TIME
======================================== */

function formatTime(totalSeconds) {

    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(seconds)
            .padStart(2, "0")

    );

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


/* ========================================
   GLOBAL FUNCTIONS
======================================== */

window.startTest =
    startTest;

window.submitQuiz =
    submitQuiz;

</script>
