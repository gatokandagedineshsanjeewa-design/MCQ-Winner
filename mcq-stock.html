/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text == null
        ? ""
        : String(text);

    return div.innerHTML;
}


/* ========================================
   ESCAPE ATTRIBUTE
======================================== */

function escapeAttribute(text){

    return String(
        text || ""
    )
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ========================================
   FORMAT DATE
======================================== */

function formatDate(dateString){

    if(!dateString){
        return "";
    }

    const parts =
        dateString.split("-");

    if(parts.length !== 3){
        return dateString;
    }

    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    const day =
        Number(parts[2]);


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    return date.toLocaleDateString(
        "en-GB",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}


/* ========================================
   DATE LABEL
======================================== */

function getDateLabel(dateString){

    const today =
        new Date();

    const todayString =
        today.getFullYear() +
        "-" +
        String(
            today.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            today.getDate()
        ).padStart(2,"0");


    if(
        dateString ===
        todayString
    ){

        return "TODAY";

    }


    const tomorrow =
        new Date();

    tomorrow.setDate(
        tomorrow.getDate()+1
    );


    const tomorrowString =
        tomorrow.getFullYear() +
        "-" +
        String(
            tomorrow.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            tomorrow.getDate()
        ).padStart(2,"0");


    if(
        dateString ===
        tomorrowString
    ){

        return "TOMORROW";

    }


    return "";

}


/* ========================================
   LOAD STOCK DATES
======================================== */

async function loadStockDates(){

    try{

        status.textContent =
            "⏳ MCQ Stock load වෙමින්...";


        dateGrid.innerHTML =
            "";


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "mcqStock"
                )
            );


        /*
           Important:

           Chemistry and Physics have
           separate stock documents.

           So we create ONE date card
           for each unique date.
        */

        const dateMap =
            new Map();


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                if(
                    data.date
                ){

                    dateMap.set(
                        String(
                            data.date
                        ),
                        true
                    );

                }

            }
        );


        const dates =
            Array.from(
                dateMap.keys()
            );


        dates.sort(
            function(a,b){

                return String(b)
                    .localeCompare(
                        String(a)
                    );

            }
        );


        if(
            dates.length === 0
        ){

            dateGrid.innerHTML = `

                <div class="empty">

                    📭 MCQ Stock එකේ
                    තවම dates නැහැ.

                </div>

            `;


            status.textContent =
                "📚 Stock Empty";

            return;

        }


        for(
            const date of dates
        ){

            createDateCard(
                date
            );

        }


        status.textContent =
            "✅ " +
            dates.length +
            " MCQ dates available";


    }
    catch(error){

        console.error(error);


        status.innerHTML = `

            <div class="error">

                ❌ Stock load error.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}

/* ========================================
   LOAD BOTH SUBJECT COUNTS
======================================== */

async function loadDateCounts(
    date
){

    try{

        const chemistryRef =
            doc(
                db,
                "mcqStock",
                "chemistry_" + date
            );


        const physicsRef =
            doc(
                db,
                "mcqStock",
                "physics_" + date
            );


        const chemistrySnap =
            await getDoc(
                chemistryRef
            );


        const physicsSnap =
            await getDoc(
                physicsRef
            );


        let chemistryCount = 0;
        let physicsCount = 0;


        let chemistryReady =
            false;

        let physicsReady =
            false;


        if(
            chemistrySnap.exists()
        ){

            const data =
                chemistrySnap.data();


            chemistryCount =
                Number(
                    data.questionCount || 0
                );


            chemistryReady =
                data.ready === true;

        }


        if(
            physicsSnap.exists()
        ){

            const data =
                physicsSnap.data();


            physicsCount =
                Number(
                    data.questionCount || 0
                );


            physicsReady =
                data.ready === true;

        }


        const chemistryElement =
            document.getElementById(
                "chem-" + date
            );


        const physicsElement =
            document.getElementById(
                "phy-" + date
            );


        const readyElement =
            document.getElementById(
                "ready-" + date
            );


        if(
            chemistryElement
        ){

            chemistryElement.textContent =
                chemistryCount +
                " / 25";


            chemistryElement.className =
                "subject-count " +
                (
                    chemistryReady
                    ? "ready"
                    : "not-ready"
                );

        }


        if(
            physicsElement
        ){

            physicsElement.textContent =
                physicsCount +
                " / 25";


            physicsElement.className =
                "subject-count " +
                (
                    physicsReady
                    ? "ready"
                    : "not-ready"
                );

        }


        if(
            readyElement
        ){

            if(
                chemistryReady &&
                physicsReady
            ){

                readyElement.className =
                    "ready-badge";

                readyElement.textContent =
                    "✅ STOCK READY";

            }
            else{

                readyElement.className =
                    "wait-badge";

                readyElement.textContent =
                    "⏳ " +
                    chemistryCount +
                    "/25 + " +
                    physicsCount +
                    "/25";

            }

        }

    }
    catch(error){

        console.error(
            "Count error:",
            error
        );

    }

}

/* ========================================
   OPEN SUBJECT
======================================== */

async function openSubject(
    subject
){

    if(
        !selectedDate
    ){

        return;

    }


    detailDate.innerHTML =

        (
            subject ===
            "Chemistry"
            ? "🧪 "
            : "⚡ "
        ) +

        escapeHTML(
            subject
        );


    detailSummary.innerHTML =

        escapeHTML(
            formatDate(
                selectedDate
            )
        );


    detailContent.innerHTML = `

        <div class="loading">

            ⏳ ${escapeHTML(subject)}
            MCQs load වෙමින්...

        </div>

    `;


    try{

        const q =
            query(
                collection(
                    db,
                    "mcqs"
                ),
                where(
                    "date",
                    "==",
                    selectedDate
                ),
                where(
                    "subject",
                    "==",
                    subject
                )
            );


        const snapshot =
            await getDocs(q);


        const questions = [];


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                questions.push({

                    id:
                        docSnap.id,

                    ...data

                });

            }
        );


        questions.sort(
            function(a,b){

                return String(a.id)
                    .localeCompare(
                        String(b.id)
                    );

            }
        );


        detailSummary.innerHTML = `

            📅 ${escapeHTML(
                selectedDate
            )}

            &nbsp;&nbsp;

            <b>
                ${escapeHTML(subject)}
            </b>

            :

            <b>
                ${questions.length}/25
            </b>

        `;


        detailContent.innerHTML = "";


        if(
            questions.length === 0
        ){

            detailContent.innerHTML = `

                <div class="empty">

                    📭 මේ date එකට
                    ${escapeHTML(subject)}
                    MCQ නැහැ.

                </div>

            `;

            return;

        }


        addSubjectTitle(

            (
                subject ===
                "Chemistry"
                ? "🧪 "
                : "⚡ "
            ) +

            subject +

            " MCQs (" +

            questions.length +

            "/25)"

        );


        for(
            let i=0;
            i<questions.length;
            i++
        ){

            await addQuestionCard(
                questions[i],
                i+1
            );

        }

    }
    catch(error){

        console.error(error);


        detailContent.innerHTML = `

            <div class="error">

                ❌ ${escapeHTML(subject)}
                MCQ load error.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}

}


/* ========================================
   QUESTION CARD
======================================== */

async function addQuestionCard(
    item,
    number
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "question-card";


    let optionsHTML =
        "";


    const options =
        Array.isArray(
            item.options
        )
        ? item.options
        : [];


    const optionImages =
        Array.isArray(
            item.optionImages
        )
        ? item.optionImages
        : [];


    for(
        let i=0;
        i<options.length;
        i++
    ){

        let optionText =
            "";


        if(
            typeof options[i] ===
            "object"
        ){

            optionText =
                options[i].text ||
                "";

        }
        else{

            optionText =
                options[i] ||
                "";

        }


        optionsHTML += `

            <div class="option">

                <b>${i+1}.</b>

                ${escapeHTML(
                    optionText
                )}

                ${
                    optionImages[i]
                    ? `
                        <br>
                        <img
                            class="question-image"
                            src="${escapeAttribute(
                                optionImages[i]
                            )}"
                            alt="Option image"
                        >
                      `
                    : ""
                }

            </div>

        `;

    }


    let correctAnswer =
        null;


    try{

        const answerRef =
            doc(
                db,
                "mcqAnswers",
                item.id
            );


        const answerSnap =
            await getDoc(
                answerRef
            );


        if(
            answerSnap.exists()
        ){

            const answerData =
                answerSnap.data();


            if(
                answerData.correctAnswer !==
                undefined
            ){

                correctAnswer =
                    Number(
                        answerData.correctAnswer
                    );

            }
            else if(
                answerData.answer !==
                undefined
            ){

                correctAnswer =
                    Number(
                        answerData.answer
                    );

            }

        }

    }
    catch(error){

        console.error(
            "Answer load error:",
            error
        );

    }


    let correctHTML =
        "";


    if(
        correctAnswer !== null &&
        !Number.isNaN(
            correctAnswer
        )
    ){

        correctHTML = `

            <div class="correct">

                ✅ Correct Answer:
                ${correctAnswer + 1}

            </div>

        `;

    }
    else{

        correctHTML = `

            <div class="correct">

                ⚠️ Answer data නැහැ.

            </div>

        `;

    }


    const questionImage =
        item.questionImage ||
        "";


    card.innerHTML = `

        <div class="question-number">

            Question ${number}

        </div>


        <div class="question-text">

            ${escapeHTML(
                item.question || ""
            )}

        </div>


        ${
            questionImage
            ? `
                <img
                    class="question-image"
                    src="${escapeAttribute(
                        questionImage
                    )}"
                    alt="Question image"
                >
              `
            : ""
        }


        ${optionsHTML}


        ${correctHTML}

    `;


    detailContent.appendChild(
        card
    );

}

/* ========================================
   AUTH
======================================== */

async function initializeAuth(){

    try{

        await setPersistence(
            auth,
            browserSessionPersistence
        );

    }
    catch(error){

        console.error(
            "Persistence error:",
            error
        );

    }


    onAuthStateChanged(
        auth,
        async function(user){

            if(!user){

                window.location.href =
                    "login.html";

                return;

            }


            currentUser =
                user;


            if(
                user.uid !==
                ADMIN_UID
            ){

                alert(
                    "🚫 Admin access required."
                );


                await signOut(
                    auth
                );


                return;

            }


            await loadStockDates();

        }
    );

}
