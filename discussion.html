<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Discussion - MCQ Winner</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef4ff;
    color: #172554;
}


/* ================================
   HEADER
================================ */

.header {

    position: sticky;

    top: 0;

    z-index: 100;

    background:
        linear-gradient(
            135deg,
            #1e3a8a,
            #2563eb
        );

    color: white;

    padding: 16px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.18);
}


.header-row {

    display: flex;

    align-items: center;

    gap: 12px;
}


.back-btn {

    border: none;

    background:
        rgba(255,255,255,0.15);

    color: white;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    font-size: 22px;

    cursor: pointer;
}


.header-info {
    flex: 1;
}


.header-info h1 {

    margin: 0;

    font-size: 21px;
}


.header-info p {

    margin: 3px 0 0;

    font-size: 13px;

    opacity: 0.85;
}


/* ================================
   PINNED
================================ */

.pinned-area {

    display: none;

    background: #fff7ed;

    border-bottom:
        1px solid #fed7aa;

    padding: 10px 14px;
}


.pinned-title {

    font-size: 13px;

    font-weight: bold;

    color: #c2410c;

    margin-bottom: 5px;
}


.pinned-message {

    font-size: 14px;

    color: #431407;
}


/* ================================
   CHAT
================================ */

.chat {

    width: 100%;

    max-width: 750px;

    margin: auto;

    padding:
        15px
        12px
        100px;
}


.message {

    position: relative;

    margin-bottom: 14px;

    display: flex;

    flex-direction: column;

    max-width: 88%;
}


.message.mine {

    margin-left: auto;

    align-items: flex-end;
}


.message.other {

    margin-right: auto;

    align-items: flex-start;
}


.message-name {

    font-size: 12px;

    font-weight: bold;

    color: #475569;

    margin:
        0 8px
        4px;
}


.admin-badge {

    display: inline-block;

    background: #f59e0b;

    color: white;

    padding:
        2px 6px;

    border-radius: 6px;

    font-size: 10px;

    margin-left: 4px;
}


.bubble {

    background: white;

    padding:
        11px
        14px;

    border-radius: 16px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    word-wrap: break-word;

    white-space: pre-wrap;

    font-size: 15px;

    line-height: 1.45;
}


.mine .bubble {

    background: #2563eb;

    color: white;

    border-bottom-right-radius: 5px;
}


.other .bubble {

    border-bottom-left-radius: 5px;
}


.message-time {

    font-size: 10px;

    color: #94a3b8;

    margin:
        4px 7px
        0;
}


/* ================================
   REACTIONS
================================ */

.reactions {

    display: flex;

    gap: 4px;

    margin-top: 4px;

    flex-wrap: wrap;
}


.reaction-item {

    background: white;

    border:
        1px solid #e2e8f0;

    border-radius: 12px;

    padding:
        3px 7px;

    font-size: 13px;
}


/* ================================
   REACTION MENU
================================ */

.reaction-menu {

    position: fixed;

    display: none;

    background: white;

    padding: 8px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.25);

    z-index: 200;

    gap: 5px;
}


.reaction-menu button {

    border: none;

    background: #f1f5f9;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    font-size: 20px;

    cursor: pointer;
}


.reaction-menu button:active {

    transform: scale(0.9);
}


/* ================================
   ADMIN MENU
================================ */

.admin-menu {

    position: fixed;

    display: none;

    background: white;

    border-radius: 14px;

    padding: 8px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.3);

    z-index: 500;

    min-width: 190px;
}


.admin-menu button {

    display: block;

    width: 100%;

    border: none;

    background: white;

    padding: 12px;

    text-align: left;

    border-radius: 8px;

    font-size: 14px;

    cursor: pointer;
}


.admin-menu button:hover {

    background: #f1f5f9;
}


/* ================================
   INPUT
================================ */

.input-area {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    background: white;

    border-top:
        1px solid #e2e8f0;

    padding: 10px;

    z-index: 100;
}


.input-inner {

    max-width: 750px;

    margin: auto;

    display: flex;

    gap: 8px;

    align-items: flex-end;
}


#messageInput {

    flex: 1;

    resize: none;

    min-height: 44px;

    max-height: 120px;

    border:
        1px solid #cbd5e1;

    border-radius: 22px;

    padding:
        12px 15px;

    font-family: Arial;

    font-size: 15px;

    outline: none;
}


.send-btn {

    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


.send-btn:disabled {
    opacity: 0.5;
}


.blocked-box {

    max-width: 750px;

    margin: auto;

    background: #fee2e2;

    color: #991b1b;

    border-radius: 12px;

    padding: 12px;

    text-align: center;

    font-weight: bold;

    display: none;
}


/* ================================
   EMPTY
================================ */

.empty {

    text-align: center;

    padding: 70px 20px;

    color: #64748b;
}


/* ================================
   LOADING
================================ */

.loading {

    text-align: center;

    padding: 50px;

    color: #64748b;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="header-row">

        <button
            class="back-btn"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>


        <div class="header-info">

            <h1>
                💬 Discussion
            </h1>

            <p>
                MCQ Winner Community
            </p>

        </div>

    </div>

</div>



<!-- PINNED MESSAGE -->

<div
    id="pinnedArea"
    class="pinned-area"
>

    <div class="pinned-title">
        📌 Pinned Message
    </div>

    <div
        id="pinnedMessage"
        class="pinned-message"
    ></div>

</div>



<!-- CHAT -->

<div
    id="chat"
    class="chat"
>

    <div class="loading">
        ⏳ Messages loading...
    </div>

</div>



<!-- INPUT -->

<div class="input-area">

    <div
        id="blockedBox"
        class="blocked-box"
    >
        🚫 ඔබට දැනට message යවන්න අවසර නැහැ.
    </div>


    <div
        id="inputInner"
        class="input-inner"
    >

        <textarea
            id="messageInput"
            placeholder="Message එකක් ලියන්න..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            class="send-btn"
        >
            ➤
        </button>

    </div>

</div>



<!-- REACTION MENU -->

<div
    id="reactionMenu"
    class="reaction-menu"
>

    <button data-reaction="👍">
        👍
    </button>

    <button data-reaction="❤️">
        ❤️
    </button>

    <button data-reaction="😂">
        😂
    </button>

    <button data-reaction="😮">
        😮
    </button>

    <button data-reaction="😢">
        😢
    </button>

</div>



<!-- ADMIN MENU -->

<div
    id="adminMenu"
    class="admin-menu"
>

    <button id="pinButton">
        📌 Pin Message
    </button>

    <button id="blockButton">
        🚫 Block Student
    </button>

    <button id="unblockButton">
        ✅ Unblock Student
    </button>

</div>



<script type="module">


/* ========================================
   FIREBASE
======================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp,
    doc,
    setDoc,
    deleteDoc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ========================================
   FIREBASE CONFIG
======================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:
        "mcq-winner",

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:
        "1022060912943",

    appId:
        "1:1022060912943:web:f6e58414867e32f685c1da",

    measurementId:
        "G-MBH3NZ728H"

};


/* ========================================
   INITIALIZE
======================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* ========================================
   ADMIN UID
======================================== */

const ADMIN_UID =
    "Npiu0xJQQchrVgHnXRuR8Rr5FOA2";


/* ========================================
   VARIABLES
======================================== */

let currentUser = null;

let selectedMessage = null;

let selectedStudent = null;


/* ========================================
   AUTH
======================================== */

onAuthStateChanged(

    auth,

    async function(user) {

        if (!user) {

            window.location.href =
                "./login.html";

            return;

        }


        currentUser =
            user;


        await checkBlocked();

        loadMessages();

    }

);


/* ========================================
   CHECK BLOCKED
======================================== */

async function checkBlocked() {

    if (!currentUser) {
        return;
    }


    const blockRef =
        doc(
            db,
            "blockedUsers",
            currentUser.uid
        );


    const blockSnap =
        await getDoc(blockRef);


    const blocked =
        blockSnap.exists();


    const input =
        document.getElementById(
            "inputInner"
        );


    const blockedBox =
        document.getElementById(
            "blockedBox"
        );


    if (blocked) {

        input.style.display =
            "none";

        blockedBox.style.display =
            "block";

    }

    else {

        input.style.display =
            "flex";

        blockedBox.style.display =
            "none";

    }

}


/* ========================================
   LOAD MESSAGES
======================================== */

function loadMessages() {

    const q =
        query(

            collection(
                db,
                "messages"
            ),

            orderBy(
                "createdAt",
                "asc"
            )

        );


    onSnapshot(

        q,

        function(snapshot) {

            const chat =
                document.getElementById(
                    "chat"
                );


            chat.innerHTML = "";


            let pinnedFound = false;


            if (snapshot.empty) {

                chat.innerHTML = `

                    <div class="empty">

                        💬

                        <br><br>

                        තවම Discussion
                        messages නැහැ.

                        <br><br>

                        පළමු message එක
                        ඔයා දාන්න!

                    </div>

                `;

                hidePinned();

                return;

            }


            snapshot.forEach(

                function(docSnap) {

                    const data =
                        docSnap.data();


                    renderMessage(
                        docSnap.id,
                        data
                    );


                    if (
                        data.pinned &&
                        !pinnedFound
                    ) {

                        pinnedFound = true;

                        updatePinnedMessage(
                            docSnap.id,
                            data
                        );

                    }

                }

            );


            if (!pinnedFound) {

                hidePinned();

            }


            scrollToBottom();

        },

        function(error) {

            console.error(error);


            document.getElementById(
                "chat"
            ).innerHTML = `

                <div class="empty">

                    ⚠️ Messages load
                    කරන්න බැරි වුණා.

                    <br><br>

                    Firestore Rules
                    check කරන්න.

                </div>

            `;

        }

    );

}


/* ========================================
   RENDER MESSAGE
======================================== */

function renderMessage(
    messageId,
    data
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement(
            "div"
        );


    const mine =
        data.uid ===
        currentUser.uid;


    const isAdmin =
        data.uid ===
        ADMIN_UID;


    message.className =
        "message " +
        (mine ? "mine" : "other");


    /* ADMIN NAME FIX */

    const displayName =
        isAdmin
        ? "ADMIN"
        : (data.name || "Student");


    const name =
        escapeHTML(
            displayName
        );


    let timeText =
        "";


    if (data.createdAt) {

        const date =
            data.createdAt.toDate();


        timeText =
            date.toLocaleTimeString(
                "en-LK",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    message.innerHTML = `

        <div class="message-name">

            ${name}

        </div>


        <div class="bubble">

            ${escapeHTML(
                data.text || ""
            )}

        </div>


        <div class="message-time">

            ${timeText}

            ${
                data.pinned
                ? " • 📌 Pinned"
                : ""
            }

        </div>


        <div
            class="reactions"
            id="reactions-${messageId}"
        ></div>

    `;


    chat.appendChild(
        message
    );


    loadReactions(
        messageId
    );


    /* ====================================
       LONG PRESS
    ==================================== */

    let timer = null;


    message.addEventListener(

        "pointerdown",

        function() {

            timer =
                setTimeout(

                    function() {

                        selectedMessage =
                            messageId;

                        selectedStudent =
                            data.uid;


                        /* Reaction menu */

                        showReactionMenu(
                            message
                        );


                        /* Admin menu */

                        if (
                            currentUser.uid ===
                            ADMIN_UID
                        ) {

                            showAdminMenu(
                                message,
                                data
                            );

                        }

                    },

                    550

                );

        }

    );


    message.addEventListener(

        "pointerup",

        function() {

            clearTimeout(
                timer
            );

        }

    );


    message.addEventListener(

        "pointerleave",

        function() {

            clearTimeout(
                timer
            );

        }

    );

}


/* ========================================
   LOAD REACTIONS
======================================== */

async function loadReactions(
    messageId
) {

    const reactionsRef =
        collection(

            db,
            "messages",
            messageId,
            "reactions"

        );


    onSnapshot(

        reactionsRef,

        function(snapshot) {

            const counts = {};


            snapshot.forEach(

                function(docSnap) {

                    const data =
                        docSnap.data();


                    const reaction =
                        data.reaction;


                    if (!counts[reaction]) {

                        counts[reaction] =
                            0;

                    }


                    counts[reaction]++;

                }

            );


            const box =
                document.getElementById(
                    "reactions-" +
                    messageId
                );


            if (!box) {
                return;
            }


            box.innerHTML = "";


            Object.keys(counts).forEach(

                function(reaction) {

                    const item =
                        document.createElement(
                            "span"
                        );


                    item.className =
                        "reaction-item";


                    item.textContent =
                        reaction +
                        " " +
                        counts[reaction];


                    box.appendChild(
                        item
                    );

                }

            );

        }

    );

}


/* ========================================
   REACTION MENU
======================================== */

function showReactionMenu(
    messageElement
) {

    const menu =
        document.getElementById(
            "reactionMenu"
        );


    const rect =
        messageElement.getBoundingClientRect();


    menu.style.display =
        "flex";


    let top =
        rect.top - 55;


    if (top < 10) {

        top =
            rect.bottom + 5;

    }


    menu.style.top =
        top + "px";


    menu.style.left =
        Math.max(
            10,
            Math.min(
                rect.left,
                window.innerWidth - 260
            )
        ) + "px";

}


/* ========================================
   REACTION BUTTONS
======================================== */

document
    .querySelectorAll(
        "#reactionMenu button"
    )
    .forEach(

        function(button) {

            button.addEventListener(

                "click",

                async function() {

                    if (
                        !selectedMessage ||
                        !currentUser
                    ) {

                        return;

                    }


                    const reaction =
                        this.dataset.reaction;


                    const reactionRef =
                        doc(

                            db,

                            "messages",

                            selectedMessage,

                            "reactions",

                            currentUser.uid

                        );


                    try {

                        await setDoc(

                            reactionRef,

                            {

                                uid:
                                    currentUser.uid,

                                reaction:
                                    reaction,

                                createdAt:
                                    serverTimestamp()

                            }

                        );

                    }

                    catch(error) {

                        console.error(error);

                        alert(
                            "⚠️ Reaction දාන්න බැරි වුණා."
                        );

                    }


                    hideMenus();

                }

            );

        }

    );


/* ========================================
   ADMIN MENU
======================================== */

function showAdminMenu(
    messageElement,
    data
) {

    const menu =
        document.getElementById(
            "adminMenu"
        );


    const pinButton =
        document.getElementById(
            "pinButton"
        );


    const blockButton =
        document.getElementById(
            "blockButton"
        );


    const unblockButton =
        document.getElementById(
            "unblockButton"
        );


    if (data.pinned) {

        pinButton.textContent =
            "📌 Unpin Message";

    }

    else {

        pinButton.textContent =
            "📌 Pin Message";

    }


    if (
        data.uid ===
        ADMIN_UID
    ) {

        blockButton.style.display =
            "none";

        unblockButton.style.display =
            "none";

    }

    else {

        blockButton.style.display =
            "block";

        unblockButton.style.display =
            "block";

    }


    const rect =
        messageElement.getBoundingClientRect();


    menu.style.display =
        "block";


    menu.style.top =
        Math.min(
            rect.bottom + 5,
            window.innerHeight - 160
        ) + "px";


    menu.style.left =
        Math.min(
            rect.left,
            window.innerWidth - 210
        ) + "px";

}


/* ========================================
   PIN / UNPIN
======================================== */

document.getElementById(
    "pinButton"
).addEventListener(

    "click",

    async function() {

        if (
            currentUser.uid !==
            ADMIN_UID
        ) {

            return;

        }


        if (!selectedMessage) {
            return;
        }


        const messageRef =
            doc(
                db,
                "messages",
                selectedMessage
            );


        const snap =
            await getDoc(
                messageRef
            );


        if (!snap.exists()) {
            return;
        }


        const data =
            snap.data();


        const newPinned =
            !data.pinned;


        /* Unpin all existing messages first */

        if (newPinned) {

            const allMessages =
                await getDoc(
                    messageRef
                );

        }


        await setDoc(

            messageRef,

            {

                pinned:
                    newPinned

            },

            {
                merge: true
            }

        );


        hideMenus();

    }

);


/* ========================================
   BLOCK
======================================== */

document.getElementById(
    "blockButton"
).addEventListener(

    "click",

    async function() {

        if (
            currentUser.uid !==
            ADMIN_UID
        ) {

            return;

        }


        if (!selectedStudent) {
            return;
        }


        if (
            selectedStudent ===
            ADMIN_UID
        ) {

            return;

        }


        try {

            await setDoc(

                doc(
                    db,
                    "blockedUsers",
                    selectedStudent
                ),

                {

                    uid:
                        selectedStudent,

                    blockedAt:
                        serverTimestamp(),

                    blockedBy:
                        ADMIN_UID

                }

            );


            alert(
                "🚫 Student Block කළා."
            );


            hideMenus();

        }

        catch(error) {

            console.error(error);

            alert(
                "⚠️ Block කරන්න බැරි වුණා."
            );

        }

    }

);


/* ========================================
   UNBLOCK
======================================== */

document.getElementById(
    "unblockButton"
).addEventListener(

    "click",

    async function() {

        if (
            currentUser.uid !==
            ADMIN_UID
        ) {

            return;

        }


        if (!selectedStudent) {
            return;
        }


        if (
            selectedStudent ===
            ADMIN_UID
        ) {

            return;

        }


        try {

            await deleteDoc(

                doc(
                    db,
                    "blockedUsers",
                    selectedStudent
                )

            );


            alert(
                "✅ Student Unblock කළා."
            );


            hideMenus();

        }

        catch(error) {

            console.error(error);

            alert(
                "⚠️ Unblock කරන්න බැරි වුණා."
            );

        }

    }

);


/* ========================================
   SEND MESSAGE
======================================== */

document.getElementById(
    "sendButton"
).addEventListener(
    "click",
    sendMessage
);


document.getElementById(
    "messageInput"
).addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);


/* ========================================
   SEND
======================================== */

async function sendMessage() {

    if (!currentUser) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const blocked =
        await isUserBlocked(
            currentUser.uid
        );


    if (blocked) {

        alert(
            "🚫 ඔබට message යවන්න අවසර නැහැ."
        );

        await checkBlocked();

        return;

    }


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    sendButton.disabled =
        true;


    try {

        /* ADMIN NAME FIX */

        const displayName =
            currentUser.uid === ADMIN_UID
            ? "ADMIN"
            : (
                currentUser.displayName ||
                "Student"
            );


        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                uid:
                    currentUser.uid,

                name:
                    displayName,

                text:
                    text,

                createdAt:
                    serverTimestamp(),

                pinned:
                    false

            }

        );


        input.value = "";

    }

    catch(error) {

        console.error(error);


        alert(
            "⚠️ Message send කරන්න බැරි වුණා."
        );

    }


    sendButton.disabled =
        false;

}


/* ========================================
   CHECK BLOCKED
======================================== */

async function isUserBlocked(
    uid
) {

    const ref =
        doc(
            db,
            "blockedUsers",
            uid
        );


    const snap =
        await getDoc(
            ref
        );


    return snap.exists();

}


/* ========================================
   PINNED DISPLAY
======================================== */

function updatePinnedMessage(
    messageId,
    data
) {

    const area =
        document.getElementById(
            "pinnedArea"
        );


    const text =
        document.getElementById(
            "pinnedMessage"
        );


    if (
        data &&
        data.pinned
    ) {

        const displayName =
            data.uid === ADMIN_UID
            ? "ADMIN"
            : (
                data.name ||
                "Student"
            );


        area.style.display =
            "block";


        text.textContent =
            displayName +
            ": " +
            (data.text || "");

    }

    else {

        hidePinned();

    }

}


/* ========================================
   HIDE PINNED
======================================== */

function hidePinned() {

    const area =
        document.getElementById(
            "pinnedArea"
        );


    area.style.display =
        "none";


    document.getElementById(
        "pinnedMessage"
    ).textContent =
        "";

}


/* ========================================
   HIDE MENUS
======================================== */

function hideMenus() {

    document.getElementById(
        "reactionMenu"
    ).style.display =
        "none";


    document.getElementById(
        "adminMenu"
    ).style.display =
        "none";

}


/* ========================================
   OUTSIDE CLICK
======================================== */

document.addEventListener(

    "click",

    function(event) {

        if (
            !event.target.closest(
                ".reaction-menu"
            ) &&
            !event.target.closest(
                ".admin-menu"
            ) &&
            !event.target.closest(
                ".message"
            )
        ) {

            hideMenus();

        }

    }

);


/* ========================================
   SCROLL
======================================== */

function scrollToBottom() {

    setTimeout(

        function() {

            window.scrollTo(

                0,

                document.body.scrollHeight

            );

        },

        100

    );

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
