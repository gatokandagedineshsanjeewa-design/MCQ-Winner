<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MCQ Winner - Discussion</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef4ff;
    color: #172554;
}


/* HEADER */

.header {
    background: linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb
    );

    color: white;
    text-align: center;

    padding: 25px 15px;

    border-radius: 0 0 25px 25px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 7px 0 0;
}


/* CHAT CONTAINER */

.chat-container {

    width: 94%;
    max-width: 650px;

    margin: 20px auto;

    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.10);
}


/* CHAT HEADER */

.chat-header {

    padding: 15px;

    background: #172554;

    color: white;

    text-align: center;

    font-weight: bold;
}


/* MESSAGES */

.messages {

    height: 58vh;

    min-height: 400px;

    overflow-y: auto;

    padding: 15px;

    background: #f8fafc;
}


/* MESSAGE */

.message {

    margin-bottom: 14px;

    max-width: 82%;
}

.message.mine {

    margin-left: auto;

    text-align: right;
}


.message-name {

    font-size: 12px;

    color: #64748b;

    margin-bottom: 4px;
}


.message-bubble {

    display: inline-block;

    padding: 11px 14px;

    border-radius: 14px;

    background: white;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,0.08);

    text-align: left;

    line-height: 1.45;
}


.mine .message-bubble {

    background: #dbeafe;

}


.message-time {

    font-size: 10px;

    color: #94a3b8;

    margin-top: 4px;
}


/* INPUT */

.input-area {

    display: flex;

    gap: 8px;

    padding: 12px;

    background: white;

    border-top: 1px solid #e2e8f0;
}


#messageInput {

    flex: 1;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 22px;

    outline: none;

    font-size: 15px;
}


#sendButton {

    width: 48px;

    height: 48px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


#sendButton:disabled {

    opacity: 0.5;

}


/* STATUS */

#status {

    text-align: center;

    padding: 8px;

    color: #64748b;

    font-size: 13px;
}


/* FOOTER */

.footer {

    text-align: center;

    padding: 20px;

    color: #64748b;

    font-size: 14px;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>💬 Discussion</h1>

    <p>
        එකතුවෙලා ඉගෙන ගමු 💪
    </p>

</div>



<!-- CHAT -->

<div class="chat-container">


    <div class="chat-header">

        🟢 Public Discussion

    </div>


    <div id="status">

        Chat load වෙමින්...

    </div>


    <div
        id="messages"
        class="messages"
    ></div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Message එක ලියන්න..."
            autocomplete="off"
        >

        <button
            id="sendButton"
        >
            ➤
        </button>

    </div>


</div>



<div class="footer">

    MCQ Winner © 2026

    <br>

    එකතුවෙලා ගොඩයමු ❤️

</div>



<script type="module">


/* ========================================
   FIREBASE
======================================== */


import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

    getFirestore,

    collection,

    addDoc,

    query,

    orderBy,

    onSnapshot,

    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* ========================================
   FIREBASE CONFIG
======================================== */


const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:
        "mcq-winner",

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:
        "1022060912943",

    appId:
        "1:1022060912943:web:f6e58414867e32f685c1da",

    measurementId:
        "G-MBH3NZ728H"

};



/* ========================================
   INITIALIZE
======================================== */


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* ========================================
   ELEMENTS
======================================== */


const messages =
    document.getElementById(
        "messages"
    );


const input =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const status =
    document.getElementById(
        "status"
    );



/* ========================================
   CURRENT USER
======================================== */


let currentUser = null;



onAuthStateChanged(

    auth,

    function(user) {


        if (!user) {

            window.location.href =
                "./login.html";

            return;

        }


        currentUser = user;


        status.innerText =
            "🟢 Online";


        loadMessages();

    }

);



/* ========================================
   LOAD MESSAGES
======================================== */


function loadMessages() {


    const messagesQuery =

        query(

            collection(
                db,
                "discussionMessages"
            ),

            orderBy(
                "createdAt",
                "asc"
            )

        );


    onSnapshot(

        messagesQuery,

        function(snapshot) {


            messages.innerHTML = "";


            snapshot.forEach(

                function(docSnap) {


                    const data =
                        docSnap.data();


                    const message =
                        document.createElement(
                            "div"
                        );


                    message.className =
                        "message";


                    if (
                        currentUser &&
                        data.uid ===
                        currentUser.uid
                    ) {

                        message.classList.add(
                            "mine"
                        );

                    }


                    const name =
                        escapeHTML(
                            data.name ||
                            "Student"
                        );


                    const text =
                        escapeHTML(
                            data.text ||
                            ""
                        );


                    let time = "";


                    if (
                        data.createdAt &&
                        data.createdAt.toDate
                    ) {

                        time =
                            data.createdAt
                                .toDate()
                                .toLocaleTimeString(
                                    "si-LK",
                                    {
                                        hour:
                                            "2-digit",

                                        minute:
                                            "2-digit"
                                    }
                                );

                    }


                    message.innerHTML =

                        "<div class='message-name'>" +

                        name +

                        "</div>" +

                        "<div class='message-bubble'>" +

                        text +

                        "</div>" +

                        "<div class='message-time'>" +

                        time +

                        "</div>";


                    messages.appendChild(
                        message
                    );

                }

            );


            messages.scrollTop =
                messages.scrollHeight;

        },

        function(error) {


            console.error(error);


            status.innerText =
                "❌ Messages load කරන්න බැහැ";


            alert(
                "Firestore Error:\n\n" +
                error.message
            );

        }

    );

}



/* ========================================
   SEND MESSAGE
======================================== */


async function sendMessage() {


    if (!currentUser) {

        alert(
            "කරුණාකර Login වෙන්න."
        );

        return;

    }


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    sendButton.disabled =
        true;


    try {


        await addDoc(

            collection(
                db,
                "discussionMessages"
            ),

            {

                text:
                    text,

                name:
                    currentUser.displayName ||
                    "Student",

                uid:
                    currentUser.uid,

                createdAt:
                    serverTimestamp()

            }

        );


        input.value = "";


    }

    catch(error) {


        console.error(error);


        alert(
            "Message යවන්න බැරි වුණා:\n\n" +
            error.message
        );

    }


    sendButton.disabled =
        false;

}



/* ========================================
   SEND BUTTON
======================================== */


sendButton.addEventListener(

    "click",

    sendMessage

);



/* ========================================
   ENTER TO SEND
======================================== */


input.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);



/* ========================================
   SECURITY
======================================== */


function escapeHTML(text) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


</script>


</body>

</html>
