<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MCQ Winner - Rank List</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef4ff;
    color: #172554;
}


/* HEADER */

.header {
    background: linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb
    );

    color: white;
    text-align: center;

    padding: 28px 20px 35px;

    border-radius:
        0 0 28px 28px;
}

.header .logo {
    font-size: 48px;
}

.header h1 {
    margin: 5px 0;
    font-size: 30px;
}

.header p {
    margin: 8px 0 0;
    opacity: 0.9;
}


/* CONTAINER */

.container {
    width: 94%;
    max-width: 700px;
    margin: 22px auto;
}


/* BACK BUTTON */

.back-btn {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    background: white;

    color: #1e3a8a;

    font-size: 17px;

    font-weight: bold;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.08);

    cursor: pointer;

    margin-bottom: 20px;
}


/* SUBJECT BOX */

.subject-box {
    background: white;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 25px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}

.subject-title {
    text-align: center;

    margin-bottom: 18px;

    font-size: 24px;

    font-weight: bold;
}


/* MY RANK */

.my-rank {
    background: #eff6ff;

    border: 2px solid #bfdbfe;

    border-radius: 15px;

    padding: 16px;

    text-align: center;

    margin-bottom: 20px;
}

.my-rank h3 {
    margin: 0 0 8px;
}

.my-rank .rank-number {
    font-size: 30px;

    font-weight: bold;

    color: #1d4ed8;
}

.my-rank p {
    margin: 5px 0;
}


/* RANK ROW */

.rank-row {
    display: flex;

    align-items: center;

    gap: 10px;

    background: #f8fafc;

    padding: 12px;

    margin: 8px 0;

    border-radius: 12px;

    transition: 0.2s;
}


/* MY ROW */

.my-row {
    border: 3px solid #2563eb;

    background: #dbeafe;

    box-shadow:
        0 3px 12px
        rgba(37,99,235,0.18);
}


.rank-number {
    width: 42px;

    text-align: center;

    font-size: 20px;

    font-weight: bold;
}

.rank-name {
    flex: 1;

    min-width: 0;
}

.rank-name strong {
    display: block;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.rank-name small {
    color: #64748b;
}

.rank-score {
    text-align: right;

    font-weight: bold;

    white-space: nowrap;
}

.rank-time {
    color: #475569;

    font-size: 13px;

    margin-top: 3px;
}


/* TOP THREE */

.first {
    background: #fef3c7;
}

.second {
    background: #f1f5f9;
}

.third {
    background: #ffedd5;
}


/* EMPTY / LOADING */

.loading,
.empty {
    text-align: center;

    padding: 25px;

    color: #64748b;
}


/* FOOTER */

.footer {
    text-align: center;

    padding: 25px 10px;

    color: #64748b;

    font-size: 14px;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="logo">
        🏆
    </div>

    <h1>
        Rank List
    </h1>

    <p>
        අද Top 20
    </p>

</div>



<div class="container">


    <!-- BACK -->

    <button
        class="back-btn"
        onclick="window.location.href='index.html'"
    >
        ← Home
    </button>



    <!-- CHEMISTRY -->

    <div class="subject-box">

        <div class="subject-title">
            🧪 Chemistry
        </div>


        <div
            id="chemistryMyRank"
            class="my-rank"
        >
            <div class="loading">
                Rank බලමින්...
            </div>
        </div>


        <div
            id="chemistryList"
        >
            <div class="loading">
                Loading...
            </div>
        </div>

    </div>



    <!-- PHYSICS -->

    <div class="subject-box">

        <div class="subject-title">
            ⚡ Physics
        </div>


        <div
            id="physicsMyRank"
            class="my-rank"
        >
            <div class="loading">
                Rank බලමින්...
            </div>
        </div>


        <div
            id="physicsList"
        >
            <div class="loading">
                Loading...
            </div>
        </div>

    </div>


</div>



<!-- FOOTER -->

<div class="footer">

    MCQ Winner © 2026

    <br>

    එකතුවෙලා ගොඩයමු ❤️

</div>



<script type="module">


// ========================================
// FIREBASE APP
// ========================================

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";



// ========================================
// FIREBASE AUTH
// ========================================

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



// ========================================
// FIRESTORE
// ========================================

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



// ========================================
// FIREBASE CONFIG
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAMkaGYmBuoFama5MW5AhoX9q6cly_-nbg",

    authDomain:
        "mcq-winner.firebaseapp.com",

    projectId:
        "mcq-winner",

    storageBucket:
        "mcq-winner.firebasestorage.app",

    messagingSenderId:
        "1022060912943",

    appId:
        "1:1022060912943:web:f6e58414867e32f685c1da",

    measurementId:
        "G-MBH3NZ728H"

};



// ========================================
// INITIALIZE
// ========================================

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);



// ========================================
// CURRENT USER
// ========================================

let currentUser = null;



// ========================================
// SRI LANKA TIME
// ========================================

function getSriLankaTime() {

    return new Date(

        new Date().toLocaleString(
            "en-US",
            {
                timeZone:
                    "Asia/Colombo"
            }
        )

    );

}



// ========================================
// TODAY
// ========================================

function getToday() {

    const now =
        getSriLankaTime();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return (

        year +
        "-" +
        month +
        "-" +
        day

    );

}



// ========================================
// FORMAT TIME
// ========================================

function formatTime(
    totalSeconds
) {

    totalSeconds =
        Number(
            totalSeconds
        ) || 0;


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(minutes)
            .padStart(
                2,
                "0"
            ) +

        ":" +

        String(seconds)
            .padStart(
                2,
                "0"
            )

    );

}



// ========================================
// LOGIN CHECK
// ========================================

onAuthStateChanged(

    auth,

    async function(user) {

        if (!user) {

            window.location.href =
                "./login.html";

            return;

        }


        currentUser =
            user;


        await loadRanking(
            "Chemistry"
        );


        await loadRanking(
            "Physics"
        );

    }

);



// ========================================
// LOAD RANKING
// ========================================

async function loadRanking(
    subject
) {

    const listId =
        subject === "Chemistry"
        ? "chemistryList"
        : "physicsList";


    const myRankId =
        subject === "Chemistry"
        ? "chemistryMyRank"
        : "physicsMyRank";


    const listElement =
        document.getElementById(
            listId
        );


    const myRankElement =
        document.getElementById(
            myRankId
        );


    try {

        const q =
            query(

                collection(
                    db,
                    "results"
                ),

                where(
                    "subject",
                    "==",
                    subject
                ),

                where(
                    "date",
                    "==",
                    getToday()
                )

            );


        const snapshot =
            await getDocs(q);


        const results = [];


        snapshot.forEach(

            function(docSnap) {

                results.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }

        );


        // ====================================
        // SORT
        // SCORE DESCENDING
        // TIME ASCENDING
        // ====================================

        results.sort(

            function(a, b) {

                const scoreA =
                    Number(
                        a.score
                    ) || 0;


                const scoreB =
                    Number(
                        b.score
                    ) || 0;


                if (
                    scoreA !==
                    scoreB
                ) {

                    return (
                        scoreB -
                        scoreA
                    );

                }


                const timeA =
                    Number(
                        a.timeTaken
                    ) || 0;


                const timeB =
                    Number(
                        b.timeTaken
                    ) || 0;


                return (
                    timeA -
                    timeB
                );

            }

        );



        // ====================================
        // SHOW TOP 20
        // ====================================

        const top20 =
            results.slice(
                0,
                20
            );


        if (top20.length === 0) {

            listElement.innerHTML = `

                <div class="empty">

                    📝 අද ${subject}
                    Result තවම නැහැ.

                </div>

            `;

        }

        else {

            listElement.innerHTML =
                "";


            top20.forEach(

                function(item, index) {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "rank-row";


                    // ====================================
                    // HIGHLIGHT CURRENT USER
                    // ====================================

                    if (
                        item.uid ===
                        currentUser.uid
                    ) {

                        row.classList.add(
                            "my-row"
                        );

                    }


                    // ====================================
                    // TOP THREE STYLE
                    // ====================================

                    if (
                        index === 0
                    ) {

                        row.classList.add(
                            "first"
                        );

                    }

                    else if (
                        index === 1
                    ) {

                        row.classList.add(
                            "second"
                        );

                    }

                    else if (
                        index === 2
                    ) {

                        row.classList.add(
                            "third"
                        );

                    }


                    const rankIcon =
                        index === 0
                        ? "🥇"
                        : index === 1
                        ? "🥈"
                        : index === 2
                        ? "🥉"
                        : (index + 1);


                    row.innerHTML = `

                        <div class="rank-number">

                            ${rankIcon}

                        </div>


                        <div class="rank-name">

                            <strong>

                                ${
                                    item.name ||
                                    "Student"
                                }

                                ${
                                    item.uid ===
                                    currentUser.uid
                                    ? " 👤 You"
                                    : ""
                                }

                            </strong>

                            <small>

                                ${item.score}/25

                            </small>

                        </div>


                        <div class="rank-score">

                            ⏱️

                            <div class="rank-time">

                                ${
                                    formatTime(
                                        item.timeTaken
                                    )
                                }

                            </div>

                        </div>

                    `;


                    listElement.appendChild(
                        row
                    );

                }

            );

        }



        // ====================================
        // FIND CURRENT USER
        // ====================================

        const myResults =
            results.filter(

                function(item) {

                    return (
                        item.uid ===
                        currentUser.uid
                    );

                }

            );


        if (
            myResults.length === 0
        ) {

            myRankElement.innerHTML = `

                <h3>
                    👤 ඔබේ ${subject} Rank
                </h3>

                <p>
                    අද ${subject} Test එක
                    තවම කරලා නැහැ.
                </p>

            `;

        }

        else {

            const myResult =
                myResults[0];


            const myIndex =
                results.findIndex(

                    function(item) {

                        return (
                            item.id ===
                            myResult.id
                        );

                    }

                );


            const myRank =
                myIndex + 1;


            myRankElement.innerHTML = `

                <h3>
                    👤 ඔබේ ${subject} Rank
                </h3>

                <div class="rank-number">

                    #${myRank}

                </div>

                <p>

                    🏆 Score:
                    <b>
                        ${myResult.score}/25
                    </b>

                </p>

                <p>

                    ⏱️ Time:
                    <b>
                        ${
                            formatTime(
                                myResult.timeTaken
                            )
                        }
                    </b>

                </p>

            `;

        }

    }

    catch(error) {

        console.error(
            subject +
            " ranking error:",
            error
        );


        listElement.innerHTML = `

            <div class="empty">

                ⚠️ Rank List එක
                load කරන්න බැරි වුණා.

            </div>

        `;


        myRankElement.innerHTML = `

            <p>
                ⚠️ ඔබේ Rank එකත්
                ලබාගන්න බැරි වුණා.
            </p>

        `;

    }

}

</script>


</body>

</html>
