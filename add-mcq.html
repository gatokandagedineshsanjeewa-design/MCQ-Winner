/* ========================================
   SCIENTIFIC SYMBOL INSERT
======================================== */

function insertSymbol(
    inputId,
    symbol
) {

    const input =
        document.getElementById(
            inputId
        );

    if (!input) {

        return;

    }


    const start =
        input.selectionStart;


    const end =
        input.selectionEnd;


    const oldText =
        input.value;


    input.value =

        oldText.substring(
            0,
            start
        ) +

        symbol +

        oldText.substring(
            end
        );


    input.focus();


    input.selectionStart =
        input.selectionEnd =
        start + symbol.length;

}



/* ========================================
   MAKE FUNCTION AVAILABLE TO HTML
======================================== */

/* ========================================
   TODAY
======================================== */

function getToday() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}

/* ========================================
   AUTH STATE
======================================== */

onAuthStateChanged(

    auth,

    function(user) {

        if (!user) {

            currentUser =
                null;

            pinUnlocked =
                false;

            document.getElementById(
                "loginPanel"
            ).style.display =
                "block";

            document.getElementById(
                "pinPanel"
            ).style.display =
                "none";

            document.getElementById(
                "adminPanel"
            ).style.display =
                "none";

            return;

        }


        currentUser =
            user;


        if (
            user.uid !==
            ADMIN_UID
        ) {

            document.getElementById(
                "loginPanel"
            ).style.display =
                "block";

            document.getElementById(
                "pinPanel"
            ).style.display =
                "none";

            document.getElementById(
                "adminPanel"
            ).style.display =
                "none";


            document.getElementById(
                "loginMessage"
            ).textContent =
                "🚫 මෙම Google Account එකට Admin access නැහැ.";

            document.getElementById(
                "loginMessage"
            ).style.color =
                "red";


            signOut(auth);

            return;

        }


        document.getElementById(
            "loginPanel"
        ).style.display =
            "none";


        document.getElementById(
            "pinPanel"
        ).style.display =
            "block";


        document.getElementById(
            "userBox"
        ).textContent =

            "👑 Admin: " +

            (
                user.displayName ||
                "Admin"
            ) +

            "\n" +

            (
                user.email ||
                ""
            );

    }

);



/* ========================================
   PIN LOGIN
======================================== */

document
    .getElementById(
        "pinLoginButton"
    )
    .addEventListener(

        "click",

        unlockAdmin

    );


document
    .getElementById(
        "pin"
    )
    .addEventListener(

        "keydown",

        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                unlockAdmin();

            }

        }

    );


function unlockAdmin() {

    const pin =
        document.getElementById(
            "pin"
        ).value;


    const message =
        document.getElementById(
            "pinMessage"
        );


    if (
        !currentUser ||
        currentUser.uid !==
        ADMIN_UID
    ) {

        message.textContent =
            "🚫 Admin access denied.";

        message.style.color =
            "red";

        return;

    }


    if (
        pin ===
        ADMIN_PIN
    ) {

        pinUnlocked =
            true;


        document.getElementById(
            "pinPanel"
        ).style.display =
            "none";


        document.getElementById(
            "adminPanel"
        ).style.display =
            "block";


        showQuestions();

    }

    else {

        message.textContent =
            "❌ වැරදි Admin PIN එකක්.";

        message.style.color =
            "red";

    }

}



/* ========================================
   GET TODAY QUESTIONS
======================================== */

async function getQuestions() {

    const today =
        getToday();


    const q =
        query(

            collection(
                db,
                "mcqs"
            ),

            where(
                "date",
                "==",
                today
            )

        );


    const snapshot =
        await getDocs(q);


    const questions =
        [];


    snapshot.forEach(

        function(docSnap) {

            questions.push({

                id:
                    docSnap.id,

                ...docSnap.data()

            });

        }

    );


    return questions;

}



/* ========================================
   ADD QUESTION
======================================== */

document
    .getElementById(
        "addButton"
    )
    .addEventListener(

        "click",

        addQuestion

    );


async function addQuestion() {

    const message =
        document.getElementById(
            "addMessage"
        );


    if (
        !currentUser ||
        currentUser.uid !==
        ADMIN_UID ||
        !pinUnlocked
    ) {

        message.textContent =
            "🚫 Admin access required.";

        message.style.color =
            "red";

        return;

    }


    const subject =
        document.getElementById(
            "subject"
        ).value;


    const question =
        document.getElementById(
            "question"
        ).value.trim();


    const options = [

        document.getElementById(
            "option1"
        ).value.trim(),

        document.getElementById(
            "option2"
        ).value.trim(),

        document.getElementById(
            "option3"
        ).value.trim(),

        document.getElementById(
            "option4"
        ).value.trim(),

        document.getElementById(
            "option5"
        ).value.trim()

    ];


    const answer =
        Number(
            document.getElementById(
                "answer"
            ).value
        );



    /* ====================================
       EMPTY CHECK
    ==================================== */

    if (
        question === "" ||
        options.some(
            function(option) {

                return option === "";

            }
        )
    ) {

        message.textContent =
            "⚠️ සියලුම තැන් පුරවන්න.";

        message.style.color =
            "red";

        return;

    }



    try {


        const questions =
            await getQuestions();


        const subjectCount =
            questions.filter(

                function(item) {

                    return (
                        item.subject ===
                        subject
                    );

                }

            ).length;


        if (
            subjectCount >= 25
        ) {

            message.textContent =
                "⚠️ " +
                subject +
                " සඳහා අද MCQ 25 සම්පූර්ණයි.";

            message.style.color =
                "red";

            return;

        }



        /* ==================================
           SAVE
        ================================== */

        await addDoc(

            collection(
                db,
                "mcqs"
            ),

            {

                subject:
                    subject,

                question:
                    question,

                options:
                    options,

                answer:
                    answer,

                date:
                    getToday(),

                createdAt:
                    new Date(),

                createdBy:
                    currentUser.uid

            }

        );



        /* ==================================
           SUCCESS
        ================================== */

        message.textContent =
            "✅ MCQ එක සාර්ථකව Save කළා!";

        message.style.color =
            "green";



        /* ==================================
           CLEAR
        ================================== */

        document.getElementById(
            "question"
        ).value = "";


        document.getElementById(
            "option1"
        ).value = "";


        document.getElementById(
            "option2"
        ).value = "";


        document.getElementById(
            "option3"
        ).value = "";


        document.getElementById(
            "option4"
        ).value = "";


        document.getElementById(
            "option5"
        ).value = "";


        await showQuestions();

    }

    catch(error) {

        console.error(error);

        message.textContent =
            "❌ Save Error: " +
            error.message;

        message.style.color =
            "red";

    }

}



/* ========================================
   SHOW QUESTIONS
======================================== */

async function showQuestions() {

    const list =
        document.getElementById(
            "questionList"
        );


    list.innerHTML =
        "⏳ Loading...";


    try {

        const questions =
            await getQuestions();


        list.innerHTML =
            "";


        if (
            questions.length === 0
        ) {

            list.innerHTML =
                "<p>අදට තවම MCQ add කරලා නැහැ.</p>";

            updateStatus(
                questions
            );

            return;

        }


        questions.forEach(

            function(item, index) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "question-item";


                div.innerHTML = `

                    <b>
                        ${index + 1}.
                        ${escapeHTML(
                            item.question
                        )}
                    </b>

                    <p>
                        Subject:
                        ${escapeHTML(
                            item.subject
                        )}
                    </p>

                    <p>
                        1. ${escapeHTML(
                            item.options[0]
                        )}<br>

                        2. ${escapeHTML(
                            item.options[1]
                        )}<br>

                        3. ${escapeHTML(
                            item.options[2]
                        )}<br>

                        4. ${escapeHTML(
                            item.options[3]
                        )}<br>

                        5. ${escapeHTML(
                            item.options[4]
                        )}
                    </p>

                    <p class="correct">

                        ✅ නිවැරදි පිළිතුර:
                        ${item.answer + 1}

                    </p>

                    <button
                        class="delete-btn"
                        data-id="${item.id}"
                    >

                        🗑️ Delete

                    </button>

                `;


                div
                    .querySelector(
                        ".delete-btn"
                    )
                    .addEventListener(

                        "click",

                        function() {

                            deleteQuestion(
                                item.id
                            );

                        }

                    );


                list.appendChild(
                    div
                );

            }

        );


        updateStatus(
            questions
        );

    }

    catch(error) {

        console.error(error);

        list.innerHTML =
            "❌ Questions load error: " +
            error.message;

    }

}



/* ========================================
   STATUS
======================================== */

function updateStatus(
    questions
) {

    const chemistry =
        questions.filter(

            function(item) {

                return (
                    item.subject ===
                    "Chemistry"
                );

            }

        ).length;


    const physics =
        questions.filter(

            function(item) {

                return (
                    item.subject ===
                    "Physics"
                );

            }

        ).length;


    const total =
        chemistry +
        physics;


    document.getElementById(
        "status"
    ).innerHTML =

        "📅 " +
        getToday() +

        "<br><br>" +

        "🧪 Chemistry: " +
        chemistry +
        " / 25" +

        "<br>" +

        "⚡ Physics: " +
        physics +
        " / 25" +

        "<br><br>" +

        "📚 Total: " +
        total +
        " / 50";

}



/* ========================================
   DELETE QUESTION
======================================== */

async function deleteQuestion(
    id
) {

    if (
        !currentUser ||
        currentUser.uid !==
        ADMIN_UID ||
        !pinUnlocked
    ) {

        alert(
            "🚫 Admin access required."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "මෙම MCQ එක Delete කරන්නද?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        await deleteDoc(

            doc(
                db,
                "mcqs",
                id
            )

        );


        alert(
            "✅ MCQ එක Delete කළා."
        );


        showQuestions();

    }

    catch(error) {

        console.error(error);

        alert(
            "❌ Delete Error: " +
            error.message
        );

    }

}

async function startNewDay() {

    if (
        !currentUser ||
        currentUser.uid !==
        ADMIN_UID ||
        !pinUnlocked
    ) {

        return;

    }


    const confirmNewDay =
        confirm(

            "⚠️ අද තිබෙන සියලුම MCQ මැකීමට අවශ්‍යද?\n\n" +

            "මෙය නැවත undo කරන්න බැහැ."

        );


    if (!confirmNewDay) {

        return;

    }


    try {

        const questions =
            await getQuestions();


        for (
            const item
            of questions
        ) {

            await deleteDoc(

                doc(
                    db,
                    "mcqs",
                    item.id
                )

            );

        }


        alert(
            "✅ New Day ආරම්භ කළා!"
        );


        showQuestions();

    }

    catch(error) {

        console.error(error);

        alert(
            "❌ New Day Error: " +
            error.message
        );

    }

}

/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}
